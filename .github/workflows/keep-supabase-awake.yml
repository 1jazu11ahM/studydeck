# Supabase pauses free projects after 7 days without database activity.
# This pings the database every 3 days so sync never goes to sleep.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -sS --fail "https://qwhdrdbryslzpjoewvli.supabase.co/rest/v1/docs?select=id&limit=1" \
            -H "apikey: sb_publishable_ke35DS0n31oBosXc7rV9Kg_3jHg2C72"
