<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,"Segoe UI",Roboto,sans-serif;--t-lt:34px;--t-1:28px;--t-2:22px;--t-b:17px;--t-s:15px;--t-c:13px;--bg:#e9edf2;--card:#fff;--text:#18263a;--on-ink:#fff;--muted:#5d6b7e;--line:#d6dde6;--accent:#2449c9;--accent-2:#1b39a3;--accent-soft:#e3e9fb;--ok:#14895f;--ok-soft:#e1f4ec;--bad:#d93f45;--bad-soft:#fcebeb;--warn:#e0a019;--rule:#dbe5f3;--margin:#ef8a8e;--hl:#ffe14d;--shadow:0 1px 2px rgba(24,38,58,.06),0 10px 24px -14px rgba(24,38,58,.35);--r:10px;--hand:var(--sans)}
[data-theme=dark]{--bg:#10151c;--card:#1a212b;--text:#e7ecf3;--on-ink:#10151c;--muted:#97a3b4;--line:#2a3441;--accent:#86a2ff;--accent-2:#a4b9ff;--accent-soft:#222d47;--ok:#3fd19c;--ok-soft:#14352b;--bad:#ff7378;--bad-soft:#3a1f25;--rule:#243042;--margin:#a8484d;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font:16px/1.5 var(--sans);background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--hl);color:#18263a}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:600 11px/1 ui-monospace,monospace;padding:3px 5px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.top{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-bat{transform:rotate(-8deg);transition:transform .3s}
.logo:hover .logo-bat{transform:rotate(-8deg) translateY(-3px) scaleY(.8)}
.logo .word{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:27px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
[data-theme=midnight] .logo-bat{color:var(--text)}
.searchwrap{flex:1;max-width:460px;min-width:0}
.top input{width:100%}
.top .mob{display:none}
.top nav{display:flex;gap:8px;margin-left:auto;align-items:center}
main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
input,textarea,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--on-ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{padding:14px 26px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.okb{border-color:var(--ok);color:var(--ok)} .btn.okb:hover{background:var(--ok-soft)}
.btn.badb{border-color:var(--bad);color:var(--bad)} .btn.badb:hover{background:var(--bad-soft)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ico{border:0;background:transparent;cursor:pointer;font-size:17px;padding:4px 6px;border-radius:8px;color:var(--muted);line-height:1}
.ico:hover{background:var(--accent-soft);color:var(--accent)}
.star.on{color:#f5b400}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.setcard{display:flex;flex-direction:column;gap:6px;border-radius:4px;padding-top:30px;background-image:linear-gradient(var(--margin),var(--margin));background-size:100% 2px;background-position:0 16px;background-repeat:no-repeat;transition:transform .15s,box-shadow .15s}
.setcard:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 1px 2px rgba(24,38,58,.08),0 18px 30px -16px rgba(24,38,58,.45)}
.ttl{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.muted{color:var(--muted)} .sm{font-size:14px} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .end{justify-content:flex-end}
h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;overflow-wrap:anywhere} h2{font-size:20px;margin:28px 0 12px} h3{margin:0 0 12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:6px}
.bar.big{height:12px}
.bar i{display:block;height:100%;transition:width .3s}
.b-new{background:var(--line)} .b-learn{background:var(--warn)} .b-master{background:var(--ok)}
.legend{gap:18px;font-size:14px;color:var(--muted);margin-top:8px}
.legend.lp-legend{flex-direction:row;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.b-new{background:#b8bfd3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.stat .ic{color:var(--accent);margin-bottom:6px} .stat.streak .ic{color:#e8590c} .stat b{font-size:30px;line-height:1.1;letter-spacing:-.02em} .stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:18px 0}
.mode{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:10px;background:var(--card);border:2px solid var(--line);font-weight:700;transition:border-color .12s,transform .12s}
.mode .ic{color:var(--accent);margin-bottom:6px}
.mode small{font-weight:400;color:var(--muted);font-size:13px}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.terms .t{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.terms .t:last-child{border-bottom:0}
.terms .tt{font-weight:600}
.terms .t > div{overflow-wrap:anywhere}
.thumb{display:block;max-height:90px;max-width:160px;border-radius:8px;margin-top:6px}
.st-tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:6px}
.st-new{background:var(--line);color:var(--muted)} .st-learn{background:#fff1d6;color:#a86b00} .st-master{background:var(--ok-soft);color:var(--ok)}
[data-theme=dark] .st-learn{background:#3b2f12;color:#f5c050}
/* editor */
.erow{padding:12px 16px}
.egrid{display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:start;margin-top:4px}
.egrid label{display:flex;flex-direction:column;gap:2px}
.egrid textarea{border-width:0 0 2px;border-radius:0;background:transparent;padding:6px 0;min-height:38px;resize:none;overflow:hidden}
.egrid small{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.eimg{position:relative}.eimg img{max-width:110px;max-height:80px;border-radius:8px;display:block}
.eimg .ico{position:absolute;top:-8px;right:-8px;background:var(--card);border:1px solid var(--line)}
.add-row{width:100%;margin-top:12px;padding:18px;border-style:dashed}
.sticky-save{position:sticky;top:58px;z-index:5;background:var(--bg);padding:8px 0}
/* flashcards */
.flash-wrap{perspective:1600px;margin:16px 0}
.flash{position:relative;height:380px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}
.flash.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--card);background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px);background-size:100% 2px,100% 100%;background-position:0 46px,0 48px;background-repeat:no-repeat,repeat;border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 30px 30px;text-align:center;overflow:auto}
.face.back{transform:rotateX(180deg)}
.face img{max-height:170px;max-width:100%;border-radius:10px;margin-top:14px}
.face .tools{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.face .label{position:absolute;top:14px;left:18px;font-size:13px;color:var(--muted);font-weight:600}
.ftxt,.qtxt{font-family:var(--hand);font-size:32px;line-height:1.3;overflow-wrap:anywhere;white-space:normal}
.ftxt.md,.qtxt.md{font-size:25px}.ftxt.sm,.qtxt.sm{font-size:21px}.ftxt.xs,.qtxt.xs{font-size:18px}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;background:var(--text);transition:width .25s}
.done-box{padding:40px 24px;text-align:center}
.done-box .big-emoji{font-size:54px}
/* questions */
.qcard{padding:28px;margin-top:16px;border-radius:6px;border-top:3px solid var(--margin)}
.qimg{max-height:200px;max-width:100%;border-radius:10px;margin-top:10px}
.qhint{margin:26px 0 10px;font-weight:600}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:inherit;color:inherit;overflow-wrap:anywhere;transition:border-color .12s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.wform input{flex:1;min-width:200px;font-size:18px}
.fbx{margin-top:16px;font-weight:700;padding:10px 14px;border-radius:10px}
.fbx.ok{color:var(--ok);background:var(--ok-soft)} .fbx.bad{color:var(--bad);background:var(--bad-soft)}
.fbx.part{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)} .fbx.aiwait{color:var(--muted);background:color-mix(in srgb,var(--muted) 10%,transparent);display:flex;align-items:center;gap:10px;font-weight:600}
.aiscore{float:right;font-weight:600;opacity:.8}
.saved{margin:8px 2px 0}.saved .g{font-weight:600}.saved .g1{color:var(--bad)}.saved .g2{color:var(--warn)}.saved .g3,.saved .g4{color:var(--ok)}
.aifb{margin-top:12px;display:grid;gap:10px}.aifb p{margin:0;line-height:1.45}.aifb b{display:block;font-size:var(--t-c);color:var(--muted);font-weight:600;margin-bottom:2px}
.aiwho{display:flex;align-items:center;gap:6px;margin:10px 0 0}
.aitools{gap:8px;margin-top:12px;flex-wrap:wrap}.aitools:empty{display:none}
.xpl{gap:6px}.xpl .spin{width:14px;height:14px}
.aix{margin-top:12px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);display:grid;gap:10px}
.aix p{margin:0;line-height:1.45}.aix b{display:block;font-size:var(--t-c);color:var(--muted);font-weight:600;margin-bottom:2px}.aix .hook{font-weight:600}
.mixup{margin-top:12px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent)}.mixup>b:first-child{color:var(--warn)}
.lastmiss{margin:10px 2px 0;font-size:var(--t-s);line-height:1.45}.lastmiss.fixed{color:var(--ok);font-weight:600}
.retryhost:empty{display:none}.retryhost{margin-top:12px}.fbx.sm2{margin-top:10px;padding:8px 12px;font-size:var(--t-s)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.ans{margin-top:12px}.ans small{display:block;color:var(--muted);font-weight:600}
.ans .okc{border:2px solid var(--ok);border-radius:10px;padding:8px 12px;margin-top:4px}
.ans .strike{border:2px dashed var(--bad);border-radius:10px;padding:8px 12px;margin-top:4px;color:var(--bad)}
.rlist{display:flex;flex-direction:column;gap:6px;text-align:left;margin:16px 0 20px}
.ritem{display:grid;grid-template-columns:24px 1fr 2fr;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.ritem.ok span:first-child{color:var(--ok)} .ritem.bad span:first-child{color:var(--bad)}
.spell-diff{font-size:24px;letter-spacing:2px;font-family:ui-monospace,monospace;margin-top:8px}
.spell-diff .g{color:var(--ok)} .spell-diff .r{color:var(--bad);text-decoration:underline}
/* test */
.tq{margin-top:14px;padding:22px}
.tq.ok{border-left:5px solid var(--ok)} .tq.bad{border-left:5px solid var(--bad)}
.tqh{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
.tf{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:16px}
.tfeq{color:var(--muted);font-size:20px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mi{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mi select{padding:6px}
.mi.ok .mres{color:var(--ok);font-weight:700}.mi.bad .mres{color:var(--bad);font-weight:700}
.ma{padding:6px 0;border-bottom:1px solid var(--line)}
.score{display:flex;gap:26px;align-items:center;margin-top:16px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;font-weight:800;background:radial-gradient(closest-side,var(--card) 76%,transparent 77%),conic-gradient(var(--ok) calc(var(--p)*1%),var(--bad-soft) 0)}
/* match */
.match-hud{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.timer{font:700 28px ui-monospace,monospace}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{min-height:120px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:inherit;color:inherit;overflow-wrap:anywhere;font-size:15px;transition:opacity .25s,transform .25s,border-color .1s}
.tile img{max-height:60px;max-width:100%;border-radius:6px;margin-top:6px}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* gravity */
.grav{position:relative;height:460px;overflow:hidden;border-radius:16px;margin-top:16px;background:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff7,transparent),radial-gradient(1px 1px at 85% 60%,#fff9,transparent),radial-gradient(1px 1px at 10% 85%,#fff8,transparent),linear-gradient(#080c26,#1d2366)}
.ghud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:700;z-index:2}
.ast{position:absolute;max-width:46%;padding:16px 22px;border-radius:44px;color:#fff;text-align:center;font-weight:600;background:radial-gradient(circle at 30% 30%,#8a7bff,#4a3bc4 60%,#2b2380);box-shadow:0 0 24px #7a6bff88;overflow-wrap:anywhere}
.ast.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.6);opacity:0;filter:blur(4px)}}
.ground{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(#3dd6a0,#178a64);box-shadow:0 -4px 20px #3dd6a055}
.gmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;z-index:3;background:rgba(8,12,38,.7)}
.gmsg .okc{font-size:24px;font-weight:700;color:#7fffc8;margin:8px 0 14px}
.shake{animation:shake .35s}
/* modal & toast */

[data-theme=midnight]{color-scheme:dark;--bg:#0b0e14;--card:#151a23;--text:#ece8dc;--on-ink:#0b0e14;--muted:#8d95a3;--line:#262d3a;--accent:#f2c230;--accent-2:#ffd75a;--accent-soft:#2b2615;--ok:#4ccf8f;--ok-soft:#13302a;--bad:#ff6363;--bad-soft:#3a1c22;--warn:#f2c230;--rule:#1d2431;--margin:#9c7a1c;--hl:#f2c230;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8)}
[data-theme=midnight] body{background:transparent}
[data-theme=midnight] .top{background:rgba(17,21,29,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
[data-theme=midnight] .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e14}
[data-theme=midnight] .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#0b0e14}
[data-theme=midnight] .prog i{background:var(--accent)}
[data-theme=midnight] .ftxt{color:#f3efe2}
[data-theme=midnight] .st-learn{background:#3a2f0e;color:#f2c230}

[data-theme=midnight] h1,[data-theme=midnight] h2,[data-theme=midnight] .stat b,[data-theme=midnight] .mode,[data-theme=midnight] .timer,[data-theme=midnight] .ring,[data-theme=midnight] .ghud,[data-theme=midnight] .done-box h2,[data-theme=midnight] .qcard h2{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.02em}
[data-theme=midnight] h1{font-size:44px;font-weight:900;text-transform:uppercase;line-height:1}
[data-theme=midnight] h2{font-size:26px;font-weight:800}
[data-theme=midnight] .stat b{font-size:40px;font-weight:900}
[data-theme=midnight] .mode{font-size:21px;font-weight:800}

/* ===================== v2: minimal shell (all themes) ===================== */
:root{--on-accent:#fff}
[data-theme=midnight]{--on-accent:#0b0e14}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:0 24px;height:60px}
.top .tools{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.logo .word{font-size:23px}
.top .nav{display:flex;gap:2px;margin:0}
.nav a{position:relative;padding:8px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--muted);transition:color .15s}
.nav a:hover{color:var(--text)}
.nav a[aria-current=page]{color:var(--text)}
.nav a[aria-current=page]::after{content:'';position:absolute;left:14px;right:14px;bottom:-11px;height:2px;border-radius:2px;background:var(--accent)}
.navdot{display:none;position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.sync-warn .navdot{display:block}
#tabbar{display:none}
.wrap{max-width:720px;margin:0 auto}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:8px 0 24px}
.page-h h1{margin:0}
.lede{color:var(--muted);margin:4px 0 0}
.eyebrow{color:var(--muted);font-size:14px}
.sec{margin-top:36px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.sec-h h2{margin:0;font-size:16px;font-weight:600}
.sec-h a{font-size:14px;color:var(--muted)}.sec-h a:hover{color:var(--accent)}
/* home */
.hello h1{font-size:34px;font-weight:600;letter-spacing:-.025em;margin:2px 0 6px}
.briefing{color:var(--muted);font-size:17px;margin:0;max-width:56ch}
.start{display:flex;align-items:center;gap:18px;margin-top:28px;padding:22px 26px;border-radius:16px;background:var(--accent);color:var(--on-accent);transition:background .15s,transform .15s}
.start:hover{background:var(--accent-2)}
.start:active{transform:scale(.995)}
.start-t{flex:1;min-width:0;display:flex;flex-direction:column}
.start-l{font-size:21px;font-weight:650;letter-spacing:-.01em;line-height:1.2}

.start svg{flex:none;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 0 16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.list{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);min-width:0}
a.lrow:hover .lt{color:var(--accent)}
.lmain{flex:1;min-width:0}
.lt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.lm{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.lbar{width:72px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex:none}
.lbar i{display:block;height:100%;background:var(--accent)}
.chev{color:var(--muted);flex:none}
.resume{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s}
.resume:hover{border-color:#45474d}
.motto{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;gap:10px;align-items:baseline}
.motto svg{flex:none;color:var(--accent);opacity:.7;transform:translateY(2px)}
/* library */
.lsearch{position:relative;margin-bottom:18px}
.lsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.lsearch input{padding-left:38px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--muted);background:transparent;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--accent)}
/* progress + profile */
.goalrow{padding:14px 0;border-bottom:1px solid var(--line)}
.goalrow:first-child{padding-top:4px}
.rankrow{display:flex;align-items:center;gap:16px;padding:16px 18px}
.rankrow .badge{color:var(--accent);flex:none}
.prof{display:flex;align-items:center;gap:16px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:21px;flex:none}
.plist .opt{padding:14px 0}
.plist .opt:last-child{border-bottom:0}
.plist{padding:4px 18px}
.classic{font-size:14px;color:var(--muted)}.classic:hover{color:var(--accent)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'+ '}details.more[open] summary::before{content:'– '}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto;height:56px;padding:0 14px}
  .top .nav{display:none}
  #tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  #tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted)}
  #tabbar a[aria-current=page]{color:var(--accent)}
  #tabbar .navdot{top:4px;right:calc(50% - 16px)}
  body.studying #tabbar{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.studying main{padding-bottom:60px}
  .hello h1{font-size:28px}
  .start{padding:18px 20px;margin-top:22px}
  .start-l{font-size:19px}
  .kpi{padding-left:12px}.kpi b{font-size:24px}
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.k4 .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpis.k4 .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .lbar{display:none}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
/* ===================== v2: Charcoal theme ===================== */
[data-theme=charcoal]{color-scheme:dark;--bg:#141518;--card:#1b1d21;--text:#ebe9e4;--on-ink:#141518;--on-accent:#17150f;--muted:#8d8f96;--line:#2a2c31;--accent:#c6a660;--accent-2:#d4b672;--accent-soft:#29251c;--ok:#7cbf93;--ok-soft:#1a2820;--bad:#e2806f;--bad-soft:#2d1d1a;--warn:#c6a660;--rule:transparent;--margin:transparent;--hl:#c6a660;--shadow:none;--r:14px;--hand:var(--sans)}
[data-theme=charcoal] body{background:radial-gradient(900px 420px at 50% -260px,rgba(198,166,96,.07),transparent 70%) no-repeat,var(--bg)}
[data-theme=charcoal] ::selection{background:#c6a66055;color:#fff}
[data-theme=charcoal] .top{background:rgba(20,21,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-theme=charcoal] .logo-bat{color:var(--accent);transform:none}
[data-theme=charcoal] .logo:hover .logo-bat{transform:none}
[data-theme=charcoal] .logo .word{letter-spacing:.06em;font-weight:800}
[data-theme=charcoal] .card{box-shadow:none;border:1px solid var(--line);border-radius:14px}
[data-theme=charcoal] h1{font-size:30px;font-weight:600;letter-spacing:-.025em}
[data-theme=charcoal] h2{font-size:17px;font-weight:600}
[data-theme=charcoal] :is(input,textarea,select){border-width:1px;border-radius:10px;background:#17181b}
[data-theme=charcoal] .egrid textarea{background:transparent;border-width:0 0 1px}
[data-theme=charcoal] .btn{border-width:1px;border-radius:10px;font-weight:550}
[data-theme=charcoal] .btn:hover{border-color:#4a4c52}
[data-theme=charcoal] .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
[data-theme=charcoal] .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
[data-theme=charcoal] .btn.ghost:hover{background:#ffffff0a}
[data-theme=charcoal] .ico:hover{background:#ffffff0d;color:var(--text)}
[data-theme=charcoal] .setcard{background-image:none;padding-top:18px}
[data-theme=charcoal] .setcard:hover{transform:none;box-shadow:none;border-color:#3a3c42}
[data-theme=charcoal] .ttl{font-weight:600;font-size:17px}
[data-theme=charcoal] .face{background:var(--card);border-radius:18px;box-shadow:none}
[data-theme=charcoal] .ftxt,[data-theme=charcoal] .qtxt{font-weight:500;font-size:28px;letter-spacing:-.01em}
[data-theme=charcoal] .qcard{border-top:1px solid var(--line);border-radius:16px}
[data-theme=charcoal] .casehead{border-top:1px solid var(--line)}
[data-theme=charcoal] .mode{border-width:1px;border-radius:12px;font-weight:600}
[data-theme=charcoal] .mode:hover{transform:none;border-color:#45474d}
[data-theme=charcoal] .mode:hover .ic{transform:none}
[data-theme=charcoal] .choice,[data-theme=charcoal] .tile,[data-theme=charcoal] .envc{border-width:1px}
[data-theme=charcoal] .prog i{background:var(--accent)}
[data-theme=charcoal] .stamp{border-color:var(--accent);color:var(--accent);border-width:2px;font-size:15px;animation:none}
[data-theme=charcoal] .mini-stamp{border-color:var(--accent);color:var(--accent);top:14px}
[data-theme=charcoal] mark.dv{border-bottom:1px solid var(--accent)}
[data-theme=charcoal] .transmission{border-color:var(--line);background:var(--card)}
[data-theme=charcoal] .transmission::before{display:none}
[data-theme=charcoal] .tx-dot{background:var(--accent);animation:none}
[data-theme=charcoal] .face.front.interro .ftxt::after{content:none}
[data-theme=charcoal] .flash.flipped .face.back::after{content:none}

[data-theme=charcoal] #ambHint::before{border-width:1px}

/* ===================== v3: Apple-style layer ===================== */
/* type scale: 34 large title · 28 title · 22 section · 17 body · 15 secondary · 13 caption */
body{font-size:var(--t-b);line-height:1.47;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;text-rendering:optimizeLegibility}
h1,.hello h1,[data-theme=charcoal] h1{font-size:var(--t-lt);font-weight:700;letter-spacing:-.022em;line-height:1.12}
h2,[data-theme=charcoal] h2,.sec-h h2{font-size:var(--t-2);font-weight:600;letter-spacing:-.018em}
h3{font-size:var(--t-b);font-weight:600}
.sm,small,.muted.sm,.briefing,.lede,.classic,.chip,.sec-h a,details.more summary{font-size:var(--t-s)}
.eyebrow,.lm,.kpi span,.lpct,.tour-n,.goal-xp,.glabel,.gnote,.st-tag,kbd{font-size:var(--t-c)}
.lt,.btn,.choice,.opt{font-size:var(--t-b)}
.btn.sm,.nav a,#tabbar a span{font-size:var(--t-s)}
#tabbar a span{font-size:11px}
.kpi b,.start-l{font-size:var(--t-1)}.start-l{font-size:var(--t-2)}
.kpi b{font-weight:600}
.ftxt,.qtxt,[data-theme=charcoal] .ftxt,[data-theme=charcoal] .qtxt{font-size:var(--t-1);font-weight:500}
.ftxt.md,.qtxt.md{font-size:var(--t-2)}.ftxt.sm,.qtxt.sm,.ftxt.xs,.qtxt.xs{font-size:var(--t-b)}
.casestats b,[data-theme=charcoal] .casestats b{font-size:var(--t-1);font-weight:600}
.ttl,[data-theme=charcoal] .ttl{font-size:var(--t-b)}
/* safe areas */
.top{height:calc(60px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
#ambPanel{top:calc(64px + env(safe-area-inset-top))}
#achbar{top:calc(72px + env(safe-area-inset-top))}
.sticky-save{top:calc(60px + env(safe-area-inset-top))}
/* collapsing large title (mobile) */
#barTitle{display:none}
/* press feedback */
.btn,.start,.lrow,.resume,.mode,.choice,.chip,.mrow,.seg button,#tabbar a,.ico{transition:transform .18s cubic-bezier(.3,.7,.4,1),background-color .15s,border-color .15s,color .15s,opacity .15s}
:is(.btn,.start,.lrow,.resume,.mode,.choice,.chip,.mrow,.seg button,#tabbar a,.ico):active:not(:disabled){transform:scale(.97);transition-duration:.06s}
/* page transitions */
.enter{animation:pfade .22s ease-out}
.push{animation:ppush .34s cubic-bezier(.2,.85,.25,1)}
.pop{animation:ppop .34s cubic-bezier(.2,.85,.25,1)}
@keyframes pfade{from{opacity:0}}
@keyframes ppush{from{opacity:0;transform:translateX(36px)}}
@keyframes ppop{from{opacity:0;transform:translateX(-36px)}}
/* frosted material */
#modal{background:rgba(0,0,0,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal-card,#ambPanel,#achbar,.tour-card,#ambHint,#toast{background:color-mix(in srgb,var(--card) 80%,transparent)!important;backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6)}
.modal-card{border-radius:20px!important;animation:mpop .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes mpop{from{opacity:0;transform:scale(.96)}}
/* grouped lists + switches */
.glabel{display:block;color:var(--muted);margin:0 0 7px 18px}
.gnote{color:var(--muted);margin:7px 18px 0}
.group{border-radius:12px;padding:0 18px}
.group .opt{min-height:50px;padding:10px 0}
a.opt{color:var(--text)}a.opt:hover span{color:var(--accent)}
.group .opt>.chev{margin-left:auto}
.group .opt:last-child{border-bottom:0}
.gsec{margin-top:30px}
.opt input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;margin:0;padding:0;border:0;border-radius:99px;background:color-mix(in srgb,var(--muted) 38%,transparent);position:relative;cursor:pointer;transition:background .22s}
.opt input[type=checkbox]::before{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25),0 0 1px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,.7,.3,1.2)}
.opt input[type=checkbox]:checked{background:var(--ok)}
[data-theme=charcoal] .opt input[type=checkbox]:checked{background:var(--accent)}
.opt input[type=checkbox]:checked::before{transform:translateX(20px)}
.opt input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
/* hero icons replace emoji */
.hero-ic{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.hero-ic.ok{background:var(--ok-soft);color:var(--ok)}
.btn .ic{flex:none}
/* goal ring */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.ringg{flex:none;position:relative;width:92px;height:92px;display:block}
.ringg svg{display:block;transform:rotate(-90deg)}
.ringg circle{fill:none;stroke-width:9;stroke-linecap:round}
.ringg .bg{stroke:var(--line)}
.ringg .fg{stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringg .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ringg .rt b{font-size:var(--t-b);font-variant-numeric:tabular-nums}
.ringg .rt span{font-size:11px;color:var(--muted)}
/* set page */
.sethead{display:flex;flex-direction:column;gap:6px;margin:4px 0 22px}
.settop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sethead h1{margin:0;overflow-wrap:anywhere}
.setmeta{color:var(--muted);font-size:var(--t-s)}
.sbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}.sbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.studybig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 6px;padding:16px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:var(--t-b);transition:transform .18s cubic-bezier(.3,.7,.4,1),background .15s}
.studybig:hover{background:var(--accent-2)}.studybig:active{transform:scale(.98)}
.studysub{text-align:center;color:var(--muted);font-size:var(--t-c);margin-bottom:26px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:2px;border-radius:10px;background:color-mix(in srgb,var(--muted) 16%,transparent);margin-bottom:10px}
.seg button{font:inherit;font-size:var(--t-s);font-weight:500;padding:7px 0;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);font-weight:600}
[data-theme=charcoal] .seg button.on{background:#34363c}
.mlist{border-radius:12px;padding:0 0 0 16px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:14px;padding:11px 16px 11px 0;border-bottom:1px solid var(--line);min-height:56px}
.mrow:last-child{border-bottom:0}
.mrow .mic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.mrow .lt{font-weight:500}
.planrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.planrow input{width:auto}
/* swipe-to-rate */
.swipe{position:relative;transform-style:preserve-3d;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overflow-x:clip}
main{overflow-x:clip}
.swipe.drag{transition:none}
.swipe.fly{transition:transform .3s cubic-bezier(.3,.6,.4,1),opacity .3s}
.swipe.back{transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.swl{position:absolute;top:18px;z-index:3;padding:4px 12px;border-radius:8px;border:2px solid;font-weight:700;font-size:var(--t-s);opacity:0;pointer-events:none}
.swl.r{right:18px;color:var(--ok);transform:rotate(8deg)}.swl.l{left:18px;color:var(--bad);transform:rotate(-8deg)}
.swhint{text-align:center;color:var(--muted);font-size:var(--t-c);margin-top:8px}
@media (max-width:760px){
  .top{height:calc(52px + env(safe-area-inset-top));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  main{padding:14px max(16px,env(safe-area-inset-left)) calc(100px + env(safe-area-inset-bottom))}
  body.studying main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  #barTitle{display:block;position:absolute;left:64px;right:64px;bottom:0;height:52px;line-height:52px;text-align:center;font-weight:600;font-size:var(--t-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
  .top{position:sticky}
  .logo{transition:opacity .2s}
  body.lt-c #barTitle{opacity:1;transform:none}
  body.lt-c .logo{opacity:0;pointer-events:none}
  h1,.hello h1{font-size:var(--t-1)}
  .page-h h1,.hello h1,.sethead h1{font-size:var(--t-lt)}
  .kpi b{font-size:var(--t-2)}
  .ringg{width:76px;height:76px}.ringg svg{width:76px;height:76px}
  /* bottom sheets */
  #modal{align-items:flex-end;padding:0}
  .modal-card{max-width:none;border-radius:20px 20px 0 0!important;max-height:88vh;padding:26px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetup .34s cubic-bezier(.2,.9,.25,1);border-bottom:0!important;touch-action:pan-y}
  .modal-card::before{content:'';position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:color-mix(in srgb,var(--muted) 55%,transparent)}
  .modal-card{position:relative}
  .modal-card.dragging{transition:none}
  .modal-card.closing{transition:transform .25s ease-in;transform:translateY(100%)!important}
  #ambPanel{left:0;right:0;top:auto!important;bottom:0;width:auto;max-height:86vh;border-radius:20px 20px 0 0!important;padding:26px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetup .34s cubic-bezier(.2,.9,.25,1);z-index:55}
  .menu-list .btn{justify-content:flex-start;min-height:50px}
}
@keyframes sheetup{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.push,.pop,.enter,.modal-card,#ambPanel{animation:none!important}.swipe.fly,.swipe.back{transition:none!important}}
/* ===================== v4: quiet layout + charts ===================== */
:root{--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:48px}
.ico{min-width:44px;min-height:44px}
.sec{margin-top:var(--s5)}
.sec-h{margin-bottom:var(--s2)}
.chart-h{margin:-8px 0 var(--s2);color:var(--muted);font-size:var(--t-s)}
.home .start{margin-top:var(--s4)}
.home .briefing{margin-top:4px}
.resume{margin-top:var(--s3);border:0;background:color-mix(in srgb,var(--card) 70%,transparent)}
.resume .mic,.mrow .mic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.recent .lrow{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
/* week bars */
.wbars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:118px;padding-top:18px}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wb i{display:block;width:100%;max-width:34px;border-radius:6px;background:color-mix(in srgb,var(--muted) 22%,transparent);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.wb i.on{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.wb.today i.on{background:var(--accent)}
.wb i.st{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.wv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:13px}
.wd{font-size:var(--t-c);color:var(--muted)}
.wb.today .wd{color:var(--text);font-weight:600}
.wgoal{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);pointer-events:none}
/* mini ring in lists */
.mring .trk{stroke:var(--line)}.mring .val{stroke:var(--accent)}
.mring{flex:none}
/* viz pair: donut + rings */
.vizrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.viz{min-width:0}.legend li{min-width:0}
.viz{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:18px;background:var(--card);border:1px solid var(--line)}
.viz svg{flex:none}
.viz .trk,.rings .t1,.rings .t2{stroke:var(--line)}
.donut .dm{stroke:var(--accent)}.donut .dl{stroke:color-mix(in srgb,var(--accent) 45%,var(--card))}.donut .dn{stroke:color-mix(in srgb,var(--muted) 35%,var(--card))}
.donut circle{transition:stroke-dasharray .8s}
.donut .dv{fill:var(--text);font-size:26px;font-weight:650;text-anchor:middle;letter-spacing:-.02em}
.donut .dc{fill:var(--muted);font-size:12px;text-anchor:middle}
.rings .r1{stroke:var(--accent)}.rings .r2{stroke:color-mix(in srgb,var(--accent) 55%,#fff 0%);stroke:#8fb7a0}
.rings .t1{stroke:color-mix(in srgb,var(--accent) 16%,var(--card))}.rings .t2{stroke:color-mix(in srgb,#8fb7a0 16%,var(--card))}
.rings circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:var(--t-s);min-width:0}
.legend li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend b{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend i.dm{background:var(--accent)}.legend i.dl{background:color-mix(in srgb,var(--accent) 45%,var(--card))}.legend i.dn{background:color-mix(in srgb,var(--muted) 35%,var(--card))}
.legend i.r1{background:var(--accent);border-radius:50%}.legend i.r2{background:#8fb7a0;border-radius:50%}
.legend li.muted{font-size:var(--t-c)}
/* heatmap */
.heat{overflow:hidden}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px;justify-content:start}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--muted) 14%,transparent)}
.hm .l1{background:color-mix(in srgb,var(--accent) 28%,transparent)}.hm .l2{background:color-mix(in srgb,var(--accent) 50%,transparent)}.hm .l3{background:color-mix(in srgb,var(--accent) 75%,transparent)}.hm .l4{background:var(--accent)}
.hmm{display:grid;gap:4px;margin-top:8px;font-size:11px;color:var(--muted);justify-content:start;white-space:nowrap}
/* rank track */
.rtrack{display:block;padding:var(--s3);border-radius:18px;background:var(--card);border:1px solid var(--line)}
.rline{position:relative;height:4px;border-radius:4px;background:var(--line);margin:8px 6px 18px}
.rline>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.rdot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.rdot.on{border-color:var(--accent);background:var(--accent)}
.rdot.cur{width:18px;height:18px;margin:-9px 0 0 -9px;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
/* memory diagram (set page) */
.memd{display:flex;align-items:flex-end;gap:6px;margin:var(--s3) 0 6px;padding:var(--s3) var(--s3) var(--s2);border-radius:18px;background:var(--card);border:1px solid var(--line)}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mbar{width:100%;max-width:56px;height:84px;display:flex;align-items:flex-end;border-radius:8px;background:color-mix(in srgb,var(--muted) 10%,transparent);overflow:hidden}
.mbar i{display:block;width:100%;border-radius:8px;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.m0 .mbar i{background:color-mix(in srgb,var(--muted) 40%,transparent)}.m1 .mbar i{background:color-mix(in srgb,var(--accent) 38%,transparent)}.m2 .mbar i{background:color-mix(in srgb,var(--accent) 68%,transparent)}.m3 .mbar i{background:var(--accent)}
.mcol b{font-size:var(--t-b);font-variant-numeric:tabular-nums;margin-top:4px}
.mcol span{font-size:var(--t-c);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mar{align-self:center;width:10px;height:10px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg);margin-bottom:46px;flex:none}
.memcap{color:var(--muted);font-size:var(--t-c);margin:6px 4px 0;text-align:center}
.studysub:empty{display:none}
/* study screens: quiet chrome */
.shbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:-4px 0 var(--s2)}
.shtitle{text-align:center;min-width:0;line-height:1.25}
.shtitle strong{display:block;font-size:var(--t-b)}
.shtitle span{display:block;font-size:var(--t-c);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtools{display:flex;justify-content:center;gap:var(--s2);margin-top:var(--s2)}
.qtools .ico{color:var(--muted);border-radius:12px}
.qtools .ico.on{color:var(--accent);background:var(--accent-soft)}
.fhint{margin-top:var(--s2)}
@media (max-width:760px){
  .vizrow{grid-template-columns:1fr}
  .viz{padding:var(--s2) var(--s3)}
  .viz svg{width:124px;height:124px}
  .wbars{gap:6px}
  .memd{padding:var(--s2);gap:2px}.mar{width:7px;height:7px}.mbar{height:64px}.mar{margin-bottom:40px}
}
.wbars{height:124px;padding-top:4px}
.wgoal span{position:absolute;right:0;top:-16px;font-size:11px;color:color-mix(in srgb,var(--accent) 75%,transparent)}
.terms .t{grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;align-items:center}
.terms .td{color:color-mix(in srgb,var(--text) 82%,transparent)}
.ttools{display:flex;gap:0}
.ttools .ico{color:var(--muted);opacity:.7}
.ttools .ico:hover{opacity:1}
.mar{border-color:color-mix(in srgb,var(--muted) 55%,transparent)}
@media (max-width:760px){
  .terms .t{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tt tools" "td tools";gap:2px 8px;padding:12px 6px 12px 16px}
  .terms .tt{grid-area:tt}.terms .td{grid-area:td;font-size:var(--t-s)}.ttools{grid-area:tools}
}

:is(.ftxt,.qtxt,.code-line,.stamp,.simhud,.casestats b,.setcard .ttl,.tour-card h3,.ttl,.choice,.mode){font-family:var(--sans)!important;letter-spacing:-.01em}
@media (pointer:coarse){.btn kbd,.choice kbd,.rates kbd{display:none}}
#fctl>span:first-child:empty{display:none}
@media (max-width:760px){#fctl{gap:12px}#bReveal{flex:1}}
.viz{gap:var(--s2) var(--s3);padding:var(--s3) var(--s3)}
.viz svg{width:132px;height:132px}
.legend{flex:1;min-width:0}
.legend b{padding-left:12px}
@media (max-width:980px) and (min-width:761px){.vizrow{grid-template-columns:1fr}}
.rates .btn{flex-direction:column;gap:2px;line-height:1.2}
.rivl{font-size:11px;font-weight:500;opacity:.75}
/* cloze */
.czB{display:inline-block;min-width:3.2em;padding:0 .35em;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600;text-align:center}
mark.czA{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text);border-radius:5px;padding:0 .2em;font-weight:600}
.ftxt.cz{text-align:left;font-size:var(--t-2)!important;line-height:1.45}
.czx{margin-top:14px;color:var(--muted);font-size:var(--t-s);text-align:left}
/* image occlusion */
.occ{position:relative;display:block;width:100%;max-width:560px;margin:8px auto 0;border-radius:12px;overflow:hidden;line-height:0;user-select:none;-webkit-user-select:none}
.occ .occimg{width:100%;height:auto;display:block;min-height:60px;background:color-mix(in srgb,var(--muted) 15%,transparent)}
.tape{position:absolute;border-radius:3px;background:repeating-linear-gradient(-45deg,#d9c48f 0 6px,#cdb87f 6px 12px);box-shadow:0 1px 2px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;color:#3b3220;font:700 15px/1 var(--sans);transition:opacity .35s,transform .35s cubic-bezier(.3,.7,.3,1)}
.tape.tgt{background:repeating-linear-gradient(-45deg,#f0c75e 0 6px,#e2b84c 6px 12px);outline:2px solid #fff6;outline-offset:1px;cursor:default}
.tape.peel{opacity:0;transform:translateY(-6px) rotate(-4deg) scale(.96);pointer-events:auto}
.tape.peel:not(.tgt){opacity:.12}
.tlabel{position:absolute;transform:translate(-50%,4px);background:var(--accent);color:var(--on-accent);font:600 13px/1.2 var(--sans);padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:2}
.occ.sm{max-width:180px;margin:0;border-radius:8px}.occ.sm .tape{font-size:0}.occ.sm .tlabel{display:none}
.face .occ.big{max-height:58vh}
.flash .face{overflow:hidden}
/* editor: cloze + image rows */
.erow .kind{font-size:var(--t-c);color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
.czrow textarea{width:100%}
.czprev{font-size:var(--t-s);color:var(--muted);margin-top:6px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow .btn{flex:1;min-width:140px}
.occrow{display:flex;gap:14px;align-items:center}
/* tape editor */
.oced{position:relative;line-height:0;border-radius:10px;overflow:hidden;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.oced img{width:100%;display:block;pointer-events:none}
.oced .tape{cursor:pointer}.oced .tape.sel{outline:3px solid var(--accent);outline-offset:1px}
.oced .tape span{font-size:12px}
.olist{display:flex;flex-direction:column;gap:8px;margin-top:12px;height:min(28vh,210px);overflow:auto;overscroll-behavior:contain}
.olist .orow{display:flex;gap:8px;align-items:center}.olist .orow b{width:22px;text-align:center;color:var(--accent)}
.olist .orow.sel input{border-color:var(--accent)}
@media print{
  .top,.noprint,#toast,#tabbar{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ccc}
  .terms .t{break-inside:avoid}
}

const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function visionRe(s){
  if(!DB.settings.vision)return null;

}
function dvHtml(text,re,own){
  if(!re||!text)return nl(text);
  const ownN=norm(own);let out='',last=0;text=String(text);re.lastIndex=0;let m;
  while((m=re.exec(text))){if(norm(m[0])===ownN)continue;out+=nl(text.slice(last,m.index))+`<mark class="dv">${esc(m[0])}</mark>`;last=m.index+m[0].length}

function connections(s){
  const out=[],seenK=new Set();

    const tn=norm(c.term);if(tn.length<3)return;
    others.forEach(o=>o.cards.forEach(d=>{
      const dn=norm(d.term);if(dn.length<3)return;
      const hit=dn===tn||(' '+norm(c.def)+' ').includes(' '+dn+' ')||(' '+norm(d.def)+' ').includes(' '+tn+' ');
      const k=c.id+d.id;if(hit&&!seenK.has(k)&&out.length<12){seenK.add(k);out.push({c,d,o})}
    }));
  });
  return out;
}

/* ========== media store (images for image-occlusion and Anki imports) ==========
   Images live in IndexedDB (much larger than localStorage) under a content id, and sync as their own
   one-time cloud rows ('m:<id>'). Other devices download an image only when it's first shown. */
const MEDIA=new Map();let mediaDBp=null;
function mediaDB(){return mediaDBp||(mediaDBp=new Promise((res,rej)=>{try{const r=indexedDB.open('quizcraft-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function mediaPut(id,url){MEDIA.set(id,url);try{const db=await mediaDB();await new Promise((res,rej)=>{const t=db.transaction('m','readwrite');t.objectStore('m').put(url,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){console.warn('media store',e)}try{scheduleSync(1500)}catch(e){}}
async function mediaGet(id){
  if(MEDIA.has(id))return MEDIA.get(id);
  try{const db=await mediaDB();const v=await new Promise(res=>{const q=db.transaction('m').objectStore('m').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(v){MEDIA.set(id,v);return v}}catch(e){}
  try{if(sb&&user){const{data}=await sb.from('docs').select('data').eq('id','m:'+id).maybeSingle();const u=data?.data?.u;if(u){await mediaPut(id,u);return u}}}catch(e){}
  return null;
}
async function mediaAdd(url){const id='i'+hashStr(url)+url.length.toString(36);await mediaPut(id,url);return id}

const mediaImg=(mid,cls='')=>MEDIA.has(mid)?`<img class="${cls}" src="${MEDIA.get(mid)}" alt="">`:`<img class="${cls}" data-mid="${mid}" alt="">`;

  ['initSqlJs','https://cdn.jsdelivr.net/npm/sql.js@1.16.0/dist/sql-wasm.js','sha384-gsnTy5VfbWdeJPJBS/civzY3lgdVd3ZQ/Z3pSnluWHZRHh+TEL/oWrhaFrywCwDm']];

async function readApkg(buf){

    if(tables.has('notetypes')&&tables.has('decks')){

function ankiText(html){

}
// Anki card → QuizCraft scheduling (uses Anki's own FSRS memory state when the deck has it)
function ankiSched(ac,crt){

}
function ioShapes(field){const out=[];for(const m of String(field).matchAll(/\{\{c(\d+)::image-occlusion:(\w+):([^}]*)\}\}/g)){
  const p={};m[3].split(':').forEach(kv=>{const i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=kv.slice(i+1)});
  let x,y,w,h;if(m[2]==='polygon'&&p.points){const pts=p.points.split(' ').map(t=>t.split(',').map(Number));const xs=pts.map(a=>a[0]),ys=pts.map(a=>a[1]);x=Math.min(...xs);y=Math.min(...ys);w=Math.max(...xs)-x;h=Math.max(...ys)-y}
  else{x=+p.left;y=+p.top;w=+(p.width||0);h=+(p.height||0);if(m[2]==='ellipse'&&p.rx){w=2*p.rx;h=2*p.ry}}

/* ========== progress / spaced repetition ========== */
const status=c=>c.box>=3?'master':(c.right+c.wrong===0?'new':'learn');
/* ---------- FSRS-5 scheduler (Free Spaced Repetition Scheduler, same algorithm family as Anki) ----------
   Each card keeps: s = stability (days until recall drops to 90%), d = difficulty (1–10), lr = last review time.
   Grades: 1 Again · 2 Hard · 3 Good · 4 Easy.  c.box is kept as a simple 0–6 "memory level" derived from stability,
   so older parts of the app (mastered = box ≥ 3, the memory diagram) keep working. */
const FSRS_W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const F_DECAY=-0.5,F_FACTOR=19/81;
const clampD=x=>Math.min(10,Math.max(1,x));
const fsrsR=(t,S)=>Math.pow(1+F_FACTOR*t/Math.max(S,.01),F_DECAY);
const fsrsD0=g=>clampD(FSRS_W[4]-Math.exp(FSRS_W[5]*(g-1))+1);
function fsrsInterval(S){const r=Math.min(.97,Math.max(.7,DB.settings.retention||.9));return Math.min(36500,Math.max(1,Math.round(S/F_FACTOR*(Math.pow(r,1/F_DECAY)-1))))}
function boxFromS(c){if(!c.reps)return 0;if(c.lastG===1)return 1;const S=c.s||0;return S<2?1:S<7?2:S<21?3:S<60?4:S<180?5:6}
// pure step: returns the card's next state for grade g at time now (does not mutate)
function fsrsNext(c,g,now=Date.now()){
  const W=FSRS_W;let S,D;
  if(!c.reps||c.s==null){S=W[g-1];D=fsrsD0(g)}
  else{
    const t=Math.max(0,(now-(c.lr||now))/DAY),sameDay=c.lr&&ymd(new Date(c.lr))===ymd(new Date(now));

      if(g===1)S=Math.min(c.s,W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp(W[14]*(1-R)));

  }

  const due=g===1?now:now+fsrsInterval(S)*DAY;
  return{s:S,d:D,due,ivl:g===1?0:fsrsInterval(S)};

// "Again · now   Hard · 1d   Good · 3d   Easy · 2w" for the rating buttons
function fmtIvl(days){if(days<=0)return'now';if(days<14)return days+'d';if(days<60)return Math.round(days/7)+'w';if(days<365)return Math.round(days/30)+'mo';return(Math.round(days/36.5)/10)+'y'}

function savedAs(c){ // "Saved as Hard · back in 2 days" after an answer

// cards studied before FSRS: estimate stability from their old box so nothing is lost
function migrateFSRS(c){

  const OLD=[0,.4,1.2,3,7,16,35],b=Math.max(1,Math.min(6,c.box||1));

let lastGain=0;
function record(c,ok,opt={}){

  {const k=ymd(),e=DB.log[k]||(DB.log[k]={r:0,w:0});if(ok)e.r++;else e.w++}

  const g=opt.grade||(ok?(opt.hard?2:3):1);
  migrateFSRS(c);
  const n=fsrsNext(c,g,now);c.s=n.s;c.d=n.d;c.due=n.due;c.lr=now;c.reps=(c.reps||0)+1;c.lastG=g;

  }else{c.wrong++;c.lapses=(c.lapses||0)+1;c._lw=now}

function recordUndoable(c,ok,opt){
  const lk=ymd(),snap=JSON.stringify({c:{box:c.box,due:c.due,right:c.right,wrong:c.wrong,mAt:c.mAt,_lw:c._lw,s:c.s??null,d:c.d??null,lr:c.lr??null,reps:c.reps??0,lapses:c.lapses??0,lastG:c.lastG??null},xp:DB.xp,daily:DB.daily,weekly:DB.weekly,stats:DB.stats,log:DB.log[lk]||null});

}
/* ========== progression: XP, ranks, missions, achievements ========== */

  rollMissions();DB.daily.n++;DB.weekly.n++;

  if(d.daily){if(d.daily.d===DB.daily.d){DB.daily.n=Math.max(DB.daily.n,d.daily.n);DB.daily.done=Math.max(DB.daily.done,d.daily.done)}else if(d.daily.d>DB.daily.d)DB.daily=d.daily}

/* ---------- cloze cards: Anki syntax {{c1::answer}} or {{c1::answer::hint}}; one card per number ---------- */
const CZ_RE=/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
const isCloze=t=>/\{\{c\d+::[\s\S]*?\}\}/.test(String(t||''));
function clozeNums(raw){const n=new Set();for(const m of String(raw).matchAll(CZ_RE))n.add(+m[1]);return[...n].sort((a,b)=>a-b)}
function clozeFront(raw,n){return String(raw).replace(CZ_RE,(m,k,a,h)=>+k===n?`[${h||'...'}]`:a)}
function clozeAnswer(raw,n){return[...String(raw).matchAll(CZ_RE)].filter(m=>+m[1]===n).map(m=>m[2]).join(', ')}
function clozeHtml(raw,n,reveal){let out='',last=0;const t=String(raw);for(const m of t.matchAll(CZ_RE)){out+=esc(t.slice(last,m.index));const me=+m[1]===n;out+=me?(reveal?`<mark class="czA">${esc(m[2])}</mark>`:`<span class="czB">${esc(m[3]||'…')}</span>`):esc(m[2]);last=m.index+m[0].length}out+=esc(t.slice(last));return out.replace(/\n/g,'<br>')}
function buildCloze(raw,extra,old=[],note){note=note||uid();return clozeNums(raw).map(n=>{const c=old.find(x=>x.n===n)||newCard();return Object.assign(c,{kind:'cloze',note,n,raw,extra:extra||'',term:clozeFront(raw,n),def:clozeAnswer(raw,n)})})}
/* ---------- image occlusion: tapes over an image; one card per tape (masks in 0–1 coordinates) ---------- */
function buildOcc(mid,masks,old=[],note){note=note||uid();const ms=masks.map(m=>({id:m.id,x:m.x,y:m.y,w:m.w,h:m.h,l:(m.l||'').trim()}));return ms.map(m=>{const c=old.find(x=>x.mk===m.id)||newCard();return Object.assign(c,{kind:'occ',note,mid,mk:m.id,masks:ms,term:'',def:m.l,img:''})})}
function occHtml(c,reveal,cls=''){return `<div class="occ ${cls}">${mediaImg(c.mid,'occimg')}${(c.masks||[]).map(m=>{const t=m.id===c.mk,pos=`left:${m.x*100}%;top:${m.y*100}%;width:${m.w*100}%;height:${m.h*100}%`;return `<span class="tape ${t?'tgt':''} ${t&&reveal?'peel':''}" style="${pos}">${t&&!reveal?'?':''}</span>${t&&reveal&&m.l?`<span class="tlabel" style="left:${(m.x+m.w/2)*100}%;top:${(m.y+m.h)*100}%">${esc(m.l)}</span>`:''}`}).join('')}</div>`}

function pool(s){

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function lev(a,b){if(a===b)return 0;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}
function grade(input,answer){
  const n=norm(input);if(!n)return 'wrong';
  const alts=[answer,...String(answer).split(/\s\/\s|;/)].map(norm).filter(Boolean);
  if(alts.includes(n))return 'correct';
  // short answers (abbreviations, codes) must be exact; longer ones forgive about 1 typo per 8 letters
  for(const a of alts)if(a.length>=6&&lev(n,a)<=Math.max(1,Math.floor(a.length*.12)))return 'close';
  return 'wrong';
}
function distinctOthers(s,c,q){let xs=s.cards.filter(x=>x.id!==c.id&&!(c.kind!=='occ'&&q.prompt&&q.pSide&&norm(sideText(x,q.pSide))===norm(q.prompt)));{const same=xs.filter(x=>(x.kind||'')===(c.kind||''));if(same.length>=3)xs=same}return[...new Map(xs.map(x=>sideText(x,q.aSide)).filter(t=>t&&t.trim()&&norm(t)!==norm(q.answer)).map(t=>[norm(t),t])).values()]}

  else{url=await mediaGet(mid);if(!url){toast('That image isn’t available on this device yet');return null}}

  return new Promise(res=>{
    let done=false;const finish=v=>{if(done)return;done=true;res(v)};

      <div class="row between" style="margin-top:14px"><button class="btn sm danger" id="oDel" disabled>Delete tape</button><div class="row"><button class="btn" id="mC">Cancel</button><button class="btn primary" id="mO">Done</button></div></div>`,()=>finish(null));

      $('#oDel').disabled=!sel;
    };
    const pt=e=>{const r=ed.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}};

      act={mode:'new',x0:p.x,y0:p.y,el:null};
    });
    ed.addEventListener('pointermove',e=>{if(!act)return;const p=pt(e);
      if(act.mode==='move'){const m=act.m;m.x=Math.min(1-m.w,Math.max(0,p.x-act.dx));m.y=Math.min(1-m.h,Math.max(0,p.y-act.dy));const el=$(`.tape[data-id="${m.id}"]`,ed);if(el){el.style.left=m.x*100+'%';el.style.top=m.y*100+'%'}return}
      const x=Math.min(act.x0,p.x),y=Math.min(act.y0,p.y),w=Math.abs(p.x-act.x0),h=Math.abs(p.y-act.y0);
      if(!act.el){act.el=document.createElement('span');act.el.className='tape sel';ed.appendChild(act.el)}
      Object.assign(act.el.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'});act.box={x,y,w,h};
    });
    const up=e=>{if(!act)return;

const SEPS={tab:'\t',comma:',',dash:' - ',colon:':',nl:'\n',semi:';',blank:'\n\n'};
function parseBulk(text,ts,cs){
  ts=ts||'\t';cs=cs||'\n';
  const parts=cs==='\n'?text.split(/\r?\n/):cs==='\n\n'?text.split(/\r?\n\s*\r?\n/):text.split(cs);
  return parts.map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(ts);return i<0?newCard(l,''):newCard(l.slice(0,i).trim(),l.slice(i+ts.length).trim())});
}
function bulkUI(){return `<textarea id="bText" rows="8" placeholder="Word 1&#9;Definition 1&#10;Word 2&#9;Definition 2&#10;Word 3&#9;Definition 3"></textarea>
  <div class="row" style="align-items:flex-start;gap:30px;margin-top:10px">
   <div><b class="sm">Between term and definition</b><div class="radios">${[['tab','Tab'],['comma','Comma'],['dash','Dash ( - )'],['colon','Colon ( : )'],['custom','Custom']].map(([v,l],i)=>`<label><input type="radio" name="tsep" value="${v}" ${i?'':'checked'}>${l}</label>`).join('')}</div><input id="tsepC" placeholder="Custom separator" style="max-width:180px;padding:5px 8px"></div>
   <div><b class="sm">Between cards</b><div class="radios">${[['nl','New line'],['semi','Semicolon'],['blank','Blank line'],['custom','Custom']].map(([v,l],i)=>`<label><input type="radio" name="csep" value="${v}" ${i?'':'checked'}>${l}</label>`).join('')}</div><input id="csepC" placeholder="Custom separator" style="max-width:180px;padding:5px 8px"></div>
  </div>
  <p class="sm" style="margin-bottom:6px"><b id="bCount">0</b> cards detected <span class="muted">(preview)</span></p><div id="bPrev" class="bprev"></div>`}
function bindBulk(root){
  let touched=false;
  const get=()=>{const tv=$('input[name=tsep]:checked',root).value,cv=$('input[name=csep]:checked',root).value;return parseBulk($('#bText',root).value,tv==='custom'?$('#tsepC',root).value:SEPS[tv],cv==='custom'?$('#csepC',root).value:SEPS[cv])};
  const upd=()=>{
    const txt=$('#bText',root).value;
    if(!touched&&txt){const g=v=>{$(`input[name=tsep][value=${v}]`,root).checked=true};if(txt.includes('\t'))g('tab');else if(txt.includes(' - '))g('dash');else if(/^[^,\n]+,/m.test(txt))g('comma')}
    const r=get();$('#bCount',root).textContent=r.length;$('#bPrev',root).innerHTML=r.slice(0,6).map(c=>`<div><b>${esc(c.term)}</b> — ${esc(c.def)||'<i class="muted">no definition</i>'}</div>`).join('')+(r.length>6?`<div class="muted">…and ${r.length-6} more</div>`:'')};
  root.addEventListener('input',e=>{if(e.target.name==='tsep'||e.target.name==='csep')touched=true;upd()});
  root.addEventListener('change',upd);
  return{get,upd};
}
function bulkModal(){return new Promise(res=>{
  modal(`<h3>Import your data</h3><p class="muted sm" style="margin-top:-6px">Copy and paste from Word, Excel, Google Docs, or a Quizlet export.</p>${bulkUI()}<div class="row end" style="margin-top:14px"><button class="btn" id="mC">Cancel</button><button class="btn primary" id="mO">Import</button></div>`,()=>res(null));
  const b=bindBulk($('.modal-card'));
  $('#mC').onclick=()=>closeModal();
  $('#mO').onclick=()=>{const r=b.get();if(!r.length)return toast('Nothing to import yet');closeModal(true);res(r)};
})}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function packStr(str){
  if(window.CompressionStream){const st=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
  return 'u'+b64(new TextEncoder().encode(str));
}
async function unpackStr(s){const bytes=unb64(s.slice(1));if(s[0]==='u')return new TextDecoder().decode(bytes);const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(st).text()}
async function shareLink(s){
  const seenN=new Set(),data={t:s.title,d:s.desc,tl:s.termLang,dl:s.defLang,c:s.cards.filter(c=>c.kind!=='occ'&&!(c.kind==='cloze'&&(seenN.has(c.note)||!seenN.add(c.note)))).map(c=>c.kind==='cloze'?[c.raw,c.extra||'']:c.img&&!c.img.startsWith('data:')?[c.term,c.def,c.img]:[c.term,c.def])};
  return location.href.split('#')[0]+'#share='+await packStr(JSON.stringify(data));
}

let ltObs=null;
function bindLargeTitle(){
  if(ltObs)ltObs.disconnect();document.body.classList.remove('lt-c');
  const h=$('main h1');const bt=$('#barTitle');if(!h||!bt||!window.IntersectionObserver)return;
  bt.textContent=h.dataset.lt||h.textContent.trim();
  const top=$('.top').offsetHeight;
  ltObs=new IntersectionObserver(([e])=>{document.body.classList.toggle('lt-c',!e.isIntersecting&&e.boundingClientRect.top<top)},{rootMargin:`-${top}px 0px 0px 0px`,threshold:0});

function heatmap(){
  const avail=Math.min(720,(app.clientWidth||innerWidth)-40),weeks=avail>600?30:17,cw=Math.max(10,Math.min(18,Math.floor((avail-(weeks-1)*4)/weeks)));
  const today=new Date(),end=new Date(today.getFullYear(),today.getMonth(),today.getDate()),start=new Date(end-((weeks-1)*7+end.getDay())*DAY);
  const cells=[];let max=1;for(let t=+start;t<=+end;t+=DAY){const k=ymd(new Date(t)),e=logDay(k),v=e.r+e.w;max=Math.max(max,v);cells.push({k,v,s:e.s,t})}
  const lvl=c=>!c.v?(c.s?1:0):Math.min(4,1+Math.floor(c.v/max*3.999));
  const months=[];cells.forEach((c,i)=>{const d=new Date(c.t);if(d.getDate()<=7&&d.getDay()===0)months.push([Math.floor(i/7),d.toLocaleDateString([],{month:'short'})])});
  return `<div class="heat"><div class="hm" style="grid-template-columns:repeat(${Math.ceil(cells.length/7)},${cw}px)" role="img" aria-label="Study activity, last ${weeks} weeks">${cells.map(c=>`<i class="l${lvl(c)}" title="${new Date(c.t).toLocaleDateString([],{month:'short',day:'numeric'})}: ${c.v?c.v+' answers':c.s?'studied':'no study'}"></i>`).join('')}</div>

}

    return rowCard(it.c,i)};

  function renderRows(focusI){rows.innerHTML=items.map(rowHtml).join('');requestAnimationFrame(()=>$$('textarea',rows).forEach(autoGrow));if(focusI!=null){const t=$(`.erow[data-i="${focusI}"] textarea`,rows);if(t){t.focus();t.scrollIntoView({block:'center'})}}}
  renderRows();
  app.addEventListener('input',()=>{dirty=true},{once:false});
  rows.addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;const it=items[+t.closest('.erow').dataset.i];if(it.t==='card')it.c[t.dataset.f]=t.value;else it[t.dataset.f]=t.value;autoGrow(t);if(t.dataset.f==='raw'){const n=clozeNums(t.value).length,p=$('.czprev',t.closest('.erow'));if(p)p.textContent=n?`${n} blank${n>1?'s':''} → ${n} card${n>1?'s':''}`:'Select words, then tap Hide words'}});

    if(a==='blank'){const ta=$('textarea[data-f=raw]',b.closest('.erow')),v=ta.value,x=ta.selectionStart,y=ta.selectionEnd;

      const n=Math.max(0,...clozeNums(v))+1,sel=v.slice(x,y),lead=sel.match(/^\s*/)[0],trail=sel.match(/\s*$/)[0];
      ta.value=v.slice(0,x)+lead+`{{c${n}::${sel.trim()}}}`+trail+v.slice(y);it.raw=ta.value;ta.dispatchEvent(new Event('input',{bubbles:true}));haptic('light')}
    if(a==='occ'){const r=await occEditor({mid:it.mid,masks:it.masks});if(r){it.masks=r.masks;renderRows()}}

  $('#addBtn').onclick=()=>{items.push({t:'card',c:newCard()});renderRows(items.length-1)};

  $('#swapBtn').onclick=()=>{items.filter(x=>x.t==='card').forEach(({c})=>{[c.term,c.def]=[c.def,c.term]});const tl=$('#eTL').value;$('#eTL').value=$('#eDL').value;$('#eDL').value=tl;dirty=true;renderRows();toast('Swapped terms and definitions')};
  $('#bulkBtn').onclick=async()=>{const r=await bulkModal();if(r){for(let k=items.length-1;k>=0;k--){const x=items[k];if(x.t==='card'&&!(x.c.term.trim()||x.c.def.trim()||x.c.img))items.splice(k,1)}r.forEach(c=>items.push(isCloze(c.term)?{t:'cloze',note:uid(),raw:c.term,extra:c.def,cards:[]}:{t:'card',c}));dirty=true;renderRows();toast(`Imported ${r.length} cards`)}};
  const doSave=()=>{
    d.title=$('#eTitle').value.trim();d.desc=$('#eDesc').value.trim();d.folder=$('#eFolder').value;d.termLang=$('#eTL').value;d.defLang=$('#eDL').value;
    const bad=items.findIndex(x=>x.t==='cloze'&&x.raw.trim()&&!clozeNums(x.raw).length);
    if(bad>=0){toast('Row '+(bad+1)+': select the words to hide, then tap Hide words');$(`.erow[data-i="${bad}"] textarea`)?.focus();return}
    const cards=[];for(const x of items){
      if(x.t==='card'){const c=x.c;if(isCloze(c.term))cards.push(...buildCloze(c.term,c.def));else if(c.term.trim()||c.def.trim()||c.img)cards.push(c)}
      else if(x.t==='cloze'){if(clozeNums(x.raw).length)cards.push(...buildCloze(x.raw,x.extra,x.cards,x.note))}
      else if(x.masks.length)cards.push(...buildOcc(x.mid,x.masks,x.cards,x.note))}

    if(!cards.length){toast('Add at least one card');return}
    d.cards=cards;d.updated=Date.now();delete d.sample;
    if(isNew)DB.sets.push(d);else DB.sets[DB.sets.findIndex(x=>x.id===s.id)]=d;
    dirty=false;saveNow();queueProgress();location.hash='#/set/'+d.id;toast(isNew?'Set created!':'Saved');
  };
  $('#saveBtn').onclick=doSave;$('#saveBtn2').onclick=doSave;
  setKeys(e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();doSave()}});
  const warn=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
