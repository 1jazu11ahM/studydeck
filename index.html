<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizCraft — flashcards & study modes</title>
<meta name="description" content="Free, open flashcard app: flashcards, learn, write, spell, test, match and gravity.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2040%22%3E%3Cpath%20d%3D%22M29%2020%20L14%204%20L4%209%20L9%2014%20L12%2013%20L15%2019%20L19%2018%20L22%2024%20L28%2027.5%20Q32%2031%2036%2027.5%20L42%2025%20L45%2020%20L49%2021%20L52%2015%20L55%2016%20L61%2012%20L51%206%20L35%2020%20Q35.5%2017.5%2034.4%2015.6%20L35.2%2010.6%20L32.9%2014.2%20Q32%2013.9%2031.1%2014.2%20L28.8%2010.6%20L29.6%2015.6%20Q28.5%2017.5%2029%2020%20Z%22%20fill%3D%22%2318263a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--card:#fff;--text:#18263a;--on-ink:#fff;--muted:#5d6b7e;--line:#d6dde6;--accent:#2449c9;--accent-2:#1b39a3;--accent-soft:#e3e9fb;--ok:#14895f;--ok-soft:#e1f4ec;--bad:#d93f45;--bad-soft:#fcebeb;--warn:#e0a019;--rule:#dbe5f3;--margin:#ef8a8e;--hl:#ffe14d;--shadow:0 1px 2px rgba(24,38,58,.06),0 10px 24px -14px rgba(24,38,58,.35);--r:10px;--hand:'Kalam',ui-rounded,'Segoe Print',cursive}
[data-theme=dark]{--bg:#10151c;--card:#1a212b;--text:#e7ecf3;--on-ink:#10151c;--muted:#97a3b4;--line:#2a3441;--accent:#86a2ff;--accent-2:#a4b9ff;--accent-soft:#222d47;--ok:#3fd19c;--ok-soft:#14352b;--bad:#ff7378;--bad-soft:#3a1f25;--rule:#243042;--margin:#a8484d;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font:16px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--hl);color:#18263a}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:600 11px/1 ui-monospace,monospace;padding:3px 5px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.top{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-bat{transform:rotate(-8deg);transition:transform .3s}
.logo:hover .logo-bat{transform:rotate(-8deg) translateY(-3px) scaleY(.8)}
.logo .word{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:27px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
[data-theme=midnight] .logo-bat{color:var(--text)}
.searchwrap{flex:1;max-width:460px;min-width:0}
.top input{width:100%}
.top .mob{display:none}
.top nav{display:flex;gap:8px;margin-left:auto;align-items:center}
main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
input,textarea,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--on-ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{padding:14px 26px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.okb{border-color:var(--ok);color:var(--ok)} .btn.okb:hover{background:var(--ok-soft)}
.btn.badb{border-color:var(--bad);color:var(--bad)} .btn.badb:hover{background:var(--bad-soft)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ico{border:0;background:transparent;cursor:pointer;font-size:17px;padding:4px 6px;border-radius:8px;color:var(--muted);line-height:1}
.ico:hover{background:var(--accent-soft);color:var(--accent)}
.star.on{color:#f5b400}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.setcard{display:flex;flex-direction:column;gap:6px;border-radius:4px;padding-top:30px;background-image:linear-gradient(var(--margin),var(--margin));background-size:100% 2px;background-position:0 16px;background-repeat:no-repeat;transition:transform .15s,box-shadow .15s}
.setcard:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 1px 2px rgba(24,38,58,.08),0 18px 30px -16px rgba(24,38,58,.45)}
.ttl{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.muted{color:var(--muted)} .sm{font-size:14px} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .end{justify-content:flex-end}
h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;overflow-wrap:anywhere} h2{font-size:20px;margin:28px 0 12px} h3{margin:0 0 12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:6px}
.bar.big{height:12px}
.bar i{display:block;height:100%;transition:width .3s}
.b-new{background:var(--line)} .b-learn{background:var(--warn)} .b-master{background:var(--ok)}
.legend{gap:18px;font-size:14px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.b-new{background:#b8bfd3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.stat .ic{color:var(--accent);margin-bottom:6px} .stat.streak .ic{color:#e8590c} .stat b{font-size:30px;line-height:1.1;letter-spacing:-.02em} .stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:18px 0}
.mode{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:10px;background:var(--card);border:2px solid var(--line);font-weight:700;transition:border-color .12s,transform .12s}
.mode .ic{color:var(--accent);margin-bottom:6px}
.mode small{font-weight:400;color:var(--muted);font-size:13px}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.terms .t{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.terms .t:last-child{border-bottom:0}
.terms .tt{font-weight:600}
.terms .t > div{overflow-wrap:anywhere}
.thumb{display:block;max-height:90px;max-width:160px;border-radius:8px;margin-top:6px}
.st-tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:6px}
.st-new{background:var(--line);color:var(--muted)} .st-learn{background:#fff1d6;color:#a86b00} .st-master{background:var(--ok-soft);color:var(--ok)}
[data-theme=dark] .st-learn{background:#3b2f12;color:#f5c050}
/* editor */
.erow{padding:12px 16px}
.egrid{display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:start;margin-top:4px}
.egrid label{display:flex;flex-direction:column;gap:2px}
.egrid textarea{border-width:0 0 2px;border-radius:0;background:transparent;padding:6px 0;min-height:38px;resize:none;overflow:hidden}
.egrid small{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.eimg{position:relative}.eimg img{max-width:110px;max-height:80px;border-radius:8px;display:block}
.eimg .ico{position:absolute;top:-8px;right:-8px;background:var(--card);border:1px solid var(--line)}
.add-row{width:100%;margin-top:12px;padding:18px;border-style:dashed}
.sticky-save{position:sticky;top:58px;z-index:5;background:var(--bg);padding:8px 0}
/* flashcards */
.flash-wrap{perspective:1600px;margin:16px 0}
.flash{position:relative;height:380px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}
.flash.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--card);background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px);background-size:100% 2px,100% 100%;background-position:0 46px,0 48px;background-repeat:no-repeat,repeat;border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 30px 30px;text-align:center;overflow:auto}
.face.back{transform:rotateX(180deg)}
.face img{max-height:170px;max-width:100%;border-radius:10px;margin-top:14px}
.face .tools{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.face .label{position:absolute;top:14px;left:18px;font-size:13px;color:var(--muted);font-weight:600}
.ftxt,.qtxt{font-family:var(--hand);font-size:32px;line-height:1.3;overflow-wrap:anywhere;white-space:normal}
.ftxt.md,.qtxt.md{font-size:25px}.ftxt.sm,.qtxt.sm{font-size:21px}.ftxt.xs,.qtxt.xs{font-size:18px}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;background:var(--text);transition:width .25s}
.done-box{padding:40px 24px;text-align:center}
.done-box .big-emoji{font-size:54px}
/* questions */
.qcard{padding:28px;margin-top:16px;border-radius:6px;border-top:3px solid var(--margin)}
.qimg{max-height:200px;max-width:100%;border-radius:10px;margin-top:10px}
.qhint{margin:26px 0 10px;font-weight:600}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:inherit;color:inherit;overflow-wrap:anywhere;transition:border-color .12s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.wform input{flex:1;min-width:200px;font-size:18px}
.fbx{margin-top:16px;font-weight:700;padding:10px 14px;border-radius:10px}
.fbx.ok{color:var(--ok);background:var(--ok-soft)} .fbx.bad{color:var(--bad);background:var(--bad-soft)}
.ans{margin-top:12px}.ans small{display:block;color:var(--muted);font-weight:600}
.ans .okc{border:2px solid var(--ok);border-radius:10px;padding:8px 12px;margin-top:4px}
.ans .strike{border:2px dashed var(--bad);border-radius:10px;padding:8px 12px;margin-top:4px;color:var(--bad)}
.rlist{display:flex;flex-direction:column;gap:6px;text-align:left;margin:16px 0 20px}
.ritem{display:grid;grid-template-columns:24px 1fr 2fr;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.ritem.ok span:first-child{color:var(--ok)} .ritem.bad span:first-child{color:var(--bad)}
.spell-diff{font-size:24px;letter-spacing:2px;font-family:ui-monospace,monospace;margin-top:8px}
.spell-diff .g{color:var(--ok)} .spell-diff .r{color:var(--bad);text-decoration:underline}
/* test */
.tq{margin-top:14px;padding:22px}
.tq.ok{border-left:5px solid var(--ok)} .tq.bad{border-left:5px solid var(--bad)}
.tqh{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
.tf{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:16px}
.tfeq{color:var(--muted);font-size:20px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mi{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mi select{padding:6px}
.mi.ok .mres{color:var(--ok);font-weight:700}.mi.bad .mres{color:var(--bad);font-weight:700}
.ma{padding:6px 0;border-bottom:1px solid var(--line)}
.score{display:flex;gap:26px;align-items:center;margin-top:16px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;font-weight:800;background:radial-gradient(closest-side,var(--card) 76%,transparent 77%),conic-gradient(var(--ok) calc(var(--p)*1%),var(--bad-soft) 0)}
/* match */
.match-hud{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.timer{font:700 28px ui-monospace,monospace}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{min-height:120px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:inherit;color:inherit;overflow-wrap:anywhere;font-size:15px;transition:opacity .25s,transform .25s,border-color .1s}
.tile img{max-height:60px;max-width:100%;border-radius:6px;margin-top:6px}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* gravity */
.grav{position:relative;height:460px;overflow:hidden;border-radius:16px;margin-top:16px;background:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff7,transparent),radial-gradient(1px 1px at 85% 60%,#fff9,transparent),radial-gradient(1px 1px at 10% 85%,#fff8,transparent),linear-gradient(#080c26,#1d2366)}
.ghud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:700;z-index:2}
.ast{position:absolute;max-width:46%;padding:16px 22px;border-radius:44px;color:#fff;text-align:center;font-weight:600;background:radial-gradient(circle at 30% 30%,#8a7bff,#4a3bc4 60%,#2b2380);box-shadow:0 0 24px #7a6bff88;overflow-wrap:anywhere}
.ast.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.6);opacity:0;filter:blur(4px)}}
.ground{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(#3dd6a0,#178a64);box-shadow:0 -4px 20px #3dd6a055}
.gmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;z-index:3;background:rgba(8,12,38,.7)}
.gmsg .okc{font-size:24px;font-weight:700;color:#7fffc8;margin:8px 0 14px}
.shake{animation:shake .35s}
/* modal & toast */

[data-theme=midnight]{color-scheme:dark;--bg:#0b0e14;--card:#151a23;--text:#ece8dc;--on-ink:#0b0e14;--muted:#8d95a3;--line:#262d3a;--accent:#f2c230;--accent-2:#ffd75a;--accent-soft:#2b2615;--ok:#4ccf8f;--ok-soft:#13302a;--bad:#ff6363;--bad-soft:#3a1c22;--warn:#f2c230;--rule:#1d2431;--margin:#9c7a1c;--hl:#f2c230;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8)}
[data-theme=midnight] body{background:transparent}
[data-theme=midnight] .top{background:rgba(17,21,29,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
[data-theme=midnight] .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e14}
[data-theme=midnight] .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#0b0e14}
[data-theme=midnight] .prog i{background:var(--accent)}
[data-theme=midnight] .ftxt{color:#f3efe2}
[data-theme=midnight] .st-learn{background:#3a2f0e;color:#f2c230}

[data-theme=midnight] h1,[data-theme=midnight] h2,[data-theme=midnight] .stat b,[data-theme=midnight] .mode,[data-theme=midnight] .timer,[data-theme=midnight] .ring,[data-theme=midnight] .ghud,[data-theme=midnight] .done-box h2,[data-theme=midnight] .qcard h2{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.02em}
[data-theme=midnight] h1{font-size:44px;font-weight:900;text-transform:uppercase;line-height:1}
[data-theme=midnight] h2{font-size:26px;font-weight:800}
[data-theme=midnight] .stat b{font-size:40px;font-weight:900}
[data-theme=midnight] .mode{font-size:21px;font-weight:800}
[data-theme=midnight] .mode small{font-family:'Instrument Sans',system-ui,sans-serif;letter-spacing:0}
.bats{position:absolute;inset:0}
.bat{position:absolute;left:-60px;color:#3b4456;opacity:.9;filter:drop-shadow(0 0 6px rgba(251,244,220,.12));animation:batfly linear infinite}
.bat svg{display:block;animation:flap .32s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes batfly{0%{transform:translate(0,0)}25%{transform:translate(28vw,-3vh)}50%{transform:translate(56vw,2vh)}75%{transform:translate(84vw,-2vh)}100%{transform:translate(calc(100vw + 120px),1vh)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
#scene{display:none}
[data-theme=midnight] #scene{display:block;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse 120% 70% at 50% 110%,#1d2638 0%,#0f131c 45%,#07090d 100%)}
.moon{position:absolute;top:17vh;right:3vw;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fbf4dc,#d8cda6 58%,#a39874);box-shadow:0 0 90px 24px rgba(251,244,220,.10);opacity:.8}
.clouds{position:absolute;top:4vh;left:-60%;width:220%;height:40vh;opacity:.55;background:radial-gradient(ellipse 18% 22% at 20% 40%,rgba(120,135,160,.18),transparent 70%),radial-gradient(ellipse 22% 18% at 48% 30%,rgba(120,135,160,.14),transparent 70%),radial-gradient(ellipse 16% 20% at 75% 50%,rgba(120,135,160,.16),transparent 70%);animation:drift 140s linear infinite}
.beam{position:absolute;bottom:-6vh;width:22vw;min-width:180px;height:115vh;background:linear-gradient(to top,rgba(242,194,48,.22),rgba(242,194,48,.06) 55%,rgba(242,194,48,0) 90%);clip-path:polygon(47% 100%,53% 100%,100% 0,0 0);transform-origin:50% 100%;filter:blur(3px)}
.b1{left:18%;animation:sweep 16s ease-in-out infinite alternate}
.b2{left:60%;animation:sweep 21s ease-in-out -8s infinite alternate-reverse}
.city{position:absolute;left:0;right:0;bottom:0;width:100%;height:42vh;min-height:220px}
.city .w{animation:flicker 7s steps(1) infinite}
.rain{position:absolute;inset:-20% -20%;background-image:repeating-linear-gradient(104deg,transparent 0 22px,rgba(190,205,230,.06) 22px 23px);animation:rain .55s linear infinite}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(20deg)}}
@keyframes drift{to{transform:translateX(45%)}}
@keyframes rain{to{transform:translate(-14px,62px)}}
@keyframes flicker{0%,100%{opacity:.75}48%{opacity:.75}50%{opacity:.15}52%{opacity:.75}}
/* motion */
.enter{animation:pagein .28s ease-out}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}}
.flash.in-next{animation:cardin-r .32s cubic-bezier(.2,.8,.2,1)}

const ICONS={cloud:'<path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.5 4.5 0 0 0 7 18z"/>',half:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/>',bolt:'<path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/>',head:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',cards:'<rect x="3" y="7.5" width="14" height="11" rx="1.5"/><path d="M7 4.5h12.5A1.5 1.5 0 0 1 21 6v9.5"/>',target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',pencil:'<path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/>',sound:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>',test:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8.5 8l1.5 1.5 3-3M8.5 14l1.5 1.5 3-3"/>',match:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>',comet:'<circle cx="15" cy="15" r="5"/><path d="M3 3l8 8M7.5 3l5 5M3 7.5l5 5"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',flame:'<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.6 3-5.6 3.6-9.3 2.2 1.3 3.4 3.4 3.5 5.3 1-.8 1.6-2 1.7-3.3 2.6 2 4.2 4.6 4.2 7.3 0 3.6-2.6 6.2-6.5 6.2z"/>',stack:'<path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M3 12.5l9 4 9-4M3 16.5l9 4 9-4"/>',check:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.7 2.7L16 9.6"/>'};

/* ========== storage ========== */
const KEY='studydeck.v1';
function blank(){return{v:1,sets:[],folders:[],settings:{theme:'midnight',themeV2:1,autoSpeak:false,rate:1,vocab:true,vision:true,env:'city',amb:{rain:.5,thunder:.6,hum:.15,on:true}},streak:{last:'',count:0},best:{},xp:0,rank:0,ach:{},daily:{d:'',n:0,done:0},weekly:{w:'',n:0,done:0},refl:{},stats:{answers:0,missions:0,perfect:0,owl:0}}}
function newCard(term='',def='',img=''){return{id:uid(),term,def,img,starred:false,box:0,due:0,right:0,wrong:0}}
function newSet(o={}){const t=Date.now();return Object.assign({id:uid(),title:'',desc:'',folder:'',termLang:'en-US',defLang:'en-US',created:t,updated:t,studied:0,cards:[],opts:{answer:'term',starred:false,front:'term',written:true,track:false}},o)}
function sampleSet(){
  const s=newSet({id:'sample-osi',title:'Sample: OSI Model & Common Ports',desc:'An example set to try every study mode. Edit or delete it anytime.'});
  [['Layer 7 – Application','Network services used directly by apps (HTTP, DNS, SMTP)'],['Layer 6 – Presentation','Formats, encrypts and compresses data'],['Layer 5 – Session','Opens, manages and closes conversations between hosts'],['Layer 4 – Transport','End-to-end delivery using ports (TCP / UDP)'],['Layer 3 – Network','Logical addressing (IP) and routing between networks'],['Layer 2 – Data Link','MAC addresses, frames and switches'],['Layer 1 – Physical','Raw bits over cables, fiber or radio'],['Port 22','SSH'],['Port 53','DNS'],['Port 443','HTTPS']].forEach(([t,d])=>s.cards.push(newCard(t,d)));
  return s;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);const b=blank();return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{}),streak:d.streak||b.streak,best:d.best||{},stats:Object.assign(b.stats,d.stats||{})})}}catch(e){}
  const d=blank();d.sets.push(sampleSet());return d;
}
let DB=load();
if(!DB.settings.themeV2){DB.settings.theme='midnight';DB.settings.themeV2=1}
if(DB.settings.vocab===undefined)DB.settings.vocab=true;if(!DB.settings.env)DB.settings.env='city';if(!DB.settings.amb)DB.settings.amb={rain:.5,thunder:.6,hum:.15};if(DB.settings.amb.on===undefined)DB.settings.amb.on=true;if(DB.settings.vision===undefined)DB.settings.vision=true;
const V=(det,plain)=>DB.settings.vocab?det:plain;
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,200)}
function saveNow(){clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Could not save — browser storage may be full. Export a backup in Settings.')}if(typeof user!=='undefined'&&user&&!inSync)scheduleSync()}
addEventListener('pagehide',saveNow);
const isUnresolved=c=>c.wrong>0&&(status(c)==='learn'||c.wrong>=c.right);
function unresolvedSet(){
  const cards=[];DB.sets.forEach(x=>x.cards.forEach(c=>{if(isUnresolved(c))cards.push(c)}));
  if(!DB.unresOpts)DB.unresOpts={answer:'term',starred:false,front:'term',written:true,track:true};
  return{id:'unresolved',virtual:true,title:V('Unresolved evidence','Cards to fix'),desc:'',folder:'',termLang:'en-US',defLang:'en-US',created:0,updated:0,studied:0,cards,opts:DB.unresOpts};
}
const getSet=id=>id==='unresolved'?unresolvedSet():DB.sets.find(s=>s.id===id);
function caseNo(s){let h=0;for(const ch of String(s.id))h=(h*31+ch.charCodeAt(0))>>>0;return String(h%9000+1000)}
const isClosed=s=>s.cards.length>0&&s.cards.every(c=>status(c)==='master');
const STAT_WORD=()=>V({new:'unexamined',learn:'in progress',master:'verified'},{new:'new',learn:'learning',master:'mastered'});
/* detective vision: highlight other terms of the set inside a definition */
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function visionRe(s){
  if(!DB.settings.vision)return null;
  const ts=[...new Set(s.cards.map(c=>String(c.term||'').trim()).filter(t=>t.length>=3&&t.length<=40))].sort((a,b)=>b.length-a.length).slice(0,80);
  if(!ts.length)return null;
  try{return new RegExp('(?<![\\p{L}\\p{N}])('+ts.map(reEsc).join('|')+')(?![\\p{L}\\p{N}])','giu')}catch(e){return null}
}
function dvHtml(text,re,own){
  if(!re||!text)return nl(text);
  const ownN=norm(own);let out='',last=0;text=String(text);re.lastIndex=0;let m;
  while((m=re.exec(text))){if(norm(m[0])===ownN)continue;out+=nl(text.slice(last,m.index))+`<mark class="dv">${esc(m[0])}</mark>`;last=m.index+m[0].length}
  return out+nl(text.slice(last));
}
function connections(s){
  const out=[],seenK=new Set();
  const others=DB.sets.filter(x=>x.id!==s.id);if(!others.length)return out;
  s.cards.forEach(c=>{
    const tn=norm(c.term);if(tn.length<3)return;
    others.forEach(o=>o.cards.forEach(d=>{
      const dn=norm(d.term);if(dn.length<3)return;
      const hit=dn===tn||(' '+norm(c.def)+' ').includes(' '+dn+' ')||(' '+norm(d.def)+' ').includes(' '+tn+' ');
      const k=c.id+d.id;if(hit&&!seenK.has(k)&&out.length<12){seenK.add(k);out.push({c,d,o})}
    }));
  });
  return out;
}
function overdueHtml(sets){
  if(sessionStorage.getItem('txOff'))return '';
  const lim=Date.now()-DAY;let n=0,best=null,bn=0;
  sets.forEach(x=>{const k=x.cards.filter(c=>c.right+c.wrong>0&&c.due<lim).length;n+=k;if(k>bn){bn=k;best=x}});
  if(!n)return '';
  return `<div class="transmission noprint"><span class="tx-dot"></span><div style="flex:1"><b>Incoming transmission</b><div class="sm">${n} ${V('piece'+(n>1?'s':'')+' of evidence','card'+(n>1?'s':''))} overdue for review by more than a day.</div></div><a class="btn sm primary" href="#/review/${best.id}">Review now</a><button class="ico" id="txX" title="Dismiss">✕</button></div>`;
}
function bindOverdue(){const x=$('#txX');if(x)x.onclick=()=>{try{sessionStorage.setItem('txOff','1')}catch(e){}x.closest('.transmission').remove()}}
function fixSet(s){s.opts=Object.assign({answer:'term',starred:false,front:'term',written:true,track:false},s.opts||{});s.cards=(s.cards||[]).map(c=>Object.assign(newCard(),c));return s}
DB.sets.forEach(fixSet);

/* ========== progress / spaced repetition ========== */
const status=c=>c.box>=3?'master':(c.right+c.wrong===0?'new':'learn');
const INTERVALS=[0,0,1,3,7,16,35]; // days, indexed by box
let lastGain=0;
function record(c,ok,opt={}){
  const was=status(c),now=Date.now();lastGain=0;
  DB.stats.answers++;if(new Date().getHours()<4)DB.stats.owl=1;
  if(ok){
    const firstTry=!(c._lw&&now-c._lw<10*60e3);
    c.right++;c.box=Math.min(c.box+(opt.boost??1),6);gain(opt.xp??(firstTry?15:10));countMission();
  }else{c.wrong++;c.box=1;c._lw=now}
  if(opt.hard){c.box=Math.max(1,c.box)}
  c.due=now+(opt.dueMs??INTERVALS[c.box]*DAY);
  if(was!=='master'&&status(c)==='master'){gain(25);c.mAt=now}
  save();queueProgress();return lastGain;
}
function recordUndoable(c,ok,opt){
  const snap=JSON.stringify({c:{box:c.box,due:c.due,right:c.right,wrong:c.wrong,mAt:c.mAt,_lw:c._lw},xp:DB.xp,daily:DB.daily,weekly:DB.weekly,stats:DB.stats});
  record(c,ok,opt);
  return()=>{const o=JSON.parse(snap);Object.assign(c,o.c);DB.xp=o.xp;DB.daily=o.daily;DB.weekly=o.weekly;DB.stats=o.stats;save()};
}
/* ========== progression: XP, ranks, missions, achievements ========== */
function gain(n){DB.xp=(DB.xp||0)+n;lastGain+=n}
function weekKey(t=new Date()){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return d.getFullYear()+'-W'+(1+Math.round(((d-w1)/DAY-3+(w1.getDay()+6)%7)/7))}
const MISSION={daily:25,dailyXP:100,weekly:150,weeklyXP:300};
function rollMissions(){const t=ymd(),w=weekKey();if(DB.daily.d!==t)DB.daily={d:t,n:0,done:0};if(DB.weekly.w!==w)DB.weekly={w,n:0,done:0}}
function countMission(){
  rollMissions();DB.daily.n++;DB.weekly.n++;
  if(!DB.daily.done&&DB.daily.n>=MISSION.daily){DB.daily.done=1;DB.stats.missions++;gain(MISSION.dailyXP);announce('target','Daily mission complete',`+${MISSION.dailyXP} XP · ${MISSION.daily} pieces of evidence verified`)}
  if(!DB.weekly.done&&DB.weekly.n>=MISSION.weekly){DB.weekly.done=1;gain(MISSION.weeklyXP);announce('flame','Weekly challenge complete',`+${MISSION.weeklyXP} XP`)}
}
const RANKS=[['Civilian',0],['Recruit',0],['Vigilante',50],['Detective',200],['Night Warden',500],['Master Detective',1000]];
const masteredTotal=()=>DB.sets.reduce((n,s)=>n+s.cards.filter(c=>status(c)==='master').length,0);
function rankIndex(){if(!DB.stats.answers)return 0;const m=masteredTotal();let r=1;RANKS.forEach(([,t],i)=>{if(i>1&&m>=t)r=i});return r}
function rankBadge(r,sz=46){const n=Math.max(0,Math.min(r,5));if(n===0)return `<svg class="badge" width="${sz}" height="${sz}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M24 2l19 7v14c0 11-8 19-19 23C13 42 5 34 5 23V9z" stroke-dasharray="4 4" opacity=".7"/><circle cx="24" cy="23" r="3.5" fill="currentColor" stroke="none"/></svg>`;let p='';for(let i=0;i<Math.min(n,4);i++)p+=`<path d="M10 ${34-i*7}l14-8 14 8" />`;if(n>=5)p+=`<path d="M24 4l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="currentColor" stroke="none"/>`;return `<svg class="badge" width="${sz}" height="${sz}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 2l19 7v14c0 11-8 19-19 23C13 42 5 34 5 23V9z" stroke-width="2" opacity=".45"/>${p}</svg>`}
const ACH=[
 ['first','First Case','Answer your first question',()=>DB.stats.answers>0],
 ['streak3','On the Beat','Study 3 days in a row',()=>streakNow()>=3],
 ['streak7','Week of Nights','Study 7 days in a row',()=>streakNow()>=7],
 ['streak30','Relentless','Study 30 days in a row',()=>streakNow()>=30],
 ['m50','Fifty Verified','Master 50 cards',()=>masteredTotal()>=50],
 ['m100','Hundred Cases','Master 100 cards',()=>masteredTotal()>=100],
 ['closed','Case Closed','Master every card in a set of 5 or more',()=>DB.sets.some(s=>s.cards.length>=5&&s.cards.every(c=>status(c)==='master'))],
 ['perfect','Flawless','Score 100% on a test of 10+ questions',()=>DB.stats.perfect>0],
 ['match20','Quick Hands','Finish Match in under 20 seconds',()=>Object.entries(DB.best).some(([k,v])=>k.endsWith(':match')&&v<20)],
 ['grav500','Sky Watcher','Score 500 in Gravity',()=>Object.entries(DB.best).some(([k,v])=>k.endsWith(':gravity')&&v>=500)],
 ['mission5','Mission Ready','Complete 5 daily missions',()=>DB.stats.missions>=5],
 ['owl','Night Owl','Study between midnight and 4 a.m.',()=>DB.stats.owl>0],
 ['builder','Case Builder','Create 5 study sets',()=>DB.sets.length>=5],
 ['reflect7','Reflective','Write 7 daily reflections',()=>Object.keys(DB.refl).length>=7],
];
let progT;
function queueProgress(){clearTimeout(progT);progT=setTimeout(checkProgress,350)}
function checkProgress(){
  let changed=false;
  ACH.forEach(([id,name,desc,test])=>{if(!DB.ach[id]&&test()){DB.ach[id]=Date.now();DB.xp+=50;changed=true;announce('check','Achievement unlocked: '+name,desc+' · +50 XP')}});
  DB.sets.forEach(x=>{if(x.cards.length>=3&&!x.closedAt&&isClosed(x)){x.closedAt=Date.now();DB.xp+=250;changed=true;announce('check',V('Case closed: ','Set mastered: ')+x.title,'+250 XP');celebrate()}});
  const r=rankIndex();
  if(r>(DB.rank||0)){DB.rank=r;changed=true;if(r>=2){const ne=ENVS.find(x=>x[3]===r);announce('rank','Promoted to '+RANKS[r][0],ne?'New environment unlocked: '+ne[1]:'Your new rank is in the Command Center',r);celebrate()}}
  else if(r<(DB.rank||0)){DB.rank=r;changed=true}
  if(changed)save();
}
const annQ=[];let annBusy=false;
function announce(ic,title,sub,r){annQ.push({ic,title,sub,r});if(!annBusy)nextAnn()}
function nextAnn(){
  const a=annQ.shift();const bar=$('#achbar');if(!a||!bar){annBusy=false;return}annBusy=true;
  bar.innerHTML=`<span class="achic">${a.ic==='rank'?rankBadge(a.r,34):icon(a.ic,26)}</span><span><b>${esc(a.title)}</b><small>${esc(a.sub)}</small></span>`;
  bar.classList.add('show');setTimeout(()=>{bar.classList.remove('show');setTimeout(nextAnn,420)},3400);
}
function mergeProg(d){
  if(!d)return;

function bindBulk(root){

function viewSearch(q){

    if(a==='down'&&i<d.cards.length-1){[d.cards[i+1],d.cards[i]]=[d.cards[i],d.cards[i+1]];renderRows()}
    if(a==='rmimg'){d.cards[i].img='';renderRows()}
    if(a==='img'){const u=await pickImage();if(u){d.cards[i].img=u;renderRows()}}
  });
  $('#addBtn').onclick=()=>{d.cards.push(newCard());renderRows(d.cards.length-1)};
  $('#swapBtn').onclick=()=>{d.cards.forEach(c=>{[c.term,c.def]=[c.def,c.term]});const tl=$('#eTL').value;$('#eTL').value=$('#eDL').value;$('#eDL').value=tl;dirty=true;renderRows();toast('Swapped terms and definitions')};
  $('#bulkBtn').onclick=async()=>{const r=await bulkModal();if(r){d.cards=d.cards.filter(c=>c.term.trim()||c.def.trim()||c.img).concat(r);dirty=true;renderRows();toast(`Imported ${r.length} cards`)}};
  const doSave=()=>{
    d.title=$('#eTitle').value.trim();d.desc=$('#eDesc').value.trim();d.folder=$('#eFolder').value;d.termLang=$('#eTL').value;d.defLang=$('#eDL').value;
    const cards=d.cards.filter(c=>c.term.trim()||c.def.trim()||c.img);
    if(!d.title){toast('Give your set a title first');$('#eTitle').focus();return}
    if(!cards.length){toast('Add at least one card');return}
    d.cards=cards;d.updated=Date.now();
    if(isNew)DB.sets.push(d);else DB.sets[DB.sets.findIndex(x=>x.id===s.id)]=d;
    dirty=false;saveNow();queueProgress();location.hash='#/set/'+d.id;toast(isNew?'Set created!':'Saved');
  };
  $('#saveBtn').onclick=doSave;$('#saveBtn2').onclick=doSave;
  setKeys(e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();doSave()}});
  const warn=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
  addEventListener('beforeunload',warn);onCleanup(()=>removeEventListener('beforeunload',warn));
  if(isNew)$('#eTitle').focus();
}

/* ========== study shell ========== */
function shell(s,title,fields,body){
  app.innerHTML=`<div class="row between noprint"><a class="btn ghost sm" href="#/set/${s.id}">← ${esc(s.title)}</a><strong>${title}</strong><button class="btn sm" id="optBtn">⚙ Options</button></div>${body}`;
  $('#optBtn').onclick=()=>{
    const nStar=s.cards.filter(c=>c.starred).length;
    modal(`<h3>${title} options</h3>
      ${fields.front?`<label class="opt"><span>Front of card</span><select id="oF"><option value="term">Term</option><option value="def">Definition</option></select></label>`:''}
      ${fields.front?'':`<label class="opt"><span>Answer with</span><select id="oA"><option value="term">Term</option><option value="def">Definition</option><option value="both">Both</option></select></label>`}
      ${fields.written?`<label class="opt"><span>Include written questions</span><input type="checkbox" id="oW"></label>`:''}
      <label class="opt"><span>Study starred terms only <span class="muted sm">(${nStar} starred)</span></span><input type="checkbox" id="oS" ${nStar?'':'disabled'}></label>
      <label class="opt"><span>Read aloud automatically</span><input type="checkbox" id="oT"></label>
      <div class="row end" style="margin-top:16px"><button class="btn" id="mC">Cancel</button><button class="btn primary" id="mO">Apply & restart</button></div>`);
    const o=s.opts;
    if($('#oF'))$('#oF').value=o.front;if($('#oA'))$('#oA').value=o.answer;if($('#oW'))$('#oW').checked=o.written;
    $('#oS').checked=o.starred&&nStar>0;$('#oT').checked=DB.settings.autoSpeak;
    $('#mC').onclick=()=>closeModal();
    $('#mO').onclick=()=>{if($('#oF'))o.front=$('#oF').value;if($('#oA'))o.answer=$('#oA').value;if($('#oW'))o.written=$('#oW').checked;o.starred=$('#oS').checked;DB.settings.autoSpeak=$('#oT').checked;save();closeModal(true);route()};
  };
}
const emptyStudy=s=>`<div class="card empty"><div style="font-size:48px">🃏</div><h3>Not enough cards to study</h3><p class="muted">Add some terms to this set first.</p><a class="btn primary" href="#/edit/${s.id}">Edit set</a></div>`;

/* ========== flashcards / review ========== */
function viewFlash(s,review){
  const base=review?dueCards(s):pool(s);
  if(!base.length){
    if(review){
      const seen=s.cards.filter(c=>c.right+c.wrong>0);const next=seen.length?Math.min(...seen.map(c=>c.due)):0;
      shell(s,'Review',{front:true},`<div class="card empty"><div style="font-size:48px">🎉</div><h3>Nothing due right now</h3><p class="muted">${seen.length?`Next review: <b>${new Date(next).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</b>. Cards come back after 1, 3, 7, 16 and 35 days as you keep getting them right.`:'Review shows cards you’ve already studied when they’re due again. Start with Learn or Flashcards.'}</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/learn/${s.id}">Learn</a><a class="btn" href="#/flash/${s.id}">Flashcards</a></div></div>`);
    }else shell(s,'Flashcards',{front:true},emptyStudy(s));
    return;
  }
  const track=review||s.opts.track;let rated={1:0,2:0,3:0,4:0};const vre=visionRe(s);
  let deck=[...base],i=0,flipped=false,shuf=false,known=0,still=[],auto=null,dir='';
  const front=s.opts.front==='def'?'def':'term',back=front==='term'?'def':'term';
  shell(s,review?'Review · spaced repetition':track?'Training':'Flashcards',{front:true},`
    <div class="flash-wrap" id="fwrap"></div>
    <div class="row between noprint" id="fctl"></div>
    <div class="prog"><i id="fprog"></i></div>
    <div class="row noprint" style="justify-content:center;margin-top:16px">
      ${review?'':`<button class="btn sm ${track?'on':''}" id="tTrack" title="Rate each card 1–4 to schedule reviews and earn XP">🎯 Training mode</button>`}
      <button class="btn sm" id="tShuf">🔀 Shuffle</button>
      <button class="btn sm" id="tAuto">▶ Autoplay</button>
    </div>
    <p class="muted sm center noprint">${track?'Space = reveal · 1 Didn’t know · 2 Hard · 3 Knew it · 4 Easy':'Space = flip · ← → = previous / next'} · S = star</p>`);
  const fwrap=$('#fwrap'),ctl=$('#fctl');
  const face=(c,side,isFront)=>{const txt=sideText(c,side);return `<div class="label">${track&&isFront?V('Interrogation','Question'):sideName(side)}</div><div class="tools">${sayBtn(txt,langOf(s,side))}${starBtn(s,c)}</div><div class="ftxt ${sizeCls(txt)}">${side==='def'?dvHtml(txt,vre,c.term):nl(txt)}</div>${side==='def'&&c.img?`<img src="${esc(c.img)}" alt="">`:''}`};
  function render(){
    if(i>=deck.length)return done();
    const c=deck[i];flipped=false;
    fwrap.innerHTML=`<div class="flash ${dir?'in-'+dir:''}" id="fc"><div class="face front ${track?'interro':''}">${face(c,front,1)}</div><div class="face back">${face(c,back)}</div></div>`;
    $('#fc').onclick=e=>{if(!e.target.closest('button'))flip()};
    if(track)rateBar();
    else{ctl.innerHTML=`<button class="btn" id="bPrev" ${i?'':'disabled'}>← Prev</button><span class="muted">${i+1} / ${deck.length}</span><button class="btn" id="bNext">Next →</button>`;$('#bPrev').onclick=prev;$('#bNext').onclick=next}
    $('#fprog').style.width=(i/deck.length*100)+'%';
    if(DB.settings.autoSpeak)speak(sideText(c,front),langOf(s,front));
  }
  function rateBar(){
    if(!flipped){ctl.innerHTML=`<span></span><button class="btn primary big" id="bReveal">Reveal answer <kbd>Space</kbd></button><span class="muted">${i+1} / ${deck.length}</span>`;$('#bReveal').onclick=flip;return}
    ctl.innerHTML=`<div class="rates">${[[1,'Didn’t know','badb'],[2,'Hard',''],[3,'Knew it','okb'],[4,'Easy','okb']].map(([k,l,c])=>`<button class="btn ${c}" data-r="${k}"><kbd>${k}</kbd> ${l}</button>`).join('')}</div>`;
    $$('[data-r]',ctl).forEach(b=>b.onclick=()=>mark(+b.dataset.r));
  }
  function flip(){const fc=$('#fc');if(!fc)return;flipped=!flipped;fc.classList.toggle('flipped',flipped);if(track)rateBar();if(flipped&&DB.settings.autoSpeak){const c=deck[i];speak(sideText(c,back),langOf(s,back))}}
  const next=()=>{if(i<deck.length){i++;dir='next';render()}};
  const prev=()=>{if(i>0){i--;dir='prev';render()}};
  function mark(r){
    if(i>=deck.length)return;if(r===true)r=3;if(r===false)r=1;const c=deck[i];
    if(r===1)record(c,false);
    else if(r===2)record(c,true,{boost:0,xp:5,hard:true,dueMs:c.box>=2?DAY:10*60e3});
    else if(r===3)record(c,true);
    else record(c,true,{boost:2});
    rated[r]++;touch(s);if(r>=3)known++;else still.push(c);
    if(lastGain){const t=document.createElement('span');t.className='xpg xpfloat';t.textContent='+'+lastGain+' XP';ctl.appendChild(t)}
    i++;dir='next';setTimeout(render,lastGain?260:0);
  }
  function done(){
    stopAuto();$('#fprog').style.width='100%';ctl.innerHTML='';
    if(track){
      fwrap.innerHTML=`<div class="card done-box"><div class="big-emoji">${still.length?'💪':'🎉'}</div><h2>${still.length?V('Session logged','Keep it up!'):V('All evidence verified','You know them all!')}</h2>
        <p><b style="color:var(--bad)">${rated[1]} didn’t know</b> · <b>${rated[2]} hard</b> · <b style="color:var(--ok)">${rated[3]} knew it</b> · <b style="color:var(--ok)">${rated[4]} easy</b></p>
        <div class="row" style="justify-content:center">${still.length?`<button class="btn primary" id="dAgain">Keep reviewing ${still.length} terms</button>`:''}<button class="btn" id="dRestart">Restart</button><a class="btn" href="#/learn/${s.id}">Try Learn</a></div></div>`;
      if(!still.length)celebrate();
      if(still.length)$('#dAgain').onclick=()=>{deck=shuf?shuffle(still):still;still=[];known=0;rated={1:0,2:0,3:0,4:0};i=0;render()};
    }else{
      fwrap.innerHTML=`<div class="card done-box"><div class="big-emoji">🎉</div><h2>You reviewed all ${deck.length} cards</h2><div class="row" style="justify-content:center"><button class="btn primary" id="dRestart">Restart</button><a class="btn" href="#/learn/${s.id}">Try Learn</a><a class="btn" href="#/test/${s.id}">Take a test</a></div></div>`;
    }
    $('#dRestart').onclick=()=>{deck=shuf?shuffle(base):[...base];still=[];known=0;i=0;render()};
  }
  const stopAuto=()=>{clearInterval(auto);auto=null;const b=$('#tAuto');if(b){b.classList.remove('on');b.textContent='▶ Autoplay'}};
  $('#tShuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf);deck=shuf?shuffle(base):[...base];i=0;still=[];known=0;render();toast(shuf?'Shuffled':'Original order')};
  $('#tAuto').onclick=e=>{if(auto)return stopAuto();e.currentTarget.classList.add('on');e.currentTarget.textContent='⏸ Pause';auto=setInterval(()=>{if(i>=deck.length)return stopAuto();if(!flipped)flip();else if(track)mark(3);else next()},3200)};
  if(!review)$('#tTrack').onclick=()=>{s.opts.track=!s.opts.track;save();route()};
  onCleanup(()=>clearInterval(auto));
  setKeys(e=>{
    if(isTyping(e)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();if(!(track&&flipped))flip()}
    else if(track&&flipped&&/^[1-4]$/.test(e.key)){e.preventDefault();mark(+e.key)}
    else if(e.key==='ArrowRight'){e.preventDefault();track?(flipped?mark(3):flip()):next()}
    else if(e.key==='ArrowLeft'){e.preventDefault();track?(flipped&&mark(1)):prev()}
    else if(e.key.toLowerCase()==='s'&&deck[i]){$('#fc .face.front [data-star]')?.click()}
  });
  render();
}

/* ========== shared question renderer ========== */
function presentQ(stage,s,c,q,type,next,label='',onAnswer){
  let st='ask',finalOk=false,undo=null,opts=null;
  if(type==='mc'){opts=mcOptions(s,c,q);if(opts.length<2)type='written'}
  stage.innerHTML=`<div class="card qcard">
    <div class="row between"><span class="muted sm">${sideName(q.pSide)} ${sayBtn(q.prompt,langOf(s,q.pSide))}</span>${label?`<span class="pill">${label}</span>`:''}</div>
    <div class="qtxt ${sizeCls(q.prompt)}">${nl(q.prompt)||'<span class="muted">(image)</span>'}</div>${q.img?`<img class="qimg" src="${esc(q.img)}" alt="">`:''}
    <div class="muted sm qhint">${type==='mc'?'Choose the matching '+sideName(q.aSide).toLowerCase():'Type the '+sideName(q.aSide).toLowerCase()}</div>
    ${type==='mc'?`<div class="choices">${opts.map((o,k)=>`<button class="choice" data-k="${k}"><kbd>${k+1}</kbd><span>${nl(o)}</span></button>`).join('')}</div>`
      :`<form class="row wform"><input class="wa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the answer"><button class="btn primary">Answer</button></form>`}
    <div class="row end" style="margin-top:10px"><button class="btn ghost sm dk">Don’t know?</button></div>
    <div class="fb"></div></div>`;
  const fb=$('.fb',stage),inp=$('.wa',stage);
  if(inp)inp.focus();
  if(DB.settings.autoSpeak)speak(q.prompt,langOf(s,q.pSide));
  const go=()=>{if(st==='gone')return;st='gone';clearTimeout(qTimer);next(finalOk)};
  function answer(ok,{close=false,given=''}={}){
    if(st!=='ask')return;st='fb';finalOk=ok;undo=recordUndoable(c,ok);touch(s);if(onAnswer)onAnswer(ok);
    $('.dk',stage)?.remove();
    if(inp)inp.readOnly=true;
    if(opts)$$('.choice',stage).forEach(b=>{if(opts[+b.dataset.k]===q.answer)b.classList.add('ok');b.disabled=true});
    $('.qcard',stage).classList.add(ok?'pop':'miss');
    if(ok&&!close){fb.innerHTML=`<div class="fbx ok">✓ ${pick(PRAISE)} ${lastGain?`<span class="xpg">+${lastGain} XP</span>`:''}</div>`;qTimer=setTimeout(go,950);return}
    fb.innerHTML=`<div class="fbx ${ok?'ok':'bad'}">${ok?'✓ Correct — just check your spelling':given?'✗ Not quite, you’re still learning!':'Let’s look at the answer'}</div>
      ${given?`<div class="ans"><small>You said</small><div class="${ok?'okc':'strike'}">${nl(given)}</div></div>`:''}
      ${ok&&given?'':`<div class="ans"><small>Correct answer</small><div class="okc">${nl(q.answer)}</div></div>`}
      ${ok&&given?`<div class="ans"><small>Correct answer</small><div class="okc">${nl(q.answer)}</div></div>`:''}
      <div class="row end" style="margin-top:14px">${!ok&&given?'<button class="btn ghost sm ovr">Override: I was correct</button>':''}<button class="btn primary cont">Continue <kbd>Enter</kbd></button></div>`;
    $('.cont',fb).onclick=go;
    const ov=$('.ovr',fb);if(ov)ov.onclick=()=>{undo();record(c,true);finalOk=true;go()};
    if(!ok&&DB.settings.autoSpeak)speak(q.answer,langOf(s,q.aSide));
  }
  if(opts)$$('.choice',stage).forEach(b=>b.onclick=()=>{if(st!=='ask')return;const ok=opts[+b.dataset.k]===q.answer;if(!ok)b.classList.add('bad');answer(ok)});
  else $('.wform',stage).onsubmit=e=>{e.preventDefault();const v=inp.value;if(!v.trim())return;const g=grade(v,q.answer);answer(g!=='wrong',{close:g==='close',given:v})};
  $('.dk',stage).onclick=()=>answer(false);
  setKeys(e=>{
    if(st==='fb'&&e.key==='Enter'){e.preventDefault();go();return}
    if(st==='ask'&&opts&&/^[1-9]$/.test(e.key)&&!isTyping(e)){$$('.choice',stage)[+e.key-1]?.click()}
  });
  return{timeout:()=>answer(false),get state(){return st}};
}

/* ========== learn ========== */
function viewLearn(s){
  const cards=pool(s);
  if(!cards.length)return shell(s,'Learn',{written:true},emptyStudy(s));
  const written=s.opts.written!==false;
  const lvl=new Map(cards.map(c=>[c.id,0]));
  let order=shuffle(cards),roundN=0,queue=[],results=[];
  shell(s,'Learn',{written:true},`<div class="card" style="margin-top:12px" id="lp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  function prog(){const n=[0,0,0];cards.forEach(c=>n[lvl.get(c.id)]++);const p={new:n[0],learn:n[1],master:n[2]};$('#lp').innerHTML=`<div class="row between sm"><b>Round ${roundN||1}</b><span class="muted">${n[2]} / ${cards.length} mastered</span></div>${barHtml(p,true)}<div class="row legend"><span><i class="dot b-new"></i>Not studied ${n[0]}</span><span><i class="dot b-learn"></i>Familiar ${n[1]}</span><span><i class="dot b-master"></i>Mastered ${n[2]}</span></div>`}
  function nextRound(){
    const left=order.filter(c=>lvl.get(c.id)<2);if(!left.length)return finish();
    left.sort((a,b)=>lvl.get(b.id)-lvl.get(a.id));
    queue=left.slice(0,7);roundN++;results=[];ask();
  }
  function ask(){
    prog();if(!queue.length)return roundEnd();
    const c=queue.shift(),q=qa(s,c),l=lvl.get(c.id);
    presentQ(stage,s,c,q,(l===0||!written)?'mc':'written',ok=>{lvl.set(c.id,ok?Math.min(2,l+1):0);results.push({c,ok,q});ask()},l===0?'New':'Familiar');
  }
  function roundEnd(){
    if(cards.every(c=>lvl.get(c.id)===2))return finish();
    const ok=results.filter(r=>r.ok).length;
    stage.innerHTML=`<div class="card qcard center"><div class="big-emoji" style="font-size:44px">${ok===results.length?'🔥':'👏'}</div><h2 style="margin-top:6px">Round ${roundN} done — ${ok}/${results.length} correct</h2>
      <div class="rlist">${results.map(r=>`<div class="ritem ${r.ok?'ok':'bad'}"><span>${r.ok?'✓':'✗'}</span><b>${nl(r.q.prompt)}</b><span>${nl(r.q.answer)}</span></div>`).join('')}</div>
      <button class="btn primary big" id="nr">Continue to round ${roundN+1} <kbd>Enter</kbd></button></div>`;
    $('#nr').onclick=nextRound;
    setKeys(e=>{if(e.key==='Enter'){e.preventDefault();nextRound()}});
  }
  function finish(){
    prog();
    stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">🏆</div><h2>You’ve mastered all ${cards.length} terms!</h2><p class="muted">Lock it in with a practice test, or come back for spaced review.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Study again</button><a class="btn" href="#/test/${s.id}">Take a test</a><a class="btn" href="#/match/${s.id}">Play Match</a></div></div>`;
    celebrate();
    $('#again').onclick=()=>{cards.forEach(c=>lvl.set(c.id,0));order=shuffle(cards);roundN=0;nextRound()};
    setKeys(null);
  }
  nextRound();
}

/* ========== write ========== */
function viewWrite(s){
  const cards=pool(s);
  if(!cards.length)return shell(s,'Write',{},emptyStudy(s));
  let queue=shuffle(cards),missed=[],round=1,right=0,firstScore=null,roundSize=queue.length;
  shell(s,'Write',{},`<div class="card" style="margin-top:12px" id="wp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  const hud=()=>{const done=roundSize-queue.length;$('#wp').innerHTML=`<div class="row between sm"><b>Round ${round}</b><span><span style="color:var(--ok)">✓ ${right}</span> · <span style="color:var(--bad)">✗ ${missed.length}</span> · ${Math.min(done+1,roundSize)} / ${roundSize}</span></div><div class="prog"><i style="width:${done/roundSize*100}%"></i></div>`};
  function ask(){
    hud();if(!queue.length)return roundEnd();
    const c=queue.shift();
    presentQ(stage,s,c,qa(s,c),'written',ok=>{if(ok)right++;else missed.push(c);ask()});
  }
  function roundEnd(){
    const pct=Math.round(right/roundSize*100);if(firstScore===null)firstScore=pct;
    if(!missed.length){celebrate();stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">🏁</div><h2>All ${cards.length} terms answered correctly!</h2><p class="muted">First-round score: <b>${firstScore}%</b> · finished in ${round} round${round>1?'s':''}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Start over</button><a class="btn" href="#/test/${s.id}">Take a test</a></div></div>`;$('#again').onclick=()=>route();setKeys(null);return}
    stage.innerHTML=`<div class="card qcard center"><h2>Round ${round}: ${pct}%</h2><p>${right} correct · ${missed.length} to review</p><button class="btn primary big" id="nr">Retry the ${missed.length} missed <kbd>Enter</kbd></button></div>`;
    const go=()=>{queue=shuffle(missed);missed=[];right=0;round++;roundSize=queue.length;ask()};
    $('#nr').onclick=go;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  }
  ask();
}

/* ========== spell ========== */
function viewSpell(s){
  const cards=pool(s).filter(c=>sideText(c,s.opts.answer==='def'?'def':'term').trim());
  if(!tts)return shell(s,'Spell',{},`<div class="card empty"><h3>Your browser can’t read text aloud</h3><p class="muted">Spell needs speech synthesis. Try Chrome, Edge or Safari.</p></div>`);
  if(!cards.length)return shell(s,'Spell',{},emptyStudy(s));
  let queue=shuffle(cards),firstTry=0,doneN=0;const missedOnce=new Set(),total=cards.length;
  shell(s,'Spell',{},`<div class="card" style="margin-top:12px" id="sp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  function ask(){
    $('#sp').innerHTML=`<div class="row between sm"><b>Listen and type what you hear</b><span>${doneN} / ${total} spelled</span></div><div class="prog"><i style="width:${doneN/total*100}%"></i></div>`;
    if(!queue.length)return finish();
    const c=queue.shift(),q=qa(s,c),lang=langOf(s,q.aSide);
    let st='ask';
    stage.innerHTML=`<div class="card qcard center">
      <div class="row" style="justify-content:center"><button class="btn big" id="say">🔊 Play</button><button class="btn" id="slow">🐢 Slow</button></div>
      <p class="muted sm" style="margin-top:18px">Hint (${sideName(q.pSide).toLowerCase()}): ${nl(q.prompt)}</p>
      <form class="row wform" style="max-width:520px;margin:0 auto"><input class="wa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear"><button class="btn primary">Check</button></form>
      <div class="fb"></div></div>`;
    const inp=$('.wa',stage),fb=$('.fb',stage);
    const play=r=>{speak(q.answer,lang,r);inp.focus()};
    $('#say').onclick=()=>play();$('#slow').onclick=()=>play(.55);
    setTimeout(()=>play(),250);
    const cont=()=>{if(st==='gone')return;st='gone';clearTimeout(qTimer);ask()};
    $('.wform',stage).onsubmit=e=>{
      e.preventDefault();if(st!=='ask'||!inp.value.trim())return;
      const ok=norm(inp.value)===norm(q.answer);st='fb';inp.readOnly=true;
      if(ok){const first=!missedOnce.has(c.id);if(first)firstTry++;record(c,first);touch(s);doneN++;fb.innerHTML=`<div class="fbx ok">✓ ${pick(PRAISE)}</div>`;qTimer=setTimeout(cont,800);return}
      missedOnce.add(c.id);record(c,false);touch(s);
      const u=[...inp.value],a=[...q.answer];
      fb.innerHTML=`<div class="fbx bad">✗ Not quite — the correct spelling is:</div><div class="spell-diff">${a.map((ch,k)=>`<span class="${(u[k]||'').toLowerCase()===ch.toLowerCase()?'g':'r'}">${esc(ch)}</span>`).join('')}</div><p class="muted sm">You typed: ${esc(inp.value)}</p><div class="row end"><button class="btn primary cont">Continue <kbd>Enter</kbd></button></div>`;
      speak(q.answer,lang,.6);
      queue.splice(Math.min(3,queue.length),0,c);
      $('.cont',fb).onclick=cont;
    };
    setKeys(e=>{if(st==='fb'&&e.key==='Enter'){e.preventDefault();cont()}});
  }
  function finish(){celebrate();stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">🐝</div><h2>Spelling complete!</h2><p>${firstTry} / ${total} spelled right on the first try (${Math.round(firstTry/total*100)}%)</p><button class="btn primary" id="again">Start over</button></div>`;$('#again').onclick=()=>route();setKeys(null)}
  ask();
}

/* ========== test ========== */
function viewTest(s){
  const cards=pool(s);
  if(!cards.length)return shell(s,'Test',{},emptyStudy(s));
  const cfg=s.opts.test||{n:Math.min(20,cards.length),types:['tf','mc','written'].concat(cards.length>=4?['match']:[])};
  shell(s,'Test',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  let qs=[],graded=false,total=0;
  function setup(){
    graded=false;setKeys(null);
    stage.innerHTML=`<div class="card qcard" style="max-width:560px;margin:16px auto"><h2 style="margin-top:0">Set up your test</h2>
      <label class="opt"><span>Questions <span class="muted sm">(max ${cards.length})</span></span><input type="number" id="tN" min="1" max="${cards.length}" value="${Math.min(cfg.n,cards.length)}" style="width:100px"></label>
      <label class="opt"><span>Answer with</span><select id="tA"><option value="term">Term</option><option value="def">Definition</option><option value="both">Both</option></select></label>
      ${[['tf','True / False'],['mc','Multiple choice'],['match','Matching'],['written','Written']].map(([k,l])=>`<label class="opt"><span>${l}</span><input type="checkbox" data-type="${k}" ${cfg.types.includes(k)?'checked':''}></label>`).join('')}
      <div class="row end" style="margin-top:16px"><button class="btn primary big" id="tGo">Create test</button></div></div>`;
    $('#tA').value=s.opts.answer;
    $('#tGo').onclick=()=>{
      const n=Math.max(1,Math.min(cards.length,parseInt($('#tN').value)||1));
      const types=$$('[data-type]',stage).filter(x=>x.checked).map(x=>x.dataset.type);
      if(!types.length)return toast('Pick at least one question type');
      s.opts.answer=$('#tA').value;cfg.n=n;cfg.types=types;s.opts.test={n,types};save();build();
    };
  }
  function build(){
    const chosen=sample(cards,cfg.n),by={tf:[],mc:[],match:[],written:[]};
    chosen.forEach((c,i)=>by[cfg.types[i%cfg.types.length]].push(c));
    qs=[];
    by.tf.forEach(c=>{const q=qa(s,c),others=distinctOthers(s,c,q),fake=others.length&&Math.random()<.5;qs.push({type:'tf',c,q,shown:fake?pick(others):q.answer,truth:!fake,user:null})});
    const mcQ=c=>{const q=qa(s,c);return{type:'mc',c,q,opts:mcOptions(s,c,q),user:null}};
    by.mc.forEach(c=>qs.push(mcQ(c)));
    for(let i=0;i<by.match.length;i+=6){const g=by.match.slice(i,i+6);if(g.length<2){qs.push(mcQ(g[0]));continue}const items=g.map(c=>({c,q:qa(s,c),user:''}));qs.push({type:'match',items,order:shuffle(items.map((_,k)=>k))})}
    by.written.forEach(c=>qs.push({type:'written',c,q:qa(s,c),user:''}));
    render();
  }
  const label={tf:'True or false',mc:'Multiple choice',written:'Written'};
  function render(){
    graded=false;let num=0;total=qs.reduce((n,Q)=>n+(Q.type==='match'?Q.items.length:1),0);
    stage.innerHTML=`<div id="scoreBox"></div><p class="muted center" style="margin:14px 0 0">${total} questions</p>`+qs.map((Q,qi)=>{
      if(Q.type==='match'){const a=num+1;num+=Q.items.length;return `<div class="card tq" data-qi="${qi}"><div class="tqh">${a}–${num} of ${total} · Matching</div><p class="muted sm" style="margin-top:0">Pick the letter of the matching answer for each item.</p><div class="mgrid"><div>${Q.items.map((it,k)=>`<div class="mi"><select data-mk="${k}"><option value="">–</option>${Q.order.map((_,j)=>`<option>${L[j]}</option>`).join('')}</select><span>${nl(it.q.prompt)}</span><span class="mres"></span></div>`).join('')}</div><div>${Q.order.map((k,j)=>`<div class="ma"><b>${L[j]}.</b> ${nl(Q.items[k].q.answer)}</div>`).join('')}</div></div></div>`}
      num++;
      const head=`<div class="tqh">${num} of ${total} · ${label[Q.type]}</div>`;
      if(Q.type==='tf')return `<div class="card tq" data-qi="${qi}">${head}<div class="tf"><div class="qtxt ${sizeCls(Q.q.prompt)}">${nl(Q.q.prompt)}</div><div class="tfeq">↔</div><div class="qtxt ${sizeCls(Q.shown)}">${nl(Q.shown)}</div></div><div class="choices"><button class="choice" data-v="true">True</button><button class="choice" data-v="false">False</button></div></div>`;
      if(Q.type==='mc')return `<div class="card tq" data-qi="${qi}">${head}<div class="qtxt ${sizeCls(Q.q.prompt)}">${nl(Q.q.prompt)}</div>${Q.q.img?`<img class="qimg" src="${esc(Q.q.img)}" alt="">`:''}<div class="muted sm qhint">Choose the matching ${sideName(Q.q.aSide).toLowerCase()}</div><div class="choices">${Q.opts.map((o,k)=>`<button class="choice" data-v="${k}">${nl(o)}</button>`).join('')}</div></div>`;
      return `<div class="card tq" data-qi="${qi}">${head}<div class="qtxt ${sizeCls(Q.q.prompt)}">${nl(Q.q.prompt)}</div>${Q.q.img?`<img class="qimg" src="${esc(Q.q.img)}" alt="">`:''}<div class="muted sm qhint">Type the ${sideName(Q.q.aSide).toLowerCase()}</div><input data-w autocomplete="off" spellcheck="false" placeholder="Type the answer"></div>`;
    }).join('')+`<div class="row" style="justify-content:center;margin-top:24px"><button class="btn primary big" id="submitT">Submit test</button></div>`;
    $('#submitT').onclick=submit;
  }
  stage.addEventListener('click',e=>{
    if(graded)return;const b=e.target.closest('.choice');if(!b)return;
    const tq=b.closest('.tq'),Q=qs[+tq.dataset.qi];
    $$('.choice',tq).forEach(x=>x.classList.toggle('sel',x===b));Q.user=b.dataset.v;
  });
  stage.addEventListener('input',e=>{const tq=e.target.closest('.tq');if(!tq||graded)return;const Q=qs[+tq.dataset.qi];if(e.target.matches('[data-w]'))Q.user=e.target.value});
  stage.addEventListener('change',e=>{const tq=e.target.closest('.tq');if(!tq||graded)return;const Q=qs[+tq.dataset.qi];if(e.target.matches('[data-mk]'))Q.items[+e.target.dataset.mk].user=e.target.value});
  async function submit(){
    const un=qs.reduce((n,Q)=>n+(Q.type==='match'?Q.items.filter(i=>!i.user).length:(Q.user===null||(Q.type==='written'&&!String(Q.user).trim()))?1:0),0);
    if(un&&!(await confirmBox(`You have ${un} unanswered question${un>1?'s':''}. Submit anyway?`,'Submit',false)))return;
    graded=true;let right=0;
    qs.forEach((Q,qi)=>{
      const el=$(`.tq[data-qi="${qi}"]`);
      if(Q.type==='match'){Q.items.forEach((it,k)=>{const cl=L[Q.order.indexOf(k)],ok=it.user===cl;if(ok)right++;record(it.c,ok);const r=$$('.mi',el)[k];r.classList.add(ok?'ok':'bad');$('.mres',r).textContent=ok?'✓':'✗ '+cl});$$('select',el).forEach(x=>x.disabled=true);return}
      let ok=false,corr='';
      if(Q.type==='tf'){ok=Q.user!==null&&(Q.user==='true')===Q.truth;corr=Q.truth?'True':`False — the answer is “${esc(Q.q.answer)}”`;$$('.choice',el).forEach(b=>{if((b.dataset.v==='true')===Q.truth)b.classList.add('ok');else if(b.dataset.v===Q.user)b.classList.add('bad')})}
      if(Q.type==='mc'){ok=Q.user!==null&&Q.opts[+Q.user]===Q.q.answer;corr=nl(Q.q.answer);$$('.choice',el).forEach(b=>{if(Q.opts[+b.dataset.v]===Q.q.answer)b.classList.add('ok');else if(b.dataset.v===Q.user)b.classList.add('bad')})}
      if(Q.type==='written'){ok=grade(Q.user,Q.q.answer)!=='wrong';corr=nl(Q.q.answer);$('input',el).readOnly=true}
      $$('.choice',el).forEach(b=>{b.disabled=true;b.classList.remove('sel')});
      if(ok)right++;record(Q.c,ok);
      el.classList.add(ok?'ok':'bad');
      el.insertAdjacentHTML('beforeend',`<div class="fbx ${ok?'ok':'bad'}">${ok?'✓ Correct':'✗ Correct answer: '+corr}</div>`);
    });
    touch(s);
    const pct=Math.round(right/total*100);if(pct>=80)celebrate();if(pct===100&&total>=10){DB.stats.perfect++;save()}queueProgress();
    $('#scoreBox').innerHTML=`<div class="card score"><div class="ring" style="--p:${pct}">${pct}%</div><div><h2 style="margin:0 0 4px">${pct>=90?'Outstanding! 🎉':pct>=70?'Nice work! 👏':pct>=50?'Getting there 💪':'Keep practicing 📚'}</h2><p style="margin:0 0 12px"><b style="color:var(--ok)">${right} correct</b> · <b style="color:var(--bad)">${total-right} incorrect</b></p><div class="row"><button class="btn primary" id="retake">New test, same settings</button><button class="btn" id="reset">Change settings</button><a class="btn" href="#/learn/${s.id}">Study with Learn</a></div></div></div>`;
    $('#submitT').remove();
    $('#retake').onclick=build;$('#reset').onclick=setup;
    scrollTo({top:0,behavior:'smooth'});
  }
  setup();
}

/* ========== match ========== */
function viewMatch(s){
  const cards=pool(s).filter(c=>c.term.trim()&&(c.def.trim()||c.img));
  if(cards.length<2)return shell(s,'Match',{},`<div class="card empty"><h3>Match needs at least 2 cards with both a term and a definition</h3><a class="btn primary" href="#/edit/${s.id}">Edit set</a></div>`);
  const key=s.id+':match';let timer=null;
  shell(s,'Match',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  onCleanup(()=>clearInterval(timer));
  const fmt=t=>t.toFixed(1)+'s';
  function intro(){
    const best=DB.best[key];
    stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">🧩</div><h2>Ready to play?</h2><p class="muted">Match every term with its definition as fast as you can.<br>Wrong matches add a 1-second penalty.</p>${best?`<p>Your best: <b>${fmt(best)}</b></p>`:''}<button class="btn primary big" id="start">Start game</button></div>`;
    $('#start').onclick=play;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();play()}});
  }
  function play(){
    setKeys(null);
    const pickC=sample(cards,6);
    const tiles=shuffle(pickC.flatMap(c=>[{id:c.id,txt:c.term,side:'t'},{id:c.id,txt:c.def,side:'d',img:c.img}]));
    let sel=null,left=pickC.length,pen=0;const t0=performance.now();
    stage.innerHTML=`<div class="match-hud"><span class="timer" id="tm">0.0s</span><span class="muted" id="pen"></span><button class="btn sm" id="quit">Restart</button></div><div class="match-grid">${tiles.map((t,k)=>`<button class="tile" data-k="${k}"><span>${nl(t.txt)}</span>${t.img?`<img src="${esc(t.img)}" alt="">`:''}</button>`).join('')}</div>`;
    const now=()=>(performance.now()-t0)/1000+pen;
    timer=setInterval(()=>{$('#tm').textContent=fmt(now())},100);
    $('#quit').onclick=()=>{clearInterval(timer);play()};
    $('.match-grid',stage).onclick=e=>{
      const b=e.target.closest('.tile');if(!b||b.classList.contains('gone'))return;
      const t=tiles[+b.dataset.k];
      if(!sel){sel={b,t};b.classList.add('sel');return}
      if(sel.b===b){b.classList.remove('sel');sel=null;return}
      if(sel.t.id===t.id&&sel.t.side!==t.side){sel.b.classList.add('gone');b.classList.add('gone');sel.b.classList.remove('sel');sel=null;if(--left===0)end(now())}
      else{const a=sel.b;a.classList.remove('sel');a.classList.add('wrong');b.classList.add('wrong');pen+=1;$('#pen').textContent=`+${pen}s penalty`;setTimeout(()=>{a.classList.remove('wrong');b.classList.remove('wrong')},450);sel=null}
    };
  }
  function end(t){
    clearInterval(timer);touch(s);
    const best=DB.best[key],rec=!best||t<best;if(rec){DB.best[key]=t;save();celebrate()}queueProgress();
    stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">${rec?'🏆':'⏱️'}</div><h2>${rec?'New personal record!':'Nice job!'}</h2><p style="font-size:34px;font-weight:800;margin:6px 0">${fmt(t)}</p><p class="muted">${rec&&best?`Previous best: ${fmt(best)}`:best?`Your best: ${fmt(best)}`:''}</p><button class="btn primary big" id="again">Play again <kbd>Enter</kbd></button></div>`;
    $('#again').onclick=play;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();play()}});
  }
  intro();
}

/* ========== gravity ========== */
function viewGravity(s){
  const cards=pool(s).filter(c=>c.term.trim()&&c.def.trim());
  if(!cards.length)return shell(s,'Gravity',{},emptyStudy(s));
  const key=s.id+':gravity';let raf=0;
  shell(s,'Gravity',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  onCleanup(()=>cancelAnimationFrame(raf));
  function intro(){
    const best=DB.best[key];
    stage.innerHTML=`<div class="card qcard center"><div style="font-size:54px">☄️</div><h2>Gravity</h2><p class="muted">Asteroids show a ${sideName(s.opts.answer==='def'?'term':'def').toLowerCase()}. Type the answer before they hit the ground.<br>Miss one and you lose a life — then retype the right answer to keep going.</p>${best?`<p>High score: <b>${best}</b></p>`:''}
      <div class="row" style="justify-content:center">${['easy','medium','hard'].map(d=>`<button class="btn ${d==='medium'?'primary':''} big" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div></div>`;
    $$('[data-d]',stage).forEach(b=>b.onclick=()=>play(b.dataset.d));
  }
  function play(diff){
    let lives=3,score=0,level=1,hits=0,speed={easy:20,medium:32,hard:48}[diff],queue=shuffle(cards),cur=null,q=null,y=0,last=0,st='fall';
    stage.innerHTML=`<div class="grav" id="gf"><div class="ghud"><span id="gl"></span><span id="glv"></span><span id="gs"></span></div><div class="ast" id="ast"></div><div class="ground"></div></div><form class="row wform" id="gform" style="margin-top:12px"><input class="wa" id="gin" autocomplete="off" spellcheck="false" placeholder="Type the answer and press Enter"><button class="btn primary">Enter</button></form>`;
    const gf=$('#gf'),ast=$('#ast'),gin=$('#gin');
    const hud=()=>{$('#gl').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('#glv').textContent='Level '+level;$('#gs').textContent='Score '+score};
    function spawn(){
      $('.gmsg',gf)?.remove();
      if(!queue.length)queue=shuffle(cards);
      cur=queue.shift();q=qa(s,cur);
      ast.className='ast';ast.style.display='';ast.innerHTML=nl(q.prompt);
      ast.style.left=(4+Math.random()*48)+'%';y=-ast.offsetHeight;ast.style.top=y+'px';
      st='fall';last=performance.now();gin.value='';gin.focus();hud();
      cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
    }
    function loop(t){
      if(st!=='fall')return;
      const dt=Math.min(.05,(t-last)/1000);last=t;y+=speed*dt;ast.style.top=y+'px';
      if(y+ast.offsetHeight>=gf.clientHeight-26)return miss();
      raf=requestAnimationFrame(loop);
    }
    function miss(){
      st='miss';lives--;record(cur,false);touch(s);ast.style.display='none';queue.splice(Math.min(2,queue.length),0,cur);hud();
      if(lives<=0)return over();
      gf.insertAdjacentHTML('beforeend',`<div class="gmsg"><div>💥 It hit the ground! The answer was:</div><div class="okc">${nl(q.answer)}</div><div class="sm">Type it below to continue</div></div>`);
      gin.value='';gin.focus();
    }
    $('#gform').onsubmit=e=>{
      e.preventDefault();const v=gin.value;if(!v.trim())return;
      if(st==='fall'){
        if(grade(v,q.answer)!=='wrong'){
          st='hit';cancelAnimationFrame(raf);record(cur,true);touch(s);hits++;score+=10*level+Math.max(0,Math.round((gf.clientHeight-y)/20));
          if(hits%5===0){level++;speed*=1.18}
          ast.classList.add('boom');hud();setTimeout(()=>{if(st==='hit')spawn()},380);
        }else{gin.classList.remove('shake');void gin.offsetWidth;gin.classList.add('shake');gin.select()}
      }else if(st==='miss'){
        if(norm(v)===norm(q.answer))spawn();else{gin.classList.remove('shake');void gin.offsetWidth;gin.classList.add('shake');gin.select()}
      }
    };
    function over(){
      cancelAnimationFrame(raf);const best=DB.best[key]||0,rec=score>best;if(rec){DB.best[key]=score;save()}queueProgress();
      gf.insertAdjacentHTML('beforeend',`<div class="gmsg"><div style="font-size:44px">${rec?'🏆':'🪐'}</div><h2 style="margin:4px 0">Game over</h2><div>The last answer was:</div><div class="okc">${nl(q.answer)}</div><div>Score <b>${score}</b> · Level ${level}${rec?' · <b>New high score!</b>':` · Best ${best}`}</div><div class="row" style="margin-top:16px;justify-content:center"><button class="btn primary" id="gAgain">Play again</button><button class="btn" id="gMenu">Change difficulty</button></div></div>`);
      $('#gform').remove();
      $('#gAgain').onclick=()=>play(diff);$('#gMenu').onclick=intro;
    }
    hud();spawn();
  }
  intro();
}



/* ========== environments ========== */

      <g fill="#05070a"><rect x="1190" y="70" width="140" height="100" rx="6"/><path d="M1180 72 L1260 26 L1340 72Z"/><rect x="1196" y="170" width="8" height="52"/><rect x="1316" y="170" width="8" height="52"/><path d="M1200 220 L1320 172 M1320 220 L1200 172" stroke="#05070a" stroke-width="5"/>
      <rect x="296" y="40" width="5" height="182"/><path d="M270 120h58M280 90h38M286 64h26" stroke="#05070a" stroke-width="4"/><rect x="520" y="180" width="60" height="40"/><rect x="900" y="196" width="34" height="24"/></g>
      <circle class="blink" cx="298.5" cy="36" r="5" fill="#ff3b3b"/></svg>`;
  }
  if(e==='cave'&&!$('#envCave').childNodes.length){
    let top='M0 0 ',x=0;const tips=[];while(x<1600){const w=Math.random()*70+30,h=Math.random()*150+30;top+=`L${x|0} ${(Math.random()*20)|0} L${(x+w/2)|0} ${h|0} `;tips.push([x+w/2,h]);x+=w}

  const layer=(fill,minH,maxH,winP)=>{x=-20;while(x<1620){const w=rnd(36,110),h=rnd(minH,maxH),y=420-h;out+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${fill}"/>`;
    if(Math.random()<.3)out+=`<path d="M${(x+w*.2).toFixed(0)} ${y.toFixed(0)}L${(x+w/2).toFixed(0)} ${(y-rnd(20,60)).toFixed(0)}L${(x+w*.8).toFixed(0)} ${y.toFixed(0)}Z" fill="${fill}"/>`;
    if(winP)for(let wy=y+12;wy<410;wy+=16)for(let wx=x+8;wx<x+w-10;wx+=13)if(Math.random()<winP)win+=`<rect class="${Math.random()<.08?'w':''}" x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="5" height="7" fill="#f2c230" opacity="${rnd(.35,.8).toFixed(2)}" style="animation-delay:-${rnd(0,7).toFixed(1)}s"/>`;
    x+=w+rnd(0,6)}};
  layer('#111723',140,330,0);const far=out;out='';layer('#06080c',60,250,.07);
  svg.innerHTML=out+win;$('#cityFar').innerHTML=far;
}
function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.id='fx';c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;document.body.appendChild(c);
  const x=c.getContext('2d'),dpr=devicePixelRatio,mid=document.documentElement.dataset.theme==='midnight';
  const cols=mid?['#f2c230','#ffe9a3','#ffffff','#8d95a3']:['#2449c9','#ffe14d','#14895f','#d93f45','#18263a'];
  const BATP=new Path2D('M29 20 L14 4 L4 9 L9 14 L12 13 L15 19 L19 18 L22 24 L28 27.5 Q32 31 36 27.5 L42 25 L45 20 L49 21 L52 15 L55 16 L61 12 L51 6 L35 20 Q35.5 17.5 34.4 15.6 L35.2 10.6 L32.9 14.2 Q32 13.9 31.1 14.2 L28.8 10.6 L29.6 15.6 Q28.5 17.5 29 20 Z');
  const ps=mid?Array.from({length:46},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.6,vx:(Math.random()-.5)*9,vy:-Math.random()*5-3,s:Math.random()*.5+.45,r:(Math.random()-.5)*.6,vr:0,c:pick(['#04060a','#2a3140','#ece8dc']),bat:1,ph:Math.random()*6})):Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1000;x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{if(p.bat){p.vy-=.06;p.x+=p.vx;p.y+=p.vy;x.save();x.translate(p.x*dpr,p.y*dpr);x.rotate(p.r);x.scale(p.s*dpr,p.s*dpr*(.45+.55*Math.abs(Math.sin(k*18+p.ph))));x.translate(-32,-22);x.globalAlpha=Math.max(0,1-k/2.4);x.fillStyle=p.c;x.fill(BATP);x.restore();return}p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x*dpr,p.y*dpr);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k/2.4);x.fillStyle=p.c;x.fillRect(-p.s*dpr/2,-p.s*dpr/4,p.s*dpr,p.s*dpr/2);x.restore()});
    if(k<2.4)requestAnimationFrame(f);else c.remove()})(t0);
}

/* ========== mobile header: menu + search ========== */
function mMenuRefresh(){
  const p=$('#mPanel');if(!p||p.hidden)return;
  const syncTxt=user?({ok:'✓ Synced',busy:'Syncing…',error:'⚠ Error',offline:'Offline'})[syncState]||'':'Sign in';
  const tname=({midnight:'Midnight',light:'Light',dark:'Dark',system:'Device'})[DB.settings.theme];
  p.innerHTML=`<a href="#/new">${icon('pencil',20)} Create a set</a><a href="#/import">${icon('stack',20)} Import</a><hr>
    <a href="#/detective">${icon('test',20)} ${V('Detective Mode','Weak spots')}</a><a href="#/achievements">${icon('check',20)} Ranks & achievements</a><hr>
    <button class="mi" id="mSync">${icon('cloud',20)} ${user?'Account & sync':'Sign in to sync'}${user?`<span class="mstat">${syncTxt}</span>`:''}</button>
    <button class="mi" id="mTheme">${icon('half',20)} Theme<span class="mstat">${tname}</span></button>
    <a href="#/settings">${icon('gear',20)} Settings</a>`;
  $('#mSync').onclick=()=>{closeMMenu();authModal()};
  $('#mTheme').onclick=()=>{$('#themeBtn').click();mMenuRefresh()};
}
function openMMenu(){const p=$('#mPanel');p.hidden=false;$('#mMenu').setAttribute('aria-expanded','true');$('#ambPanel').hidden=true;hideAmbHint();mMenuRefresh()}
function closeMMenu(){const p=$('#mPanel');if(p)p.hidden=true;const b=$('#mMenu');if(b)b.setAttribute('aria-expanded','false')}
$('#mMenu').onclick=()=>{$('#mPanel').hidden?openMMenu():closeMMenu()};
$('#mPanel').addEventListener('click',e=>{if(e.target.closest('a'))closeMMenu()});
document.addEventListener('mousedown',e=>{if(!$('#mPanel').hidden&&!e.target.closest('#mPanel,#mMenu'))closeMMenu()});
$('#mSearch').onclick=()=>{const t=$('.top');t.classList.toggle('searching');if(t.classList.contains('searching'))$('#globalSearch').focus();else{$('#globalSearch').value='';if(location.hash.startsWith('#/search'))location.hash='#/'}};
addEventListener('hashchange',()=>{closeMMenu();if(!location.hash.startsWith('#/search'))$('.top').classList.remove('searching')});
/* ========== theme & boot ========== */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const t=DB.settings.theme;document.documentElement.dataset.theme=t==='system'?(mq.matches?'dark':'light'):t;$('#themeBtn').title='Theme: '+({midnight:'Midnight',light:'Light',dark:'Dark',system:'Match device'})[t]}
mq.addEventListener?.('change',applyTheme);
$('#themeBtn').onclick=()=>{const order=['midnight','light','dark'],cur=document.documentElement.dataset.theme;DB.settings.theme=order[(order.indexOf(cur)+1)%3];save();applyTheme();toast('Theme: '+({midnight:'Midnight',light:'Light',dark:'Dark'})[DB.settings.theme])};
buildCity();
applyTheme();applyEnv();ambBtn();$('#ambBtn').onclick=()=>{hideAmbHint();ambPanel()};ambAutostart();
route();
setTimeout(checkProgress,1200);
(()=>{ // parallax + lightning (midnight only)
  let pend=false;addEventListener('scroll',()=>{if(pend||document.documentElement.dataset.theme!=='midnight')return;pend=true;requestAnimationFrame(()=>{const y=Math.min(scrollY,1500);$('#cityFar').style.transform=`translateY(${y*-.015}px)`;$('#city').style.transform=`translateY(${y*-.05}px)`;pend=false})},{passive:true});
  const strike=()=>{const sc=$('#scene');if(document.visibilityState==='visible'){if(document.documentElement.dataset.theme==='midnight'&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&sc.dataset.env!=='cave'){sc.classList.remove('strike');void sc.offsetWidth;sc.classList.add('strike')}if(window.onLightning)onLightning()}setTimeout(strike,18000+Math.random()*30000)};
  setTimeout(strike,9000);
})();
