/* ========== study shell ========== */
function shell(s,title,fields,body){
  app.innerHTML=`<div class="shbar noprint"><a class="ico" href="#/set/${s.id}" title="Back to ${esc(s.title)}" aria-label="Back to ${esc(s.title)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="shtitle"><strong>${title}</strong><span>${esc(s.title)}</span></div><button class="ico" id="optBtn" title="Options" aria-label="Options">${icon('gear',20)}</button></div>${body}`;
  $('#optBtn').onclick=()=>{
    const nStar=s.cards.filter(c=>c.starred).length;
    modal(`<h3>${title} options</h3>
      ${fields.front?`<label class="opt"><span>Front of card</span><select id="oF"><option value="term">Term</option><option value="def">Definition</option></select></label>`:''}
      ${fields.front?'':`<label class="opt"><span>Answer with</span><select id="oA"><option value="term">Term</option><option value="def">Definition</option><option value="both">Both</option></select></label>`}
      ${fields.written?`<label class="opt"><span>Include written questions</span><input type="checkbox" id="oW"></label>`:''}
      <label class="opt"><span>Study starred terms only <span class="muted sm">(${nStar} starred)</span></span><input type="checkbox" id="oS" ${nStar?'':'disabled'}></label>
      <label class="opt"><span>Read aloud automatically</span><input type="checkbox" id="oT"></label>
      <div class="row end" style="margin-top:16px"><button class="btn" id="mC">Cancel</button><button class="btn primary" id="mO">Apply & restart</button></div>`);
    const o=s.opts;
    if($('#oF'))$('#oF').value=o.front;if($('#oA'))$('#oA').value=o.answer;if($('#oW'))$('#oW').checked=o.written;
    $('#oS').checked=o.starred&&nStar>0;$('#oT').checked=DB.settings.autoSpeak;
    $('#mC').onclick=()=>closeModal();
    $('#mO').onclick=()=>{if($('#oF'))o.front=$('#oF').value;if($('#oA'))o.answer=$('#oA').value;if($('#oW'))o.written=$('#oW').checked;o.starred=$('#oS').checked;DB.settings.autoSpeak=$('#oT').checked;save();closeModal(true);route()};
  };
}
const emptyStudy=s=>`<div class="card empty">${heroIc('cards')}<h3>Not enough cards to study</h3><p class="muted">Add some terms to this set first.</p><a class="btn primary" href="#/edit/${s.id}">Edit set</a></div>`;

/* ========== flashcards / review ========== */
function viewFlash(s,review){
  const base=review?dueCards(s):pool(s);
  if(!base.length){
    if(review){
      const seen=s.cards.filter(c=>c.right+c.wrong>0);const next=seen.length?Math.min(...seen.map(c=>c.due)):0;
      shell(s,'Review',{front:true},`<div class="card empty">${heroIc('check',1)}<h3>Nothing due right now</h3><p class="muted">${seen.length?`Next review: <b>${new Date(next).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</b>. Cards come back after 1, 3, 7, 16 and 35 days as you keep getting them right.`:'Review shows cards you’ve already studied when they’re due again. Start with Learn or Flashcards.'}</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/learn/${s.id}">Learn</a><a class="btn" href="#/flash/${s.id}">Flashcards</a></div></div>`);
    }else shell(s,'Flashcards',{front:true},emptyStudy(s));
    return;
  }
  const track=review||s.opts.track;let rated={1:0,2:0,3:0,4:0};const vre=visionRe(s);
  let deck=[...base],i=0,flipped=false,shuf=false,known=0,still=[],auto=null,dir='';
  const front=s.opts.front==='def'?'def':'term',back=front==='term'?'def':'term';
  shell(s,review?'Review · spaced repetition':track?'Training':'Flashcards',{front:true},`
    <div class="flash-wrap" id="fwrap"></div>
    <div class="row between noprint" id="fctl"></div>
    <div class="prog"><i id="fprog"></i></div>
    <div class="qtools noprint">
      ${review?'':`<button class="ico ${track?'on':''}" id="tTrack" title="Training mode: rate each card to schedule reviews" aria-label="Training mode" aria-pressed="${track}">${icon('target',20)}</button>`}
      <button class="ico" id="tShuf" title="Shuffle" aria-label="Shuffle">${icon('shuffle',20)}</button>
      <button class="ico" id="tAuto" title="Autoplay" aria-label="Autoplay">${icon('play',20)}</button>
    </div>
    <p class="muted sm center noprint fhint" ${(DB.settings.hintN||0)>=3?'hidden':''}>${matchMedia('(pointer:coarse)').matches?(track?'Tap to reveal. Swipe right if you knew it, left if you didn’t.':'Tap to flip. Swipe to move between cards.'):(track?'Space = reveal · 1 Didn’t know · 2 Hard · 3 Knew it · 4 Easy · or drag the card':'Space = flip · ← → = previous / next')+' · S = star'}</p>`);
  const fwrap=$('#fwrap'),ctl=$('#fctl');DB.settings.hintN=(DB.settings.hintN||0)+1;
  const face=(c,side,isFront)=>{
    if(c.kind==='cloze')return `<div class="label">${isFront?'Fill the blank':'Answer'}</div><div class="tools">${starBtn(s,c)}</div><div class="ftxt cz ${sizeCls(c.raw)}">${clozeHtml(c.raw,c.n,!isFront)}</div>${!isFront&&c.extra?`<div class="czx">${nl(c.extra)}</div>`:''}${c.img?`<img src="${esc(c.img)}" alt="">`:''}${!isFront&&c.mid?mediaImg(c.mid):''}`;
    if(c.kind==='occ')return `<div class="label">${isFront?'What’s under the gold tape?':(c.def||'Answer')}</div><div class="tools">${starBtn(s,c)}</div>${occHtml(c,!isFront,'big')}`;
    const txt=sideText(c,side);const mimg=side==='def'&&c.mid?mediaImg(c.mid):'';return `<div class="label">${track&&isFront?V('Interrogation','Question'):sideName(side)}</div><div class="tools">${sayBtn(txt,langOf(s,side))}${starBtn(s,c)}</div><div class="ftxt ${sizeCls(txt)}">${side==='def'?dvHtml(txt,vre,c.term):nl(txt)}</div>${side==='def'&&c.img?`<img src="${esc(c.img)}" alt="">`:''}${mimg}`};
  function render(){
    if(i>=deck.length)return done();
    const c=deck[i];flipped=false;
    fwrap.innerHTML=`<div class="swipe" id="sw"><div class="flash ${dir?'in-'+dir:''}" id="fc"><div class="face front ${track?'interro':''}">${face(c,front,1)}</div><div class="face back">${face(c,back)}</div></div></div>`;
    $('#fc').onclick=e=>{if(!e.target.closest('button'))flip()};
    bindSwipe($('#sw'),track?{right:()=>mark(3),left:()=>mark(1),lr:'Knew it',ll:'Didn’t know'}:{left:next,right:()=>{if(i>0)prev();else snapBack()},lr:'',ll:''});
    if(track)rateBar();
    else{ctl.innerHTML=`<button class="btn" id="bPrev" ${i?'':'disabled'}>← Prev</button><span class="muted">${i+1} / ${deck.length}</span><button class="btn" id="bNext">Next →</button>`;$('#bPrev').onclick=prev;$('#bNext').onclick=next}
    $('#fprog').style.width=(i/deck.length*100)+'%';
    if(DB.settings.autoSpeak)speak(sideText(c,front),langOf(s,front));
  }
  function rateBar(){
    if(!flipped){ctl.innerHTML=`<span></span><button class="btn primary big" id="bReveal">Show answer <kbd>Space</kbd></button><span class="muted">${i+1} / ${deck.length}</span>`;$('#bReveal').onclick=flip;return}
    const pv=fsrsPreview(deck[i]);
    ctl.innerHTML=`<div class="rates">${[[1,'Didn’t know','badb'],[2,'Hard',''],[3,'Knew it','okb'],[4,'Easy','okb']].map(([k,l,cl])=>`<button class="btn ${cl}" data-r="${k}"><span><kbd>${k}</kbd> ${l}</span><small class="rivl">${pv[k-1]==='now'?'again now':'next in '+pv[k-1]}</small></button>`).join('')}</div>`;
    $$('[data-r]',ctl).forEach(b=>b.onclick=()=>mark(+b.dataset.r));
  }
  function flip(){const fc=$('#fc');if(!fc)return;flipped=!flipped;haptic('light');fc.classList.toggle('flipped',flipped);if(track)rateBar();if(flipped&&DB.settings.autoSpeak){const c=deck[i];speak(sideText(c,back),langOf(s,back))}}
  const next=()=>{if(i<deck.length){i++;dir='next';render()}};
  const prev=()=>{if(i>0){i--;dir='prev';render()}};
  function mark(r){
    if(i>=deck.length)return;if(r===true)r=3;if(r===false)r=1;const c=deck[i];
    if(r===1)record(c,false,{grade:1});
    else if(r===2)record(c,true,{grade:2,xp:5});
    else if(r===3)record(c,true,{grade:3});
    else record(c,true,{grade:4});
    rated[r]++;touch(s);if(r>=3)known++;else still.push(c);
    if(lastGain){const t=document.createElement('span');t.className='xpg xpfloat';t.textContent='+'+lastGain+' XP';ctl.appendChild(t)}
    i++;dir='next';setTimeout(render,lastGain?260:0);
  }
  function done(){
    stopAuto();$('#fprog').style.width='100%';ctl.innerHTML='';
    if(track){
      fwrap.innerHTML=`<div class="card done-box">${heroIc(still.length?'flame':'check',!still.length)}<h2>${still.length?V('Session logged','Keep it up!'):V('All evidence verified','You know them all!')}</h2>
        <p><b style="color:var(--bad)">${rated[1]} didn’t know</b> · <b>${rated[2]} hard</b> · <b style="color:var(--ok)">${rated[3]} knew it</b> · <b style="color:var(--ok)">${rated[4]} easy</b></p>
        <div class="row" style="justify-content:center">${still.length?`<button class="btn primary" id="dAgain">Keep reviewing ${still.length} terms</button>`:''}<button class="btn" id="dRestart">Restart</button><a class="btn" href="#/learn/${s.id}">Try Learn</a></div></div>`;
      if(!still.length)celebrate();
      if(still.length)$('#dAgain').onclick=()=>{deck=shuf?shuffle(still):still;still=[];known=0;rated={1:0,2:0,3:0,4:0};i=0;render()};
    }else{
      fwrap.innerHTML=`<div class="card done-box">${heroIc('check',1)}<h2>You reviewed all ${deck.length} cards</h2><div class="row" style="justify-content:center"><button class="btn primary" id="dRestart">Restart</button><a class="btn" href="#/learn/${s.id}">Try Learn</a><a class="btn" href="#/test/${s.id}">Take a test</a></div></div>`;
    }
    $('#dRestart').onclick=()=>{deck=shuf?shuffle(base):[...base];still=[];known=0;i=0;render()};
  }
  const stopAuto=()=>{clearInterval(auto);auto=null;const b=$('#tAuto');if(b){b.classList.remove('on');b.innerHTML=icon('play',20)}};
  $('#tShuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf);deck=shuf?shuffle(base):[...base];i=0;still=[];known=0;render();toast(shuf?'Shuffled':'Original order')};
  $('#tAuto').onclick=e=>{if(auto)return stopAuto();e.currentTarget.classList.add('on');e.currentTarget.innerHTML=icon('pause',20);auto=setInterval(()=>{if(i>=deck.length)return stopAuto();if(!flipped)flip();else if(track)mark(3);else next()},3200)};
  if(!review)$('#tTrack').onclick=()=>{s.opts.track=!s.opts.track;save();route()};
  onCleanup(()=>clearInterval(auto));
  setKeys(e=>{
    if(isTyping(e)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();if(!(track&&flipped))flip()}
    else if(track&&flipped&&/^[1-4]$/.test(e.key)){e.preventDefault();mark(+e.key)}
    else if(e.key==='ArrowRight'){e.preventDefault();track?(flipped?mark(3):flip()):next()}
    else if(e.key==='ArrowLeft'){e.preventDefault();track?(flipped&&mark(1)):prev()}
    else if(e.key.toLowerCase()==='s'&&deck[i]){$('#fc .face.front [data-star]')?.click()}
  });
  render();
}

let snapBack=()=>{};
/* haptics: native taptic engine in the iPhone app, vibration on Android, nothing elsewhere */
let hapT=0;
function haptic(kind='light'){
  if(DB.settings.haptics===false)return;
  const now=Date.now();if(now-hapT<70&&kind!=='success'&&kind!=='error')return;hapT=now;
  try{
    if(window.QC_IOS&&window.webkit?.messageHandlers?.qc)return window.webkit.messageHandlers.qc.postMessage({type:'haptic',style:kind});
    if(navigator.vibrate&&matchMedia('(pointer:coarse)').matches)navigator.vibrate({tick:6,light:10,medium:18,success:[14],error:[22,50,22],celebrate:[16,60,16,60,28]}[kind]||10);
  }catch(_){}
}
function bindSwipe(el,{left,right,lr,ll}){
  if(!el)return;
  el.insertAdjacentHTML('beforeend',(lr?`<span class="swl r">${lr}</span>`:'')+(ll?`<span class="swl l">${ll}</span>`:''));
  const L=$('.swl.l',el),Rr=$('.swl.r',el),TH=Math.min(110,innerWidth*.26);
  let x0=null,y0=0,dx=0,mode=null,armed=0,quietUntil=0;
  const set=x=>{el.style.transform=x?`translateX(${x}px) rotate(${x/24}deg)`:'';if(Rr)Rr.style.opacity=Math.max(0,Math.min(1,x/TH));if(L)L.style.opacity=Math.max(0,Math.min(1,-x/TH))};
  snapBack=()=>{el.classList.remove('drag');el.classList.add('back');el.style.opacity='';set(0);setTimeout(()=>el.classList.remove('back'),320)};
  const start=(x,y)=>{x0=x;y0=y;dx=0;mode=null;armed=0};
  // returns true once the gesture is a horizontal swipe (so the page shouldn't scroll)
  const move=(x,y)=>{if(x0===null)return false;dx=x-x0;const dy=y-y0;
    if(!mode){if(Math.abs(dx)<8&&Math.abs(dy)<8)return false;mode=Math.abs(dx)>Math.abs(dy)?'x':'y';if(mode==='x')el.classList.add('drag')}
    if(mode!=='x')return false;
    set(dx);const a=dx>TH?1:dx<-TH?-1:0;if(a!==armed){armed=a;if(a)haptic('tick')}
    return true};
  const end=()=>{if(x0===null)return;x0=null;if(mode!=='x')return;quietUntil=Date.now()+400;el.classList.remove('drag');
    const go=dx>TH?right:dx<-TH?left:null;
    if(go){el.classList.add('fly');set(dx>0?innerWidth*1.2:-innerWidth*1.2);el.style.opacity='0';setTimeout(go,170)}else snapBack()};
  // touch (phones): claim horizontal drags so the browser doesn't turn them into scrolling
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('button')){x0=null;return}start(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  el.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;if(move(e.touches[0].clientX,e.touches[0].clientY)&&e.cancelable)e.preventDefault()},{passive:false});
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',()=>{if(mode==='x'){x0=null;snapBack()}else x0=null});
  // mouse / trackpad (computers)
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button>0||e.target.closest('button'))return;start(e.clientX,e.clientY)});
  el.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const was=mode;if(move(e.clientX,e.clientY)&&was!=='x')try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')end()});
  // a drag is not a tap: don't flip the card afterwards
  el.addEventListener('click',e=>{if(Date.now()<quietUntil){e.stopPropagation();e.preventDefault()}},true);
}
/* ========== shared question renderer ========== */
/* ========== AI feedback on typed answers ==========
   The app calls the Supabase Edge Function "grade" (supabase/functions/grade), which holds the Claude key on the server.
   Only used when you're signed in, the answer is an explanation (not a single word), and the normal check says it's wrong. */
const AI={state:'unknown'}; // unknown | ready | missing (function not set up yet)
const aiOn=()=>DB.settings.ai!==false&&!!sb&&!!user&&AI.state!=='missing';
const aiWants=(c,q)=>!c.kind&&!!q.prompt&&(q.aSide==='def'||String(q.answer).trim().split(/\s+/).length>=4);
async function aiCall(body,ms=15000){
  const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms));
  const{data,error}=await Promise.race([sb.functions.invoke('grade',{body}),t]);
  if(error){let code='',status=error.context&&error.context.status;try{code=(await error.context.json()).error||''}catch(e){}
    if(status===404||code==='not_configured'||code==='not_allowed')AI.state='missing';throw new Error(code||error.message||'error')}
  return data;
}
async function aiGrade(s,c,q,given){
  const others=s.cards.filter(x=>x.id!==c.id&&!x.kind&&x.term.trim()).slice(0,40).map(x=>[x.term,x.def]);
  const r=await aiCall({set:s.title,shownSide:q.pSide==='def'?'definition':'term',prompt:q.prompt,reference:q.answer,given,others,strictness:DB.settings.aiStrict||'normal'});
  if(!r||!['correct','partial','wrong'].includes(r.verdict))throw new Error('bad reply');AI.state='ready';return r;
}
// "Explain more": analogy, example, why it matters and a memory hook. Saved on the card so it's free the next time.
async function aiExplain(s,c,given,verdict,mix){
  const h=hashStr(c.term+'\u0001'+c.def);
  if(c.ax&&c.ax.h===h&&!given)return c.ax;
  const r=await aiCall({mode:'explain',set:s.title,term:c.term,definition:c.def,given:given||'',verdict:verdict||'',mix:mix?[mix.term,mix.def]:null},20000);
  if(!r||!r.simple)throw new Error('bad reply');AI.state='ready';
  c.ax={h,simple:r.simple,analogy:r.analogy,example:r.example,why:r.why,hook:r.hook};save();
  return{...c.ax,mistake:r.mistake||''};
}
function explainHtml(x){
  const row=(t,v)=>v?`<p><b>${t}</b>${esc(v)}</p>`:'';
  return`<div class="aix">${row('Your mix-up',x.mistake)}${row('In simple words',x.simple)}${row('Think of it like',x.analogy)}${row('Example',x.example)}${row('Why it matters',x.why)}${x.hook?`<p class="hook"><b>Remember it</b>${esc(x.hook)}</p>`:''}</div>`}
// wire an "Explain more" button inside a feedback box
function wireExplain(box,s,c,given,verdict,mix){
  const b=$('.xpl',box);if(!b)return;
  b.onclick=async()=>{b.disabled=true;b.innerHTML='<span class="spin"></span> Explaining…';
    try{const x=await aiExplain(s,c,given,verdict,mix);if(mix)x.mistake='';// the mix-up banner above already says itconst row=b.closest('.aitools');if(row){row.insertAdjacentHTML('afterend',explainHtml(x));b.remove()}else b.outerHTML=explainHtml(x)}
    catch(e){b.disabled=false;b.textContent='Explain more';toast('Couldn’t get an explanation right now')}}}
const canExplain=c=>aiOn()&&!c.kind&&!!c.term.trim()&&!!c.def.trim();
function presentQ(stage,s,c,q,type,next,label='',onAnswer){
  let st='ask',finalOk=false,undo=null,opts=null,busy=false;const prevMiss=c.miss?{...c.miss}:null;
  if(type==='mc'){opts=mcOptions(s,c,q);if(opts.length<2){type='written';opts=null}}
  stage.innerHTML=`<div class="card qcard">
    <div class="row between"><span class="muted sm">${qHead(q)||sideName(q.pSide)+' '+sayBtn(q.prompt,langOf(s,q.pSide))}</span>${label?`<span class="pill">${label}</span>`:''}</div>
    ${q.occ?'':`<div class="qtxt ${sizeCls(q.prompt)}">${c.kind==='cloze'?clozeHtml(c.raw,c.n,false):nl(q.prompt)||'<span class="muted">(image)</span>'}</div>`}${qVisual(q)}
    <div class="muted sm qhint">${qHint(q,type==='mc')}</div>
    ${type==='mc'?`<div class="choices">${opts.map((o,k)=>`<button class="choice" data-k="${k}"><kbd>${k+1}</kbd><span>${nl(o)}</span></button>`).join('')}</div>`
      :`<form class="row wform"><input class="wa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the answer"><button class="btn primary">Answer</button></form>`}
    <div class="row end" style="margin-top:10px"><button class="btn ghost sm dk">Don’t know?</button></div>
    <div class="fb"></div></div>`;
  const fb=$('.fb',stage),inp=$('.wa',stage);
  if(inp)inp.focus();
  if(DB.settings.autoSpeak)speak(q.prompt,langOf(s,q.pSide));
  const go=()=>{if(st==='gone')return;st='gone';clearTimeout(qTimer);next(finalOk)};
  function answer(ok,{close=false,given='',ai=null}={}){ 
    if(st!=='ask')return;st='fb';finalOk=ok;undo=recordUndoable(c,ok,close&&ok?{grade:2}:{});touch(s);if(onAnswer)onAnswer(ok);
    $('.dk',stage)?.remove();
    if(inp)inp.readOnly=true;
    if(opts)$$('.choice',stage).forEach(b=>{if(opts[+b.dataset.k]===q.answer)b.classList.add('ok');b.disabled=true});
    $('.qcard',stage).classList.add(ok?'pop':'miss');
    if(q.occ){const o=$('.occ',stage);if(o)o.outerHTML=occHtml(c,true)}
    if(ai)return aiFeedback(ok,given,ai);
    if(ok&&!close){fb.innerHTML=`<div class="fbx ok">✓ ${pick(PRAISE)} ${lastGain?`<span class="xpg">+${lastGain} XP</span>`:''}</div>${savedAs(c)}`;qTimer=setTimeout(go,950);return}
    fb.innerHTML=`<div class="fbx ${ok?'ok':'bad'}">${ok?'✓ Correct — just check your spelling':given?'✗ Not quite, you’re still learning!':'Let’s look at the answer'}</div>${savedAs(c)}
      ${given?`<div class="ans"><small>You said</small><div class="${ok?'okc':'strike'}">${nl(given)}</div></div>`:''}
      ${ok&&given?'':`<div class="ans"><small>Correct answer</small><div class="okc">${nl(q.answer)}</div></div>`}
      ${ok&&given?`<div class="ans"><small>Correct answer</small><div class="okc">${nl(q.answer)}</div></div>`:''}
      ${!ok&&prevMiss?lastMissHtml(prevMiss):''}
      ${!ok&&canExplain(c)?'<button class="btn ghost sm xpl">'+icon('spark',15)+' Explain more</button>':''}
      <div class="row end" style="margin-top:14px">${!ok&&given?'<button class="btn ghost sm ovr">Override: I was correct</button>':''}<button class="btn primary cont">Continue <kbd>Enter</kbd></button></div>`;
    $('.cont',fb).onclick=go;wireExplain(fb,s,c,'','');
    const ov=$('.ovr',fb);if(ov)ov.onclick=()=>{undo();record(c,true);finalOk=true;go()};
    if(!ok&&DB.settings.autoSpeak)speak(q.answer,langOf(s,q.aSide));
  }
  function aiFeedback(ok,given,ai){
    const V={correct:['ok','✓ Correct'],partial:['part','◐ Partly right'],wrong:['bad','✗ Not quite']}[ai.verdict];
    const mixCard=ai.confused_with?s.cards.find(x=>x.id!==c.id&&x.term===ai.confused_with):null;
    // mistake memory and mix-up tracking
    if(ai.verdict==='correct'){if(c.miss)delete c.miss}
    else c.miss={g:String(given).slice(0,200),w:String(ai.missing||'').slice(0,240),t:Date.now()};
    if(mixCard){c.mix=c.mix||{};c.mix[mixCard.id]=(c.mix[mixCard.id]||0)+1}
    save();
    fb.innerHTML=`<div class="fbx ${V[0]}">${V[1]} <span class="aiscore">${ai.score}/10</span>${ok&&lastGain?` <span class="xpg">+${lastGain} XP</span>`:''}</div>
      ${savedAs(c)}
      ${prevMiss?(ai.verdict==='correct'?`<p class="lastmiss fixed">✓ You fixed last time’s mistake.</p>`:lastMissHtml(prevMiss)):''}
      ${mixCard?`<div class="mixup"><b>Mix-up:</b> you described <b>${esc(mixCard.term)}</b>, another card in this set.<div class="muted sm">${esc(mixCard.term)}: ${nl(mixCard.def)}</div></div>`:''}
      <div class="aifb">${ai.right?`<p><b>What you got right</b>${esc(ai.right)}</p>`:''}${ai.missing?`<p><b>${ai.verdict==='wrong'?'What went wrong':'What’s missing'}</b>${esc(ai.missing)}</p>`:''}</div>
      <div class="reveal">${ai.better?`<div class="aifb"><p><b>A full answer</b>${esc(ai.better)}</p></div>`:''}
      <div class="ans"><small>The card says</small><div class="okc">${nl(q.answer)}</div></div></div>
      <div class="retryhost"></div>
      <div class="row aitools">${ai.verdict!=='correct'?'<button class="btn sm tryb">↻ Try again</button>':''}${canExplain(c)?'<button class="btn ghost sm xpl">'+icon('spark',15)+' Explain more</button>':''}</div>
      <p class="muted sm aiwho">${icon('spark',14)} Checked by AI. It can be wrong, so trust the card if they disagree.</p>
      <div class="row end" style="margin-top:10px">${ai.verdict!=='correct'?`<button class="btn ghost sm ovr">${ai.verdict==='partial'?'Count it as fully right':'I disagree: I was right'}</button>`:''}<button class="btn primary cont">Continue <kbd>Enter</kbd></button></div>`;
    $('.cont',fb).onclick=go;wireExplain(fb,s,c,given,ai.verdict,mixCard);
    const ov=$('.ovr',fb);if(ov)ov.onclick=()=>{undo();record(c,true);finalOk=true;if(c.miss)delete c.miss;save();go()};
    const tb=$('.tryb',fb);if(tb)tb.onclick=()=>tryAgain(tb);
    if(!ok&&DB.settings.autoSpeak)speak(ai.better||q.answer,langOf(s,q.aSide));
  }
  // one more go from memory: the answers are hidden while you rewrite it, and it doesn't change the schedule
  function tryAgain(tb){
    tb.remove();const rv=$('.reveal',fb);rv.hidden=true;
    const host=$('.retryhost',fb);
    host.innerHTML=`<form class="row wform retry"><input class="wa2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Write it again from memory"><button class="btn primary">Check</button></form><p class="muted sm" style="margin:6px 2px 0">The answer is hidden while you try. This is practice only, so it won’t change the schedule.</p>`;
    const i2=$('.wa2',host);i2.focus();
    $('.retry',host).onsubmit=async e=>{e.preventDefault();const v=i2.value;if(!v.trim())return;
      i2.readOnly=true;const b=$('.retry button',host);b.disabled=true;
      let r=null;const g=grade(v,q.answer);
      if(g!=='wrong')r={verdict:'correct',score:10,right:'That matches the card.',missing:''};
      else{host.insertAdjacentHTML('beforeend','<div class="fbx aiwait"><span class="spin"></span> Checking…</div>');
        try{r=await aiGrade(s,c,q,v)}catch(err){r=null}$('.aiwait',host)?.remove()}
      rv.hidden=false;
      if(!r){host.insertAdjacentHTML('beforeend','<p class="muted sm">Couldn’t check that one. Compare it with the answer below.</p>');return}
      const V2={correct:['ok','✓ Got it now'],partial:['part','◐ Closer'],wrong:['bad','✗ Still not quite']}[r.verdict];
      if(r.verdict==='correct'&&c.miss){delete c.miss;save()}
      host.insertAdjacentHTML('beforeend',`<div class="fbx ${V2[0]} sm2">${V2[1]} <span class="aiscore">${r.score}/10</span></div>${r.verdict!=='correct'&&r.missing?`<p class="sm" style="margin:6px 2px 0">${esc(r.missing)}</p>`:''}`);
      $('.cont',fb).focus();
    };
  }
  if(opts)$$('.choice',stage).forEach(b=>b.onclick=()=>{if(st!=='ask')return;const ok=opts[+b.dataset.k]===q.answer;if(!ok)b.classList.add('bad');answer(ok)});
  else $('.wform',stage).onsubmit=async e=>{e.preventDefault();if(st!=='ask'||busy)return;const v=inp.value;if(!v.trim())return;let g=grade(v,q.answer);
    // another card with the very same question has this answer: that's right too
    if(g==='wrong'&&q.pSide&&c.kind!=='occ'&&s.cards.some(x=>x.id!==c.id&&norm(sideText(x,q.pSide))===norm(q.prompt)&&grade(v,sideText(x,q.aSide))!=='wrong'))g='correct';
    if(g==='wrong'&&aiOn()&&aiWants(c,q)){
      busy=true;inp.readOnly=true;const btn=$('.wform button',stage);btn.disabled=true;
      fb.innerHTML=`<div class="fbx aiwait" role="status"><span class="spin"></span> Checking your answer…</div>`;
      try{const r=await aiGrade(s,c,q,v);if(st!=='ask')return;fb.innerHTML='';busy=false;return answer(r.verdict!=='wrong',{close:r.verdict==='partial',given:v,ai:r})}
      catch(err){console.warn('AI grading unavailable:',err.message);if(st!=='ask')return;fb.innerHTML='';busy=false;inp.readOnly=false;btn.disabled=false;
        if(err.message!=='not_configured'&&AI.state!=='missing')toast('AI check didn’t work this time, so the normal check was used')}
    }
    answer(g!=='wrong',{close:g==='close',given:v})};
  $('.dk',stage).onclick=()=>{if(!busy)answer(false)};
  setKeys(e=>{
    if(st==='fb'&&e.key==='Enter'){if(isTyping(e))return;e.preventDefault();go();return}
    if(st==='ask'&&opts&&/^[1-9]$/.test(e.key)&&!isTyping(e)){$$('.choice',stage)[+e.key-1]?.click()}
  });

}

/* ========== learn ========== */
function viewLearn(s){
  const cards=quizPool(s);
  if(!cards.length)return shell(s,'Learn',{written:true},emptyStudy(s));
  const written=s.opts.written!==false;
  const lvl=new Map(cards.map(c=>[c.id,0]));
  let order=shuffle(cards),roundN=0,queue=[],results=[];
  shell(s,'Learn',{written:true},`<div class="card" style="margin-top:12px" id="lp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  function prog(){const n=[0,0,0];cards.forEach(c=>n[lvl.get(c.id)]++);const p={new:n[0],learn:n[1],master:n[2]};$('#lp').innerHTML=`<div class="row between sm"><b>Round ${roundN||1}</b><span class="muted">${n[2]} / ${cards.length} learned</span></div>${barHtml(p,true)}<div class="row legend lp-legend"><span><i class="dot b-new"></i>New ${n[0]}</span><span><i class="dot b-learn"></i>Learning ${n[1]}</span><span><i class="dot b-master"></i>Learned ${n[2]}</span></div>`}
  function nextRound(){
    const left=order.filter(c=>lvl.get(c.id)<2);if(!left.length)return finish();
    left.sort((a,b)=>lvl.get(b.id)-lvl.get(a.id));
    queue=left.slice(0,7);roundN++;results=[];ask();
  }
  function ask(){
    prog();if(!queue.length)return roundEnd();
    const c=queue.shift(),q=qa(s,c),l=lvl.get(c.id);
    presentQ(stage,s,c,q,(l===0||!written)?'mc':'written',ok=>{lvl.set(c.id,ok?Math.min(2,l+1):0);results.push({c,ok,q});ask()},l===0?'New':'Familiar');
  }
  function roundEnd(){
    if(cards.every(c=>lvl.get(c.id)===2))return finish();
    const ok=results.filter(r=>r.ok).length;
    stage.innerHTML=`<div class="card qcard center">${heroIc(ok===results.length?'flame':'check',ok===results.length)}<h2 style="margin-top:6px">Round ${roundN} done — ${ok}/${results.length} correct</h2>
      <div class="rlist">${results.map(r=>`<div class="ritem ${r.ok?'ok':'bad'}"><span>${r.ok?'✓':'✗'}</span><b>${nl(r.q.prompt)}</b><span>${nl(r.q.answer)}</span></div>`).join('')}</div>
      <button class="btn primary big" id="nr">Continue to round ${roundN+1} <kbd>Enter</kbd></button></div>`;
    $('#nr').onclick=nextRound;
    setKeys(e=>{if(e.key==='Enter'){e.preventDefault();nextRound()}});
  }
  function finish(){
    prog();
    stage.innerHTML=`<div class="card qcard center">${heroIc('trophy',1)}<h2>You’ve learned all ${cards.length} term${cards.length>1?'s':''}!</h2><p class="muted">They’ll come back for review over the next few days. That’s what moves them into long-term memory.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Study again</button><a class="btn" href="#/test/${s.id}">Take a test</a><a class="btn" href="#/match/${s.id}">Play Match</a></div></div>`;
    celebrate();
    $('#again').onclick=()=>{cards.forEach(c=>lvl.set(c.id,0));order=shuffle(cards);roundN=0;nextRound()};
    setKeys(null);
  }
  nextRound();
}

/* ========== write ========== */
function viewWrite(s){
  const cards=quizPool(s);
  if(!cards.length)return shell(s,'Write',{},emptyStudy(s));
  let queue=shuffle(cards),missed=[],round=1,right=0,firstScore=null,roundSize=queue.length;
  shell(s,'Write',{},`<div class="card" style="margin-top:12px" id="wp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  const hud=()=>{const done=roundSize-queue.length;$('#wp').innerHTML=`<div class="row between sm"><b>Round ${round}</b><span><span style="color:var(--ok)">✓ ${right}</span> · <span style="color:var(--bad)">✗ ${missed.length}</span> · ${Math.min(done+1,roundSize)} / ${roundSize}</span></div><div class="prog"><i style="width:${done/roundSize*100}%"></i></div>`};
  function ask(){
    hud();if(!queue.length)return roundEnd();
    const c=queue.shift();
    presentQ(stage,s,c,qa(s,c),'written',ok=>{if(ok)right++;else missed.push(c);ask()});
  }
  function roundEnd(){
    const pct=Math.round(right/roundSize*100);if(firstScore===null)firstScore=pct;
    if(!missed.length){celebrate();stage.innerHTML=`<div class="card qcard center">${heroIc('flag',1)}<h2>All ${cards.length} terms answered correctly!</h2><p class="muted">First-round score: <b>${firstScore}%</b> · finished in ${round} round${round>1?'s':''}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Start over</button><a class="btn" href="#/test/${s.id}">Take a test</a></div></div>`;$('#again').onclick=()=>route();setKeys(null);return}
    stage.innerHTML=`<div class="card qcard center"><h2>Round ${round}: ${pct}%</h2><p>${right} correct · ${missed.length} to review</p><button class="btn primary big" id="nr">Retry the ${missed.length} missed <kbd>Enter</kbd></button></div>`;
    const go=()=>{queue=shuffle(missed);missed=[];right=0;round++;roundSize=queue.length;ask()};
    $('#nr').onclick=go;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  }
  ask();
}

/* ========== spell ========== */
function viewSpell(s){
  const cards=pool(s).filter(c=>!c.kind).filter(c=>sideText(c,s.opts.answer==='def'?'def':'term').trim());
  if(!tts)return shell(s,'Spell',{},`<div class="card empty"><h3>Your browser can’t read text aloud</h3><p class="muted">Spell needs speech synthesis. Try Chrome, Edge or Safari.</p></div>`);
  if(!cards.length)return shell(s,'Spell',{},emptyStudy(s));
  let queue=shuffle(cards),firstTry=0,doneN=0;const missedOnce=new Set(),total=cards.length;
  shell(s,'Spell',{},`<div class="card" style="margin-top:12px" id="sp"></div><div id="stage"></div>`);
  const stage=$('#stage');
  function ask(){
    $('#sp').innerHTML=`<div class="row between sm"><b>Listen and type what you hear</b><span>${doneN} / ${total} spelled</span></div><div class="prog"><i style="width:${doneN/total*100}%"></i></div>`;
    if(!queue.length)return finish();
    const c=queue.shift(),q=qa(s,c),lang=langOf(s,q.aSide);
    let st='ask';
    stage.innerHTML=`<div class="card qcard center">
      <div class="row" style="justify-content:center"><button class="btn big" id="say">${icon('sound',18)} Play</button><button class="btn" id="slow">Slow</button></div>
      <p class="muted sm" style="margin-top:18px">Hint (${sideName(q.pSide).toLowerCase()}): ${nl(q.prompt)}</p>
      <form class="row wform" style="max-width:520px;margin:0 auto"><input class="wa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear"><button class="btn primary">Check</button></form>
      <div class="fb"></div></div>`;
    const inp=$('.wa',stage),fb=$('.fb',stage);
    const play=r=>{speak(q.answer,lang,r);inp.focus()};
    $('#say').onclick=()=>play();$('#slow').onclick=()=>play(.55);
    setTimeout(()=>play(),250);
    const cont=()=>{if(st==='gone')return;st='gone';clearTimeout(qTimer);ask()};
    $('.wform',stage).onsubmit=e=>{
      e.preventDefault();if(st!=='ask'||!inp.value.trim())return;
      const ok=norm(inp.value)===norm(q.answer);st='fb';inp.readOnly=true;
      if(ok){const first=!missedOnce.has(c.id);if(first)firstTry++;record(c,first);touch(s);doneN++;fb.innerHTML=`<div class="fbx ok">✓ ${pick(PRAISE)}</div>`;qTimer=setTimeout(cont,800);return}
      missedOnce.add(c.id);record(c,false);touch(s);
      const u=[...inp.value],a=[...q.answer];
      fb.innerHTML=`<div class="fbx bad">✗ Not quite — the correct spelling is:</div><div class="spell-diff">${a.map((ch,k)=>`<span class="${(u[k]||'').toLowerCase()===ch.toLowerCase()?'g':'r'}">${esc(ch)}</span>`).join('')}</div><p class="muted sm">You typed: ${esc(inp.value)}</p><div class="row end"><button class="btn primary cont">Continue <kbd>Enter</kbd></button></div>`;
      speak(q.answer,lang,.6);
      queue.splice(Math.min(3,queue.length),0,c);
      $('.cont',fb).onclick=cont;
    };
    setKeys(e=>{if(st==='fb'&&e.key==='Enter'){e.preventDefault();cont()}});
  }
  function finish(){celebrate();stage.innerHTML=`<div class="card qcard center">${heroIc('trophy',1)}<h2>Spelling complete!</h2><p>${firstTry} / ${total} spelled right on the first try (${Math.round(firstTry/total*100)}%)</p><button class="btn primary" id="again">Start over</button></div>`;$('#again').onclick=()=>route();setKeys(null)}
  ask();
}

/* ========== test ========== */
function viewTest(s){
  const cards=quizPool(s);
  if(!cards.length)return shell(s,'Test',{},emptyStudy(s));
  const cfg=s.opts.test||{n:Math.min(20,cards.length),types:['tf','mc','written'].concat(cards.length>=4?['match']:[])};
  shell(s,'Test',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  let qs=[],graded=false,total=0;
  function setup(){
    graded=false;setKeys(null);
    stage.innerHTML=`<div class="card qcard" style="max-width:560px;margin:16px auto"><h2 style="margin-top:0">Set up your test</h2>
      <label class="opt"><span>Questions <span class="muted sm">(max ${cards.length})</span></span><input type="number" id="tN" min="1" max="${cards.length}" value="${Math.min(cfg.n,cards.length)}" style="width:100px"></label>
      <label class="opt"><span>Answer with</span><select id="tA"><option value="term">Term</option><option value="def">Definition</option><option value="both">Both</option></select></label>
      ${[['tf','True / False'],['mc','Multiple choice'],['match','Matching'],['written','Written']].map(([k,l])=>`<label class="opt"><span>${l}</span><input type="checkbox" data-type="${k}" ${cfg.types.includes(k)?'checked':''}></label>`).join('')}
      <div class="row end" style="margin-top:16px"><button class="btn primary big" id="tGo">Create test</button></div></div>`;
    $('#tA').value=s.opts.answer;
    $('#tGo').onclick=()=>{
      const n=Math.max(1,Math.min(cards.length,parseInt($('#tN').value)||1));
      const types=$$('[data-type]',stage).filter(x=>x.checked).map(x=>x.dataset.type);
      if(!types.length)return toast('Pick at least one question type');
      s.opts.answer=$('#tA').value;cfg.n=n;cfg.types=types;s.opts.test={n,types};save();build();
    };
  }
  function build(){
    const chosen=sample(cards,cfg.n),by={tf:[],mc:[],match:[],written:[]};
    chosen.forEach((c,i)=>by[cfg.types[i%cfg.types.length]].push(c));
    qs=[];
    by.tf.forEach(c=>{const q=qa(s,c),others=distinctOthers(s,c,q),fake=others.length&&Math.random()<.5;qs.push({type:'tf',c,q,shown:fake?pick(others):q.answer,truth:!fake,user:null})});
    const mcQ=c=>{const q=qa(s,c);return{type:'mc',c,q,opts:mcOptions(s,c,q),user:null}};
    by.mc.forEach(c=>qs.push(mcQ(c)));
    for(let i=0;i<by.match.length;i+=6){const g=by.match.slice(i,i+6);if(g.length<2){qs.push(mcQ(g[0]));continue}const items=g.map(c=>({c,q:qa(s,c),user:''}));qs.push({type:'match',items,order:shuffle(items.map((_,k)=>k))})}
    by.written.forEach(c=>qs.push({type:'written',c,q:qa(s,c),user:''}));
    render();
  }
  const label={tf:'True or false',mc:'Multiple choice',written:'Written'};
  function render(){
    graded=false;let num=0;total=qs.reduce((n,Q)=>n+(Q.type==='match'?Q.items.length:1),0);
    stage.innerHTML=`<div id="scoreBox"></div><p class="muted center" style="margin:14px 0 0">${total} questions</p>`+qs.map((Q,qi)=>{
      if(Q.type==='match'){const a=num+1;num+=Q.items.length;return `<div class="card tq" data-qi="${qi}"><div class="tqh">${a}–${num} of ${total} · Matching</div><p class="muted sm" style="margin-top:0">Pick the letter of the matching answer for each item.</p><div class="mgrid"><div>${Q.items.map((it,k)=>`<div class="mi"><select data-mk="${k}"><option value="">–</option>${Q.order.map((_,j)=>`<option>${L[j]}</option>`).join('')}</select><span>${nl(it.q.prompt)}</span><span class="mres"></span></div>`).join('')}</div><div>${Q.order.map((k,j)=>`<div class="ma"><b>${L[j]}.</b> ${nl(Q.items[k].q.answer)}</div>`).join('')}</div></div></div>`}
      num++;
      const head=`<div class="tqh">${num} of ${total} · ${label[Q.type]}</div>`;
      if(Q.type==='tf')return `<div class="card tq" data-qi="${qi}">${head}<div class="tf"><div class="qtxt ${sizeCls(Q.q.prompt)}">${nl(Q.q.prompt)}</div><div class="tfeq">↔</div><div class="qtxt ${sizeCls(Q.shown)}">${nl(Q.shown)}</div></div><div class="choices"><button class="choice" data-v="true">True</button><button class="choice" data-v="false">False</button></div></div>`;
      if(Q.type==='mc')return `<div class="card tq" data-qi="${qi}">${head}${Q.q.occ?'':`<div class="qtxt ${sizeCls(Q.q.prompt)}">${Q.c.kind==='cloze'?clozeHtml(Q.c.raw,Q.c.n,false):nl(Q.q.prompt)}</div>`}${qVisual(Q.q)}<div class="muted sm qhint">${qHint(Q.q,true)}</div><div class="choices">${Q.opts.map((o,k)=>`<button class="choice" data-v="${k}">${nl(o)}</button>`).join('')}</div></div>`;
      return `<div class="card tq" data-qi="${qi}">${head}${Q.q.occ?'':`<div class="qtxt ${sizeCls(Q.q.prompt)}">${Q.c.kind==='cloze'?clozeHtml(Q.c.raw,Q.c.n,false):nl(Q.q.prompt)}</div>`}${qVisual(Q.q)}<div class="muted sm qhint">${qHint(Q.q,false)}</div><input data-w autocomplete="off" spellcheck="false" placeholder="Type the answer"></div>`;
    }).join('')+`<div class="row" style="justify-content:center;margin-top:24px"><button class="btn primary big" id="submitT">Submit test</button></div>`;
    $('#submitT').onclick=submit;
  }
  stage.addEventListener('click',e=>{
    if(graded)return;const b=e.target.closest('.choice');if(!b)return;
    const tq=b.closest('.tq'),Q=qs[+tq.dataset.qi];
    $$('.choice',tq).forEach(x=>x.classList.toggle('sel',x===b));Q.user=b.dataset.v;
  });
  stage.addEventListener('input',e=>{const tq=e.target.closest('.tq');if(!tq||graded)return;const Q=qs[+tq.dataset.qi];if(e.target.matches('[data-w]'))Q.user=e.target.value});
  stage.addEventListener('change',e=>{const tq=e.target.closest('.tq');if(!tq||graded)return;const Q=qs[+tq.dataset.qi];if(e.target.matches('[data-mk]'))Q.items[+e.target.dataset.mk].user=e.target.value});
  async function submit(){
    const un=qs.reduce((n,Q)=>n+(Q.type==='match'?Q.items.filter(i=>!i.user).length:(Q.user===null||(Q.type==='written'&&!String(Q.user).trim()))?1:0),0);
    if(un&&!(await confirmBox(`You have ${un} unanswered question${un>1?'s':''}. Submit anyway?`,'Submit',false)))return;
    graded=true;let right=0;
    qs.forEach((Q,qi)=>{
      const el=$(`.tq[data-qi="${qi}"]`);
      if(Q.type==='match'){Q.items.forEach((it,k)=>{const cl=L[Q.order.indexOf(k)],ok=it.user===cl;if(ok)right++;record(it.c,ok);const r=$$('.mi',el)[k];r.classList.add(ok?'ok':'bad');$('.mres',r).textContent=ok?'✓':'✗ '+cl});$$('select',el).forEach(x=>x.disabled=true);return}
      let ok=false,corr='';
      if(Q.type==='tf'){ok=Q.user!==null&&(Q.user==='true')===Q.truth;corr=Q.truth?'True':`False — the answer is “${esc(Q.q.answer)}”`;$$('.choice',el).forEach(b=>{if((b.dataset.v==='true')===Q.truth)b.classList.add('ok');else if(b.dataset.v===Q.user)b.classList.add('bad')})}
      if(Q.type==='mc'){ok=Q.user!==null&&Q.opts[+Q.user]===Q.q.answer;corr=nl(Q.q.answer);$$('.choice',el).forEach(b=>{if(Q.opts[+b.dataset.v]===Q.q.answer)b.classList.add('ok');else if(b.dataset.v===Q.user)b.classList.add('bad')})}
      if(Q.type==='written'){ok=grade(Q.user,Q.q.answer)!=='wrong'||Q.c.kind!=='occ'&&s.cards.some(x=>x.id!==Q.c.id&&norm(sideText(x,Q.q.pSide))===norm(Q.q.prompt)&&grade(Q.user,sideText(x,Q.q.aSide))!=='wrong');corr=nl(Q.q.answer);$('input',el).readOnly=true}
      $$('.choice',el).forEach(b=>{b.disabled=true;b.classList.remove('sel')});
      if(ok)right++;record(Q.c,ok);
      el.classList.add(ok?'ok':'bad');
      el.insertAdjacentHTML('beforeend',`<div class="fbx ${ok?'ok':'bad'}">${ok?'✓ Correct':'✗ Correct answer: '+corr}</div>`);
    });
    touch(s);
    const pct=Math.round(right/total*100);if(pct>=80)celebrate();if(pct===100&&total>=10){DB.stats.perfect++;save()}queueProgress();
    $('#scoreBox').innerHTML=`<div class="card score"><div class="ring" style="--p:${pct}">${pct}%</div><div><h2 style="margin:0 0 4px">${pct>=90?'Outstanding':pct>=70?'Nice work':pct>=50?'Getting there':'Keep practising'}</h2><p style="margin:0 0 12px"><b style="color:var(--ok)">${right} correct</b> · <b style="color:var(--bad)">${total-right} incorrect</b></p><div class="row"><button class="btn primary" id="retake">New test, same settings</button><button class="btn" id="reset">Change settings</button><a class="btn" href="#/learn/${s.id}">Study with Learn</a></div></div></div>`;
    $('#submitT').remove();
    $('#retake').onclick=build;$('#reset').onclick=setup;
    scrollTo({top:0,behavior:'smooth'});
  }
  setup();
}

/* ========== match ========== */
function viewMatch(s){
  const cards=pool(s).filter(c=>c.kind!=='occ').filter(c=>c.term.trim()&&(c.def.trim()||c.img));
  if(cards.length<2)return shell(s,'Match',{},`<div class="card empty"><h3>Match needs at least 2 cards with both a term and a definition</h3><a class="btn primary" href="#/edit/${s.id}">Edit set</a></div>`);
  const key=s.id+':match';let timer=null;
  shell(s,'Match',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  onCleanup(()=>clearInterval(timer));
  const fmt=t=>t.toFixed(1)+'s';
  function intro(){
    const best=DB.best[key];
    stage.innerHTML=`<div class="card qcard center">${heroIc('match')}<h2>Ready to play?</h2><p class="muted">Match every term with its definition as fast as you can.<br>Wrong matches add a 1-second penalty.</p>${best?`<p>Your best: <b>${fmt(best)}</b></p>`:''}<button class="btn primary big" id="start">Start game</button></div>`;
    $('#start').onclick=play;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();play()}});
  }
  function play(){
    setKeys(null);
    const pickC=sample(cards,6);
    const tiles=shuffle(pickC.flatMap(c=>[{id:c.id,txt:c.term,side:'t'},{id:c.id,txt:c.def,side:'d',img:c.img}]));
    let sel=null,left=pickC.length,pen=0;const t0=performance.now();
    stage.innerHTML=`<div class="match-hud"><span class="timer" id="tm">0.0s</span><span class="muted" id="pen"></span><button class="btn sm" id="quit">Restart</button></div><div class="match-grid">${tiles.map((t,k)=>`<button class="tile" data-k="${k}"><span>${nl(t.txt)}</span>${t.img?`<img src="${esc(t.img)}" alt="">`:''}</button>`).join('')}</div>`;
    const now=()=>(performance.now()-t0)/1000+pen;
    timer=setInterval(()=>{$('#tm').textContent=fmt(now())},100);
    $('#quit').onclick=()=>{clearInterval(timer);play()};
    $('.match-grid',stage).onclick=e=>{
      const b=e.target.closest('.tile');if(!b||b.classList.contains('gone'))return;
      const t=tiles[+b.dataset.k];
      if(!sel){sel={b,t};b.classList.add('sel');return}
      if(sel.b===b){b.classList.remove('sel');sel=null;return}
      if(sel.t.id===t.id&&sel.t.side!==t.side){sel.b.classList.add('gone');b.classList.add('gone');sel.b.classList.remove('sel');sel=null;if(--left===0)end(now())}
      else{const a=sel.b;a.classList.remove('sel');a.classList.add('wrong');b.classList.add('wrong');pen+=1;$('#pen').textContent=`+${pen}s penalty`;setTimeout(()=>{a.classList.remove('wrong');b.classList.remove('wrong')},450);sel=null}
    };
  }
  function end(t){
    clearInterval(timer);touch(s);
    const best=DB.best[key],rec=!best||t<best;if(rec){DB.best[key]=t;save();celebrate()}queueProgress();
    stage.innerHTML=`<div class="card qcard center">${heroIc(rec?'trophy':'clock',rec)}<h2>${rec?'New personal record!':'Nice job!'}</h2><p style="font-size:34px;font-weight:800;margin:6px 0">${fmt(t)}</p><p class="muted">${rec&&best?`Previous best: ${fmt(best)}`:best?`Your best: ${fmt(best)}`:''}</p><button class="btn primary big" id="again">Play again <kbd>Enter</kbd></button></div>`;
    $('#again').onclick=play;setKeys(e=>{if(e.key==='Enter'){e.preventDefault();play()}});
  }
  intro();
}

/* ========== gravity ========== */
function viewGravity(s){
  const cards=pool(s).filter(c=>!c.kind).filter(c=>c.term.trim()&&c.def.trim());
  if(!cards.length)return shell(s,'Gravity',{},emptyStudy(s));
  const key=s.id+':gravity';let raf=0;
  shell(s,'Gravity',{},`<div id="stage"></div>`);
  const stage=$('#stage');
  onCleanup(()=>cancelAnimationFrame(raf));
  function intro(){
    const best=DB.best[key];
    stage.innerHTML=`<div class="card qcard center">${heroIc('comet')}<h2>Gravity</h2><p class="muted">Asteroids show a ${sideName(s.opts.answer==='def'?'term':'def').toLowerCase()}. Type the answer before they hit the ground.<br>Miss one and you lose a life — then retype the right answer to keep going.</p>${best?`<p>High score: <b>${best}</b></p>`:''}
      <div class="row" style="justify-content:center">${['easy','medium','hard'].map(d=>`<button class="btn ${d==='medium'?'primary':''} big" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div></div>`;
    $$('[data-d]',stage).forEach(b=>b.onclick=()=>play(b.dataset.d));
  }
  function play(diff){
    let lives=3,score=0,level=1,hits=0,speed={easy:20,medium:32,hard:48}[diff],queue=shuffle(cards),cur=null,q=null,y=0,last=0,st='fall';
    stage.innerHTML=`<div class="grav" id="gf"><div class="ghud"><span id="gl"></span><span id="glv"></span><span id="gs"></span></div><div class="ast" id="ast"></div><div class="ground"></div></div><form class="row wform" id="gform" style="margin-top:12px"><input class="wa" id="gin" autocomplete="off" spellcheck="false" placeholder="Type the answer and press Enter"><button class="btn primary">Enter</button></form>`;
    const gf=$('#gf'),ast=$('#ast'),gin=$('#gin');
    const hud=()=>{$('#gl').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('#glv').textContent='Level '+level;$('#gs').textContent='Score '+score};
    function spawn(){
      $('.gmsg',gf)?.remove();
      if(!queue.length)queue=shuffle(cards);
      cur=queue.shift();q=qa(s,cur);
      ast.className='ast';ast.style.display='';ast.innerHTML=nl(q.prompt);
      ast.style.left=(4+Math.random()*48)+'%';y=-ast.offsetHeight;ast.style.top=y+'px';
      st='fall';last=performance.now();gin.value='';gin.focus();hud();
      cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
    }
    function loop(t){
      if(st!=='fall')return;
      const dt=Math.min(.05,(t-last)/1000);last=t;y+=speed*dt;ast.style.top=y+'px';
      if(y+ast.offsetHeight>=gf.clientHeight-26)return miss();
      raf=requestAnimationFrame(loop);
    }
    function miss(){
      st='miss';lives--;record(cur,false);touch(s);ast.style.display='none';queue.splice(Math.min(2,queue.length),0,cur);hud();
      if(lives<=0)return over();
      gf.insertAdjacentHTML('beforeend',`<div class="gmsg"><div>It hit the ground! The answer was:</div><div class="okc">${nl(q.answer)}</div><div class="sm">Type it below to continue</div></div>`);
      gin.value='';gin.focus();
    }
    $('#gform').onsubmit=e=>{
      e.preventDefault();const v=gin.value;if(!v.trim())return;
      if(st==='fall'){
        if(grade(v,q.answer)!=='wrong'){
          st='hit';cancelAnimationFrame(raf);record(cur,true);touch(s);hits++;score+=10*level+Math.max(0,Math.round((gf.clientHeight-y)/20));
          if(hits%5===0){level++;speed*=1.18}
          ast.classList.add('boom');hud();setTimeout(()=>{if(st==='hit')spawn()},380);
        }else{gin.classList.remove('shake');void gin.offsetWidth;gin.classList.add('shake');gin.select()}
      }else if(st==='miss'){
        if(norm(v)===norm(q.answer))spawn();else{gin.classList.remove('shake');void gin.offsetWidth;gin.classList.add('shake');gin.select()}
      }
    };
    function over(){
      cancelAnimationFrame(raf);const best=DB.best[key]||0,rec=score>best;if(rec){DB.best[key]=score;save()}queueProgress();
      gf.insertAdjacentHTML('beforeend',`<div class="gmsg">${heroIc(rec?'trophy':'comet',rec)}<h2 style="margin:4px 0">Game over</h2><div>The last answer was:</div><div class="okc">${nl(q.answer)}</div><div>Score <b>${score}</b> · Level ${level}${rec?' · <b>New high score!</b>':` · Best ${best}`}</div><div class="row" style="margin-top:16px;justify-content:center"><button class="btn primary" id="gAgain">Play again</button><button class="btn" id="gMenu">Change difficulty</button></div></div>`);
      $('#gform').remove();
      $('#gAgain').onclick=()=>play(diff);$('#gMenu').onclick=intro;
    }
    hud();spawn();
  }
  intro();
}



/* ========== environments ========== */

      <g fill="#05070a"><rect x="1190" y="70" width="140" height="100" rx="6"/><path d="M1180 72 L1260 26 L1340 72Z"/><rect x="1196" y="170" width="8" height="52"/><rect x="1316" y="170" width="8" height="52"/><path d="M1200 220 L1320 172 M1320 220 L1200 172" stroke="#05070a" stroke-width="5"/>
      <rect x="296" y="40" width="5" height="182"/><path d="M270 120h58M280 90h38M286 64h26" stroke="#05070a" stroke-width="4"/><rect x="520" y="180" width="60" height="40"/><rect x="900" y="196" width="34" height="24"/></g>
      <circle class="blink" cx="298.5" cy="36" r="5" fill="#ff3b3b"/></svg>`;

/* ========== training simulator ========== */
function viewSim(s){
  const cards=pool(s).filter(c=>c.term.trim()&&c.def.trim());
  if(cards.length<2)return shell(s,'Simulator',{},emptyStudy(s));
  shell(s,V('Training Simulator','Timed exam'),{},`<div id="stage"></div>`);
  const stage=$('#stage'),key=s.id+':sim';let tmr=null;onCleanup(()=>clearInterval(tmr));
  const STAGES=[{name:'Warm-up',type:'mc',sec:20},{name:'Pressure',type:'mc',sec:12},{name:'Typed answers',type:'written',sec:25}];
  function intro(){
    const best=DB.best[key];
    stage.innerHTML=`<div class="card qcard" style="max-width:560px;margin:16px auto"><h2 style="margin-top:0">${V('Training Simulator','Timed exam')}</h2>
      <p class="muted">Three stages that get harder: multiple choice with 20 seconds, then 12 seconds, then typed answers with 25 seconds. Fast answers and streaks score more. Running out of time counts as a miss.</p>
      <label class="opt"><span>Questions <span class="muted sm">(max ${cards.length})</span></span><input type="number" id="simN" min="3" max="${cards.length}" value="${Math.min(15,cards.length)}" style="width:100px"></label>
      ${best?`<p>Best score: <b>${best.toLocaleString()}</b></p>`:''}
      <div class="row end"><button class="btn primary big" id="simGo">Start <kbd>Enter</kbd></button></div></div>`;
    const go=()=>run(Math.max(3,Math.min(cards.length,parseInt($('#simN').value)||10)));
    $('#simGo').onclick=go;setKeys(e=>{if(e.key==='Enter'&&!isTyping(e)){e.preventDefault();go()}});
  }
  function run(n){
    const qs=sample(cards,n);let i=0,score=0,streak=0,bestStreak=0;const res=[];
    const ask=()=>{
      if(i>=qs.length)return results();
      const st=STAGES[Math.min(2,Math.floor(i/(n/3)))],c=qs[i],q=qa(s,c);let left=st.sec,t0=performance.now(),answered=false;
      stage.innerHTML=`<div class="simhud"><span>${st.name} · ${i+1}/${n}</span><span>Streak ×${(1+Math.min(streak,10)*.1).toFixed(1)}</span><span>Score <b id="simS">${score.toLocaleString()}</b></span></div><div class="simbar"><i id="simT"></i></div><div id="simQ"></div>`;
      const ctl=presentQ($('#simQ'),s,c,q,st.type,()=>{i++;ask()},st.name,ok=>{
        answered=true;clearInterval(tmr);const dt=(performance.now()-t0)/1000;
        if(ok){streak++;bestStreak=Math.max(bestStreak,streak);const pts=Math.round((100+Math.max(0,st.sec-dt)*10)*(1+Math.min(streak-1,10)*.1));score+=pts}else streak=0;
        res.push({c,q,ok,dt,stage:st.name});$('#simS').textContent=score.toLocaleString();
      });
      const bar=$('#simT');bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${st.sec}s linear`;bar.style.width='0%';
      clearInterval(tmr);tmr=setInterval(()=>{left-=.25;if(left<=0&&!answered){clearInterval(tmr);ctl.timeout()}},250);
    };
    ask();
    function results(){
      clearInterval(tmr);setKeys(null);
      const ok=res.filter(r=>r.ok).length,avg=res.reduce((a,r)=>a+r.dt,0)/res.length,best=DB.best[key]||0,rec=score>best;
      if(rec){DB.best[key]=score;save()}if(ok/res.length>=.8||rec)celebrate();touch(s);queueProgress();
      stage.innerHTML=`<div class="card score"><div class="ring" style="--p:${Math.round(ok/res.length*100)}">${Math.round(ok/res.length*100)}%</div><div><h2 style="margin:0 0 4px">${rec?'New best score':'Simulation complete'}: ${score.toLocaleString()}</h2><p style="margin:0 0 10px">${ok}/${res.length} correct · ${avg.toFixed(1)}s average · best streak ${bestStreak}</p><div class="row"><button class="btn primary" id="simAgain">Run again</button><a class="btn" href="#/detective">${V('Detective Mode','Weak spots')}</a></div></div></div>
        <div class="casestats card" style="margin-top:14px">${STAGES.map(st=>{const r=res.filter(x=>x.stage===st.name);return `<div><b>${r.length?Math.round(r.filter(x=>x.ok).length/r.length*100):0}%</b><small>${st.name} (${r.length})</small></div>`}).join('')}<div><b>${avg.toFixed(1)}s</b><small>avg response</small></div></div>
        ${res.some(r=>!r.ok)?`<h2>Missed</h2><div class="card terms" style="padding:0">${res.filter(r=>!r.ok).map(r=>`<div class="t"><div class="tt">${nl(r.q.prompt)}</div><div>${nl(r.q.answer)}</div><span class="muted sm">${r.stage}</span></div>`).join('')}</div>`:''}`;
      $('#simAgain').onclick=intro;
    }
  }
  intro();
}
/* ========== mission planner (exam dates) ========== */
function examPlan(s){
  if(!s.exam)return null;const days=Math.round((new Date(s.exam+'T00:00')-new Date(ymd()+'T00:00'))/DAY);if(days<0)return null;
  const left=s.cards.filter(c=>status(c)!=='master').length,per=Math.ceil(left/Math.max(1,days)),today=ymd();
  const done=s.cards.filter(c=>c.mAt&&ymd(new Date(c.mAt))===today).length;
  return{days,left,per,done};
}
/* ========== detective mode ========== */
function viewDetective(){
  const all=[];DB.sets.forEach(x=>x.cards.forEach(c=>all.push({c,s:x})));
  const answered=all.filter(o=>o.c.right+o.c.wrong>0);
  const R=answered.reduce((a,o)=>a+o.c.right,0),W=answered.reduce((a,o)=>a+o.c.wrong,0);
  const unres=all.filter(o=>isUnresolved(o.c));
  const report=answered.filter(o=>o.c.wrong>0).sort((a,b)=>(b.c.wrong-b.c.right*.5)-(a.c.wrong-a.c.right*.5)).slice(0,20);
  const weak=weakest();
  const mixes=[];DB.sets.forEach(x=>x.cards.forEach(c=>{if(c.mix)for(const id in c.mix){const o=x.cards.find(y=>y.id===id);if(o)mixes.push({a:c,b:o,n:c.mix[id],s:x})}}));
  mixes.sort((p,q)=>q.n-p.n);
  app.innerHTML=`<a class="btn ghost sm" href="#/progress">← Progress</a>
  <h1 style="margin-top:8px">${V('Detective Mode','Weak spots')}</h1>
  <p class="muted">${V('Every mistake is evidence. This report finds the cards you keep missing so you can close them out.','The cards you miss most, across every set.')}</p>
  <div class="casestats card" style="margin:14px 0">
    <div><b>${unres.length}</b><small>${V('unresolved evidence','cards to fix')}</small></div>
    <div><b>${R+W?Math.round(R/(R+W)*100):0}%</b><small>overall accuracy</small></div>
    <div><b>${answered.length}</b><small>cards examined</small></div>
    <div><b>${W}</b><small>total misses</small></div>
  </div>
  <div class="row">${unres.length?`<a class="btn primary big" href="#/learn/unresolved">${V('Study unresolved evidence','Study weak cards')}</a><a class="btn big" href="#/flash/unresolved">Flashcards (rate 1–4)</a><a class="btn big" href="#/test/unresolved">Test me on them</a>`:`<span class="muted">Nothing unresolved right now. Miss a card in any mode and it shows up here.</span>`}</div>
  ${weak.length?`<h2>${V('Weakest cases','Weakest sets')}</h2><div class="card terms" style="padding:0">${weak.map(w=>`<div class="t"><div class="tt">${esc(w.s.title)}</div><div>${Math.round(w.acc*100)}% accuracy · ${w.open} ${V('in progress','still learning')}</div><a class="pill" href="#/learn/${w.s.id}">Train</a></div>`).join('')}</div>`:''}
  ${mixes.length?`<h2>Mixed-up terms</h2><p class="muted sm" style="margin-top:-6px">You described one of these when you were asked about the other.</p><div class="card terms" style="padding:0">${mixes.slice(0,12).map(m=>`<div class="t"><div class="tt">${nl(m.a.term)} <span class="muted">↔</span> ${nl(m.b.term)}</div><div><span class="muted sm">${esc(m.a.term)}:</span> ${nl(m.a.def)}<br><span class="muted sm">${esc(m.b.term)}:</span> ${nl(m.b.def)}<div class="muted sm"><a href="#/set/${m.s.id}">${esc(m.s.title)}</a></div></div><div class="sm nowrap"><b>${m.n}×</b></div></div>`).join('')}</div>`:''}
  <h2>${V('Weakness report','Most-missed cards')}</h2>
  ${report.length?`<div class="card terms" style="padding:0">${report.map(o=>`<div class="t"><div class="tt">${nl(o.c.term)}</div><div>${nl(o.c.def)}<div class="muted sm"><a href="#/set/${o.s.id}">${esc(o.s.title)}</a></div></div><div class="sm nowrap"><b style="color:var(--bad)">✗ ${o.c.wrong}</b> · <span style="color:var(--ok)">✓ ${o.c.right}</span></div></div>`).join('')}</div>`:'<div class="card empty muted">No misses recorded yet.</div>'}`;
}

async function importBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){return toast('That file isn’t valid JSON')}
  if(!d||!Array.isArray(d.sets))return toast('No study sets found in that file');
  const replace=d.folders&&(await confirmBox(`This backup has <b>${d.sets.length}</b> sets. Replace everything you have now, or merge?`,'Replace everything'));
  if(replace){DB=Object.assign(blank(),d);DB.sets.forEach(fixSet)}
  else{
    (d.folders||[]).forEach(f=>{if(!DB.folders.some(x=>x.id===f.id))DB.folders.push(f)});
    d.sets.forEach(s=>{fixSet(s);const k=DB.sets.findIndex(x=>x.id===s.id);if(k>=0)DB.sets[k]=s;else DB.sets.push(s)});
    if(d.best)Object.assign(DB.best,d.best);
  }
  saveNow();toast(`Imported ${d.sets.length} set${d.sets.length>1?'s':''}`);location.hash='#/';route();
}

    card.style.left=Math.max(12,Math.min(r.left+r.width/2-cw/2,innerWidth-cw-12))+'px';
    card.style.top=(below?r.bottom+pad+14:Math.max(12,r.top-pad-14-ch))+'px';
  };
  window.tourPlace=place;
  if(el){const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-40){el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(place,420);setTimeout(place,900)}else place()}else place();
  requestAnimationFrame(place);
}

function applyTheme(){const t=DB.settings.theme||'charcoal';document.documentElement.dataset.theme=t==='system'?(mq.matches?'dark':'light'):t}
mq.addEventListener?.('change',applyTheme);
buildCity();
applyTheme();applyEnv();ambBtn();$('#ambBtn').onclick=()=>{hideAmbHint();ambPanel()};
const firstVisit=!DB.settings.tourDone&&DB.settings.newUser;ambAutostart();if(firstVisit)setTimeout(startTour,700);
route();
setTimeout(checkProgress,1200);
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{ // parallax + lightning (midnight only)
  let pend=false;addEventListener('scroll',()=>{if(pend||document.documentElement.dataset.theme!=='midnight')return;pend=true;requestAnimationFrame(()=>{const y=Math.min(scrollY,1500);$('#cityFar').style.transform=`translateY(${y*-.015}px)`;$('#city').style.transform=`translateY(${y*-.05}px)`;pend=false})},{passive:true});
  const strike=()=>{const sc=$('#scene');if(document.visibilityState==='visible'){if(document.documentElement.dataset.theme==='midnight'&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&sc.dataset.env!=='cave'){sc.classList.remove('strike');void sc.offsetWidth;sc.classList.add('strike')}if(window.onLightning)onLightning()}setTimeout(strike,18000+Math.random()*30000)};
  setTimeout(strike,9000);
})();
