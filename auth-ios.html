<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Returning to QuizCraft</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141518;color:#ebe9e4;font:17px -apple-system,system-ui,sans-serif;text-align:center}a{color:#c6a660}</style></head>
<body><div><p>Returning to the QuizCraft app…</p><p><a id="go" href="#">Tap here if nothing happens</a></p></div>
<script>
// Hands the sign-in result (in the URL) back to the QuizCraft iPhone app.
var target='quizcraft://auth'+location.search+location.hash;
document.getElementById('go').href=target;
location.replace(target);
</script></body></html>
